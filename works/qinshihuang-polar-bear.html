<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秦始皇骑北极熊</title>
<style>
  :root { --T: 1.2s; }
  html, body { margin: 0; height: 100%; background: #0d1828; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  svg#scene {
    display: block; overflow: hidden;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
  }

  /* ---------- 背景滚动（周期均为 1.2s 的整数倍，首尾无缝） ---------- */
  .scroll-cloud { animation: scroll960 144s linear infinite; }
  .scroll-far   { animation: scroll960 96s linear infinite; }
  .scroll-near  { animation: scroll960 48s linear infinite; }
  .scroll-mound { animation: scroll480 7.2s linear infinite; }
  .scroll-fg    { animation: scroll288 2.4s linear infinite; }
  @keyframes scroll960 { to { transform: translateX(-960px); } }
  @keyframes scroll480 { to { transform: translateX(-480px); } }
  @keyframes scroll288 { to { transform: translateX(-288px); } }

  .streak { animation: streak 2.4s linear infinite; }
  @keyframes streak {
    from { transform: translateX(1060px); }
    to   { transform: translateX(-300px); }
  }

  /* ---------- 熊：整体起伏、腿、头、尾 ---------- */
  .shadow { transform-origin: 470px 460px; animation: shadowPulse calc(var(--T) / 2) ease-in-out infinite; }
  @keyframes shadowPulse { 0%,100% { transform: scaleX(.96); } 50% { transform: scaleX(1.0); } }

  .bob { animation: bob calc(var(--T) / 2) ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  .legA, .legB { transform-origin: 0 0; animation: swing var(--T) ease-in-out infinite; }
  .kneeA, .kneeB { transform-origin: 0 0; animation: knee var(--T) ease-in-out infinite; }
  .legB, .kneeB { animation-delay: calc(var(--T) / -2); }
  @keyframes swing { 0%,100% { transform: rotate(24deg); } 50% { transform: rotate(-24deg); } }
  @keyframes knee {
    0%       { transform: rotate(0deg); }
    28%      { transform: rotate(42deg); }
    48%      { transform: rotate(8deg); }
    55%,100% { transform: rotate(0deg); }
  }

  .tail { transform-origin: 292px 324px; animation: wag calc(var(--T) / 2) ease-in-out infinite; }
  @keyframes wag { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }

  .head { transform-origin: 575px 325px; animation: nod calc(var(--T) / 2) ease-in-out infinite; animation-delay: -0.15s; }
  @keyframes nod { 0%,100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }

  /* ---------- 秦始皇：身体晃动（比熊略滞后）、头、旒、胡须、衣摆、披风 ---------- */
  .rider { transform-origin: 0 0; animation: riderSway calc(var(--T) / 2) ease-in-out infinite; animation-delay: -0.51s; }
  @keyframes riderSway {
    0%,100% { transform: translateY(0) rotate(-1.2deg); }
    50%     { transform: translateY(-4px) rotate(1.2deg); }
  }

  .headR { transform-origin: 4px -72px; animation: headTilt var(--T) ease-in-out infinite; }
  @keyframes headTilt { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }

  .liu { transform-origin: 0 0; animation: liuSwing var(--T) ease-in-out infinite; animation-delay: calc(var(--i) * -0.07s); }
  @keyframes liuSwing { 0%,100% { transform: rotate(5deg); } 50% { transform: rotate(20deg); } }
  .liuRear { transform-origin: 0 0; animation: liuRear var(--T) ease-in-out infinite; animation-delay: calc(var(--i) * -0.1s); }
  @keyframes liuRear { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(26deg); } }

  .beard { transform-origin: 4px -80px; animation: beardSway var(--T) ease-in-out infinite; animation-delay: -0.3s; }
  @keyframes beardSway { 0%,100% { transform: rotate(2deg); } 50% { transform: rotate(8deg); } }

  .skirt { transform-origin: 0 -12px; animation: skirtSkew var(--T) ease-in-out infinite; }
  @keyframes skirtSkew { 0%,100% { transform: skewX(-1.5deg); } 50% { transform: skewX(-5deg); } }
  .pan { transform-origin: 0 0; animation: panSwing var(--T) ease-in-out infinite; animation-delay: calc(var(--i) * -0.1s); }
  @keyframes panSwing { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(15deg); } }

  .cape1 { transform-origin: -34px -40px; animation: capeA var(--T) ease-in-out infinite; }
  .cape2 { transform-origin: -34px -36px; animation: capeA var(--T) ease-in-out infinite; animation-delay: -0.35s; }
  @keyframes capeA {
    0%,100% { transform: rotate(-3deg) skewY(0deg); }
    50%     { transform: rotate(6deg) skewY(-5deg); }
  }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttl desc">
  <title id="ttl">秦始皇骑北极熊</title>
  <desc id="desc">秦始皇身穿深色龙袍、头戴冕冠，骑着北极熊在雪地上前行，背景有雪山和飘落的雪花。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa7d6"/><stop offset=".6" stop-color="#cfe2f3"/><stop offset="1" stop-color="#f1f7fc"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fffbe6" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#fff3c4" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farGrad" gradientUnits="userSpaceOnUse" x1="0" y1="220" x2="0" y2="420">
      <stop offset="0" stop-color="#b3c4e0"/><stop offset="1" stop-color="#dce7f4"/>
    </linearGradient>
    <linearGradient id="nearGrad" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="420">
      <stop offset="0" stop-color="#7f99bd"/><stop offset="1" stop-color="#c4d5ea"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2fa"/><stop offset=".5" stop-color="#dbe8f4"/><stop offset="1" stop-color="#c3d6ea"/>
    </linearGradient>
    <linearGradient id="bodyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="245" x2="0" y2="425">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dde9f4"/>
    </linearGradient>
    <linearGradient id="headGrad" gradientUnits="userSpaceOnUse" x1="0" y1="270" x2="0" y2="372">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4eef7"/>
    </linearGradient>

    <!-- 云 -->
    <g id="cloudTile" fill="#fff" opacity=".7">
      <g transform="translate(170,84)"><ellipse rx="52" ry="12"/><ellipse cx="-18" cy="-9" rx="26" ry="12"/><ellipse cx="14" cy="-12" rx="30" ry="14"/></g>
      <g transform="translate(500,56)"><ellipse rx="60" ry="12"/><ellipse cx="-20" cy="-9" rx="28" ry="12"/><ellipse cx="18" cy="-12" rx="32" ry="14"/></g>
      <g transform="translate(790,150)"><ellipse rx="44" ry="10"/><ellipse cx="-12" cy="-8" rx="22" ry="10"/><ellipse cx="12" cy="-10" rx="24" ry="11"/></g>
    </g>

    <!-- 远山（左右端 y 相同，可无缝拼接） -->
    <path id="farTile" fill="url(#farGrad)"
      d="M0,420 L0,310 L80,260 L170,300 L260,235 L360,305 L450,265 L560,300 L660,225 L760,300 L860,255 L960,310 L960,420 Z"/>

    <!-- 近山 -->
    <g id="nearTile">
      <path fill="url(#nearGrad)"
        d="M0,420 L0,300 L110,220 L190,300 L330,170 L450,290 L560,230 L670,310 L780,190 L880,290 L960,300 L960,420 Z"/>
      <g fill="#30487a" opacity=".16">
        <path d="M110,220 L190,300 L190,420 L130,420 Z"/>
        <path d="M330,170 L450,290 L450,420 L350,420 Z"/>
        <path d="M560,230 L670,310 L670,420 L585,420 Z"/>
        <path d="M780,190 L880,290 L880,420 L805,420 Z"/>
      </g>
      <g fill="#f4f8fd">
        <path d="M110,220 L63,254 L80,246 L92,262 L106,250 L120,266 L132,252 L144,254 Z"/>
        <path d="M330,170 L276,220 L296,208 L310,232 L326,214 L342,236 L358,212 L370,228 L380,220 Z"/>
        <path d="M560,230 L505,260 L524,252 L538,270 L554,254 L568,272 L582,254 L592,262 L601,260 Z"/>
        <path d="M780,190 L739,235 L756,224 L768,246 L782,228 L796,248 L810,226 L825,235 Z"/>
      </g>
    </g>

    <!-- 杉树 -->
    <g id="fir">
      <rect x="-2.5" y="-3" width="5" height="7" fill="#4a3a2e"/>
      <path d="M0,-48 L15,-24 L8,-24 L19,-3 L-19,-3 L-8,-24 L-15,-24 Z" fill="#2d5a5e"/>
      <path d="M0,-48 L8.5,-33 L3,-34 L0,-30 L-4,-35 L-8.5,-33 Z" fill="#f2f8fd"/>
      <path d="M-15,-24 L-8,-24 L-11,-18 Z M15,-24 L8,-24 L11,-18 Z" fill="#f2f8fd"/>
    </g>

    <!-- 中景雪丘 -->
    <g id="moundTile">
      <path fill="#e9f1f9" d="M0,410 Q60,378 140,398 Q200,412 260,392 Q340,368 420,398 Q455,408 480,410 L480,440 L0,440 Z"/>
      <g fill="#e9f1f9">
        <ellipse cx="62" cy="397" rx="24" ry="5"/><ellipse cx="90" cy="402" rx="16" ry="4"/>
        <ellipse cx="342" cy="384" rx="22" ry="5"/><ellipse cx="372" cy="391" rx="14" ry="4"/>
        <ellipse cx="440" cy="402" rx="14" ry="4"/>
      </g>
      <g transform="translate(62,398) scale(1.15)"><use href="#fir"/></g>
      <g transform="translate(90,403) scale(.7)"><use href="#fir"/></g>
      <g transform="translate(342,385) scale(1.3)"><use href="#fir"/></g>
      <g transform="translate(372,392) scale(.8)"><use href="#fir"/></g>
      <g transform="translate(440,403) scale(.6)"><use href="#fir"/></g>
    </g>

    <!-- 前景雪地纹理（宽 288） -->
    <g id="fgTile">
      <ellipse cx="30" cy="440" rx="22" ry="3" fill="#c7d9ec"/>
      <ellipse cx="120" cy="468" rx="36" ry="4.5" fill="#cfe0f0"/>
      <ellipse cx="210" cy="448" rx="18" ry="2.6" fill="#c7d9ec"/>
      <ellipse cx="70" cy="506" rx="46" ry="6" fill="#c9dbed"/>
      <ellipse cx="240" cy="520" rx="38" ry="5" fill="#cfe0f0"/>
      <ellipse cx="172" cy="492" rx="14" ry="2.4" fill="#fff" opacity=".8"/>
      <ellipse cx="258" cy="478" rx="20" ry="3" fill="#fff" opacity=".7"/>
      <ellipse cx="14" cy="480" rx="12" ry="2.2" fill="#fff" opacity=".7"/>
      <circle cx="96" cy="436" r="1.6" fill="#fff"/><circle cx="188" cy="526" r="1.8" fill="#fff"/>
      <circle cx="262" cy="446" r="1.5" fill="#fff"/><circle cx="48" cy="474" r="1.4" fill="#fff"/>
    </g>

    <!-- 熊身体/头的轮廓（先描边再填充，隐藏内部接缝） -->
    <g id="bodyShape">
      <ellipse cx="385" cy="345" rx="102" ry="78"/>
      <ellipse cx="450" cy="340" rx="120" ry="82"/>
      <ellipse cx="530" cy="326" rx="76" ry="80"/>
    </g>
    <g id="headShape">
      <ellipse cx="585" cy="322" rx="55" ry="52"/>
      <ellipse cx="628" cy="315" rx="46" ry="40"/>
      <ellipse cx="672" cy="327" rx="34" ry="22"/>
    </g>

    <!-- 冕冠旒穗 -->
    <g id="liuStr">
      <line x1="0" y1="0" x2="0" y2="21" stroke="#d9c078" stroke-width="1.1"/>
      <circle cx="0" cy="5" r="2.2" fill="#6fc9a8"/>
      <circle cx="0" cy="10" r="2.2" fill="#c0392b"/>
      <circle cx="0" cy="15" r="2.2" fill="#f2e6c0"/>
      <circle cx="0" cy="21" r="2.9" fill="#6fc9a8" stroke="#d9c078" stroke-width=".8"/>
    </g>
  </defs>

  <!-- ============ 天空与远景 ============ -->
  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="790" cy="108" r="90" fill="url(#sunGlow)"/>
  <circle cx="790" cy="108" r="26" fill="#fffbe8"/>
  <g class="scroll-cloud"><use href="#cloudTile"/><use href="#cloudTile" x="960"/></g>
  <g class="scroll-far"><use href="#farTile"/><use href="#farTile" x="960"/></g>
  <g class="scroll-near"><use href="#nearTile"/><use href="#nearTile" x="960"/></g>
  <g class="scroll-mound"><use href="#moundTile"/><use href="#moundTile" x="480"/><use href="#moundTile" x="960"/></g>

  <!-- ============ 雪地 ============ -->
  <rect x="0" y="404" width="960" height="136" fill="url(#groundGrad)"/>
  <g class="scroll-fg">
    <use href="#fgTile"/><use href="#fgTile" x="288"/><use href="#fgTile" x="576"/><use href="#fgTile" x="864"/><use href="#fgTile" x="1152"/>
  </g>

  <!-- 后层雪花 -->
  <g id="snowBack"></g>

  <!-- 风痕 -->
  <g stroke="#fff" stroke-linecap="round" fill="none">
    <g class="streak" style="animation-duration:2.4s;animation-delay:-0.3s"><line x1="0" y1="150" x2="130" y2="150" stroke-width="2" opacity=".45"/></g>
    <g class="streak" style="animation-duration:3.6s;animation-delay:-1.8s"><line x1="0" y1="205" x2="90" y2="205" stroke-width="1.6" opacity=".4"/></g>
    <g class="streak" style="animation-duration:2.4s;animation-delay:-1.5s"><line x1="0" y1="372" x2="110" y2="372" stroke-width="2" opacity=".4"/></g>
    <g class="streak" style="animation-duration:3.6s;animation-delay:-0.6s"><line x1="0" y1="496" x2="150" y2="496" stroke-width="2.2" opacity=".5"/></g>
    <g class="streak" style="animation-duration:4.8s;animation-delay:-3.0s"><line x1="0" y1="118" x2="100" y2="118" stroke-width="1.4" opacity=".35"/></g>
  </g>

  <!-- 影子 -->
  <ellipse class="shadow" cx="470" cy="460" rx="215" ry="15" fill="#5a7396" opacity=".28"/>

  <!-- ============ 北极熊 + 秦始皇 ============ -->
  <g class="bob">

    <!-- 尾巴 -->
    <g class="tail">
      <ellipse cx="282" cy="322" rx="17" ry="13" fill="#f4f8fb" stroke="#9db4cb" stroke-width="2.2"/>
    </g>

    <!-- 远侧腿：后腿 B 相、前腿 A 相（对角同步） -->
    <g transform="translate(392,384)">
      <g class="legA">
        <path d="M-18,-10 Q-22,14 -16,32 L16,32 Q22,14 18,-10 Z" fill="#c9d9e8"/>
        <path d="M-18,-2 Q-22,14 -16,32 M18,-2 Q22,14 16,32" fill="none" stroke="#94abc2" stroke-width="2.2" stroke-linecap="round"/>
        <g transform="translate(0,32)"><g class="kneeA">
          <path d="M-16,-1 Q-19,16 -17,28 Q-24,36 -14,44 L18,44 Q28,44 26,34 Q22,26 16,26 Q19,12 16,-1 Z" fill="#c9d9e8"/>
          <circle r="16" fill="#c9d9e8"/>
          <path d="M-16,-1 Q-19,16 -17,28 Q-24,36 -14,44 L18,44 Q28,44 26,34 Q22,26 16,26 Q19,12 16,-1" fill="none" stroke="#94abc2" stroke-width="2.2" stroke-linejoin="round"/>
          <ellipse cx="25" cy="35" rx="2" ry="1.4" fill="#3b4856"/><ellipse cx="22" cy="40" rx="2" ry="1.4" fill="#3b4856"/>
        </g></g>
      </g>
    </g>
    <g transform="translate(518,384)">
      <g class="legB">
        <path d="M-18,-10 Q-22,14 -16,32 L16,32 Q22,14 18,-10 Z" fill="#c9d9e8"/>
        <path d="M-18,-2 Q-22,14 -16,32 M18,-2 Q22,14 16,32" fill="none" stroke="#94abc2" stroke-width="2.2" stroke-linecap="round"/>
        <g transform="translate(0,32)"><g class="kneeB">
          <path d="M-16,-1 Q-19,16 -17,28 Q-24,36 -14,44 L18,44 Q28,44 26,34 Q22,26 16,26 Q19,12 16,-1 Z" fill="#c9d9e8"/>
          <circle r="16" fill="#c9d9e8"/>
          <path d="M-16,-1 Q-19,16 -17,28 Q-24,36 -14,44 L18,44 Q28,44 26,34 Q22,26 16,26 Q19,12 16,-1" fill="none" stroke="#94abc2" stroke-width="2.2" stroke-linejoin="round"/>
          <ellipse cx="25" cy="35" rx="2" ry="1.4" fill="#3b4856"/><ellipse cx="22" cy="40" rx="2" ry="1.4" fill="#3b4856"/>
        </g></g>
      </g>
    </g>

    <!-- 头（在身体后面，肩部压住颈根） -->
    <g class="head">
      <circle cx="634" cy="271" r="12" fill="#d9e5f0" stroke="#9db4cb" stroke-width="2.2"/>
      <circle cx="610" cy="277" r="14" fill="#f4f8fb" stroke="#9db4cb" stroke-width="2.2"/>
      <circle cx="610" cy="279" r="7" fill="#e6c9cf"/>
      <use href="#headShape" fill="#9db4cb" stroke="#9db4cb" stroke-width="5" stroke-linejoin="round"/>
      <use href="#headShape" fill="url(#headGrad)"/>
      <ellipse cx="655" cy="324" rx="9" ry="5.5" fill="#f5c7c7" opacity=".5"/>
      <circle cx="648" cy="303" r="4.8" fill="#1b222a"/>
      <circle cx="649.8" cy="301.4" r="1.5" fill="#fff"/>
      <path d="M636,294 Q646,289 656,294" fill="none" stroke="#b5c8da" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="703" cy="319" rx="10" ry="7.5" fill="#1d232b"/>
      <ellipse cx="700" cy="316" rx="3.2" ry="1.6" fill="#fff" opacity=".5"/>
      <path d="M703,326 L703,333 M668,339 Q684,346 698,334" fill="none" stroke="#3b4a5a" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- 身体 -->
    <use href="#bodyShape" fill="#9db4cb" stroke="#9db4cb" stroke-width="5" stroke-linejoin="round"/>
    <use href="#bodyShape" fill="url(#bodyGrad)"/>
    <path d="M330,372 q6,-6 12,0 M470,396 q6,-6 12,0 M420,300 q6,-6 12,0 M505,364 q6,-6 12,0 M360,318 q6,-6 12,0 M560,350 q6,-6 12,0"
          fill="none" stroke="#bfd0e2" stroke-width="2" stroke-linecap="round"/>

    <!-- 马鞍毯 -->
    <path d="M378,268 Q455,248 536,252 L532,312 Q456,330 382,316 Z" fill="#8d1d2c" stroke="#d2ad55" stroke-width="2"/>
    <path d="M388,296 Q456,312 524,294" fill="none" stroke="#d2ad55" stroke-width="1.5"/>
    <path d="M382,319 Q456,333 532,315" fill="none" stroke="#d2ad55" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>

    <!-- 近侧腿：近后腿 B 相、近前腿 A 相，分别与远侧对角腿同步 -->
    <g transform="translate(350,386)">
      <g class="legB">
        <path d="M-18,-10 Q-22,14 -16,32 L16,32 Q22,14 18,-10 Z" fill="#eaf2f9"/>
        <path d="M-18,-2 Q-22,14 -16,32 M18,-2 Q22,14 16,32" fill="none" stroke="#9db4cb" stroke-width="2.2" stroke-linecap="round"/>
        <g transform="translate(0,32)"><g class="kneeB">
          <path d="M-16,-1 Q-19,16 -17,28 Q-24,36 -14,44 L18,44 Q28,44 26,34 Q22,26 16,26 Q19,12 16,-1 Z" fill="#eaf2f9"/>
          <circle r="16" fill="#eaf2f9"/>
          <path d="M-16,-1 Q-19,16 -17,28 Q-24,36 -14,44 L18,44 Q28,44 26,34 Q22,26 16,26 Q19,12 16,-1" fill="none" stroke="#9db4cb" stroke-width="2.2" stroke-linejoin="round"/>
          <ellipse cx="25" cy="35" rx="2" ry="1.4" fill="#3b4856"/><ellipse cx="22" cy="40" rx="2" ry="1.4" fill="#3b4856"/>
        </g></g>
      </g>
    </g>
    <g transform="translate(546,384)">
      <g class="legA">
        <path d="M-18,-10 Q-22,14 -16,32 L16,32 Q22,14 18,-10 Z" fill="#eaf2f9"/>
        <path d="M-18,-2 Q-22,14 -16,32 M18,-2 Q22,14 16,32" fill="none" stroke="#9db4cb" stroke-width="2.2" stroke-linecap="round"/>
        <g transform="translate(0,32)"><g class="kneeA">
          <path d="M-16,-1 Q-19,16 -17,28 Q-24,36 -14,44 L18,44 Q28,44 26,34 Q22,26 16,26 Q19,12 16,-1 Z" fill="#eaf2f9"/>
          <circle r="16" fill="#eaf2f9"/>
          <path d="M-16,-1 Q-19,16 -17,28 Q-24,36 -14,44 L18,44 Q28,44 26,34 Q22,26 16,26 Q19,12 16,-1" fill="none" stroke="#9db4cb" stroke-width="2.2" stroke-linejoin="round"/>
          <ellipse cx="25" cy="35" rx="2" ry="1.4" fill="#3b4856"/><ellipse cx="22" cy="40" rx="2" ry="1.4" fill="#3b4856"/>
        </g></g>
      </g>
    </g>

    <!-- ============ 秦始皇（原点在熊背座位） ============ -->
    <g transform="translate(450,260)">
      <g class="rider">

        <!-- 披风（随风飘） -->
        <g class="cape2">
          <path d="M-34,-56 C-60,-52 -92,-44 -118,-22 C-98,-22 -90,-10 -100,6 C-76,0 -54,-8 -34,-16 Z" fill="#7d1f2a" stroke="#c9a24b" stroke-width="1.2"/>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg', W = 960, H = 540;
  var flakes = [];
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function mod(v, m) { return ((v % m) + m) % m; }

  function build(id, n, rMin, rMax, vMin, vMax, oMin, oMax) {
    var g = document.getElementById(id);
    for (var i = 0; i < n; i++) {
      var r = rnd(rMin, rMax), k = (r - rMin) / (rMax - rMin);
      var el = document.createElementNS(NS, 'circle');
      el.setAttribute('r', r.toFixed(2));
      el.setAttribute('fill', '#fff');
      el.setAttribute('opacity', rnd(oMin, oMax).toFixed(2));
      g.appendChild(el);
      var v = vMin + (vMax - vMin) * k + rnd(-6, 6);
      flakes.push({
        el: el, x: rnd(0, W + 40), y: rnd(0, H + 20), v: v,
        wind: -(18 + v * 0.35),          // 熊向右走，雪被吹向左后方
        amp: rnd(6, 22), f: rnd(0.6, 1.6), ph: rnd(0, 6.283)
      });
    }
  }
  build('snowBack', 60, 1.1, 2.8, 28, 70, 0.55, 0.95);
  build('snowFront', 14, 3.4, 5.6, 90, 140, 0.3, 0.55);

  var t0 = performance.now();
  function frame(now) {
    var t = (now - t0) / 1000;
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      // 在画面外取模换位，循环时看不到跳变
      var x = mod(f.x + f.wind * t + Math.sin(t * f.f + f.ph) * f.amp, W + 40) - 20;
      var y = mod(f.y + f.v * t, H + 20) - 10;
      f.el.setAttribute('cx', x.toFixed(1));
      f.el.setAttribute('cy', y.toFixed(1));
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
