          <path d="M-131-112q5-33 54-36l63-2 72-19q31-13 44 17l25 51q10 38-34 50L4-42l-73-12q-49-8-62-58z" fill="url(#shell)" stroke="#2a5552" stroke-width="4"/>
          <path d="M-124-111q28-20 68-16l66 3 55-18q24-8 34 6M-86-67q28 11 52 12l91 1q44-1 60-20" fill="none" stroke="#deefd5" stroke-opacity=".8" stroke-width="3"/>
          <path d="M-142-113h24v10h-24q-7-4 0-10z" fill="#f18c70" stroke="#2a5552" stroke-width="3"/>

          <path d="M66-120q18-38 24-61c4-20 13-41 36-42 20-1 35 12 36 31l-6 21q-7 22-29 32-12 13-14 48" fill="url(#shell)" stroke="#2a5552" stroke-width="4"/>
          <path d="M81-124q21-26 28-49m-5-18q5-17 21-19" fill="none" stroke="#eaf6d8" stroke-width="3"/>
          <path d="M128-186q20-3 32-12 28 4 54 15l39 12q9 3 5 9-5 6-26 5l-60 2q-33 28-47 4-6-13 3-35z" fill="url(#bill)" stroke="#634d3a" stroke-width="4"/>
          <path d="M130-171q38 6 71 3l56 1m-114-15q27-7 44-1" fill="none" stroke="#a96440" stroke-width="2.4"/><path d="M131-166q7 15 18 16l19-7" fill="none" stroke="#ffe5a0" stroke-width="3"/>
          <circle cx="129" cy="-198" r="13" fill="#e7f0ca" stroke="#315b57" stroke-width="2.5"/><circle cx="131" cy="-198" r="7" fill="#253d3c"/><circle cx="133" cy="-201" r="2.1" fill="#fff8d7"/>
          <path d="M111-216q-5-14-16-15" fill="none" stroke="#325b58" stroke-width="3"/><circle cx="94" cy="-232" r="4" fill="#ffbd76" stroke="#325b58" stroke-width="2"/>
          <g id="wing"><path d="M47-111q-34-27-85-10l-55 16q-12 5-5 15 26 30 77 23 42-3 68-31 4-5 0-13z" fill="url(#wingPaint)" stroke="#2f625d" stroke-width="4"/><path d="M-83-103q33 3 64-13m-54 24q33 3 59-11m-43 19q27 2 44-7" fill="none" stroke="#c2e9d1" stroke-width="3"/><circle cx="36" cy="-104" r="12" fill="#daedcd" stroke="#376760" stroke-width="3"/><circle cx="36" cy="-104" r="5" fill="#df9f55" stroke="#376760" stroke-width="2"/></g>
          <g fill="#ffd087" stroke="#35635b" stroke-width="2"><circle cx="-92" cy="-67" r="3.5"/><circle cx="63" cy="-72" r="3.5"/><circle cx="110" cy="-101" r="3.5"/></g><path d="M72-110l-7 14h9l-4 12 13-17h-9l5-9z" fill="#fbe5a4"/>

        <g id="bike" transform="translate(0 -187)">
          <g transform="translate(-59 0)"><g class="pedal-wheel"><use href="#bikeWheel"/></g></g><g transform="translate(70 0)"><g class="pedal-wheel"><use href="#bikeWheel"/></g></g>
          <path d="M-91-24q31-29 65-1m62 1q33-29 66 1" fill="none" stroke="#273332" stroke-width="4"/><path d="M-98-31h56m-48 0 17 21m17-19 10 18" fill="none" stroke="#273332" stroke-width="3"/>
          <path d="m-59 0 27-49h77L3-1h-62m27-48L3-1m42-48 25 49M45-49l-1-19q1-8 10-7l11 2m-98 24-5-13" fill="none" stroke="#202b2d" stroke-width="6"/><path d="M-22-46h53M10-4l30-34" stroke="#d3a36b" stroke-width="1.5"/><path d="M-49-64q12-4 27 0l-5 6h-17z" fill="#3b332f" stroke="#202b2d" stroke-width="2"/>
          <path d="M44-76q0-7 7-8 8 0 9 8z" fill="#ffcd69" stroke="#613f32" stroke-width="2"/><path d="M42-76h20m-7-6 4-4" stroke="#613f32" stroke-width="2"/>
          <path d="M-60-3H1q7 0 7 6T1 9h-60z" fill="#353e3e" stroke="#202b2d" stroke-width="2"/><circle cx="2" cy="0" r="9" fill="#d5b178" stroke="#25342f" stroke-width="2"/>
          <g transform="translate(2 0)"><g id="pedal"><path d="M-10-7 10 7m-14-14h-11m20 14h10" fill="none" stroke="#293733" stroke-width="3"/></g></g>
          <g transform="translate(-24 -85)"><g id="axolotl" shape-rendering="crispEdges"></g></g>
        </g>

      <g id="foreground"></g><g id="air-fx"></g>
    </svg>
  </section>
  <footer class="footer">
    <div class="route"><i class="route-dot" aria-hidden="true"></i><span class="micro">在途</span><span id="status" role="status">春日 · 骑行中</span></div>
    <div class="transport"><div class="counter"><span id="count-label">越障</span><output id="count" aria-labelledby="count-label" aria-live="off">00</output></div>
      <button id="play" type="button" title="暂停" aria-label="暂停"><svg viewBox="0 0 20 20" aria-hidden="true"><path id="play-icon" d="M7 4v12m6-12v12"/></svg></button>
      <button id="restart" type="button" title="重新出发" aria-label="重新出发"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 7a6.5 6.5 0 1 1 0 6m0-10v4h4"/></svg></button>
    </div>
  </footer>
</main>
<script>
'use strict';
const ns='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const svg=(name,attrs={},parent)=>{
  const node=document.createElementNS(ns,name);
  for(const [key,value] of Object.entries(attrs)) node.setAttribute(key,value);
  if(parent) parent.append(node);
  return node;
};
const themes={
  spring:{number:'01',name:'春日',place:'鲜花平原',title:'BLOOM VALLEY',motif:'flower',colors:['#f58783','#fff1bf','#e8a0a9','#eea553'],air:['#f78b81','#ffffd3']},
  summer:{number:'02',name:'盛夏',place:'金字塔遗迹',title:'PYRAMID DUNES',motif:'sprig',colors:['#a16847','#c0804d','#9a744b','#e0a369'],air:['#fff5be','#f3cd94']},
  autumn:{number:'03',name:'金秋',place:'落叶街道',title:'MAPLE AVENUE',motif:'leaf',colors:['#c0574b','#f3b458','#9e624e','#e08553'],air:['#e4764f','#f4bd66']},
  winter:{number:'04',name:'寒冬',place:'冰封雪山',title:'FROST PEAKS',motif:'sprig',colors:['#f2fcfc','#b5dbe6','#e1f4f6','#85b0c2'],air:['#f7ffff','#d2edf8']}
};
const stage=$('stage'), scene=$('scene');
const motion=window.matchMedia('(prefers-reduced-motion: reduce)');
const buttons=[...document.querySelectorAll('.seasons button')];
const wheels=[...scene.querySelectorAll('.rolling')], bikeWheels=[...scene.querySelectorAll('.pedal-wheel')];
const clouds=[...scene.querySelectorAll('.cloud-drift')].map(el=>({el,base:el.getAttribute('transform')}));
const rects=[
  ['#67394e',[[1,5,3,2],[0,8,5,2],[2,11,3,2],[13,5,3,2],[13,8,5,2],[13,11,3,2],[4,5,10,8],[6,12,8,7],[3,14,5,4],[6,17,5,3],[9,18,4,3],[12,20,5,2],[11,14,9,2]]],
  ['#ec758f',[[1,5,3,1],[0,8,5,1],[2,11,3,1],[13,5,3,1],[14,8,4,1],[13,11,3,1],[3,15,4,2],[6,16,6,3],[11,18,2,2],[13,20,3,1],[13,14,6,1]]],
  ['#ffafbc',[[4,6,10,6],[5,5,8,8],[7,12,6,5],[7,16,5,1],[12,14,2,1]]],
  ['#ffe1d2',[[6,6,7,2],[6,8,4,2],[7,13,5,2]]],
  ['#df657d',[[5,10,2,1],[11,10,2,1],[1,8,2,1],[15,8,2,1]]],
  ['#382b39',[[6,8,1,2],[11,8,1,2],[8,10,2,1],[9,11,1,1]]],
  ['#fff9e4',[[6,8,1,1],[11,8,1,1]]],
  ['#bf555e',[[5,12,8,1],[4,13,3,1],[4,14,1,3]]],
  ['#f59683',[[6,12,6,1],[5,13,2,1],[4,15,1,1]]]
];
const ax=$('axolotl');
for(const [fill,tiles] of rects) for(const [x,y,w,h] of tiles){
  svg('rect',{x:x*4-30,y:y*4-77,width:w*4,height:h*4,fill},ax);
}
const random=(min,max)=>min+Math.random()*(max-min);
const mod=(x,n)=>(x%n+n)%n;
const perRow=(group,length,spacing,make)=>{
  const host=$(group);
  return Array.from({length},(_,i)=>({el:make(host,i),x:i*spacing-230}));
};
const marks=perRow('road-marks',17,108,(g,i)=>svg('path',{d:`M0 0q27 ${i%2?1:0} 56 0`},g));
const decor=perRow('verge-details',29,63,(g,i)=>{
  const el=svg('g',{},g);
  svg('ellipse',{cx:3,cy:2,rx:13+(i%3)*4,ry:3.1,fill:'var(--fore)',opacity:.18},el);
  svg('use',{class:'decoration',transform:`rotate(${i%3*12-12}) scale(${.55+i%5*.15})`},el);
  if(i%3===0) svg('use',{class:'decoration',transform:'translate(19 2) scale(.56)'},el);
  return el;
});
const front=perRow('foreground',18,103,(g,i)=>{
  const el=svg('g',{},g);
  svg('use',{class:'decoration',transform:`scale(${.72+(i%4)*.2})`},el);
  if(i%2===0) svg('use',{class:'decoration',transform:'translate(26 0) scale(.82)'},el);
  return el;
});
const air=Array.from({length:25},(_,i)=>({el:svg('path',{},$('air-fx')),x:random(0,1750),y:random(220,665),speed:random(12,41),phase:random(0,6.3),size:random(1,3)+i%2}));
const dust=Array.from({length:12},()=>svg('circle',{fill:'var(--mark)'},$('ground-fx')));
const speed=245, origin=425, base=616, jumpStart=285, jumpTime=2.0;
let season='spring', running=!motion.matches, elapsed=0, distance=0, cleared=0, nextX=0, obstacles=[], jump=null, previous=null;
function updateLabels(){
  const action=running?'暂停':'继续';
  $('status').textContent=`${themes[season].name} · ${running?'骑行中':'已暂停'}`;
  $('play').setAttribute('aria-label',action);
  $('play').title=action;
  $('play-icon').setAttribute('d',running?'M7 4v12m6-12v12':'M7 4l9 6-9 6z');
}
function count(){ $('count').value=String(cleared).padStart(2,'0'); }
function spawn(x){
  const el=svg('g',{},$('obstacles'));
  svg('use',{href:`#obs-${season}`,transform:`scale(${random(.8,1.06).toFixed(3)})`},el);
  obstacles.push({x,el,triggered:false,counted:false});
}
function setSeason(key){
  season=key;
  const theme=themes[key];
  stage.dataset.season=key;
  $('chapter').textContent=`${theme.number} / ${theme.name}`;
  $('place').textContent=theme.place;
  $('subtitle').textContent=theme.title;
  for(const button of buttons){
    const active=button.dataset.season===key;
    button.setAttribute('aria-pressed',String(active));
    $(`land-${button.dataset.season}`).style.display=active?'':'none';
  }
  for(const [i,item] of [...decor,...front].entries()){
    for(const [j,u] of [...item.el.querySelectorAll('.decoration')].entries()){
      u.setAttribute('href',`#${theme.motif}`);
      u.setAttribute('color',theme.colors[(i+j*2)%theme.colors.length]);
    }
  }
  for(const [i,p] of air.entries()){
    p.el.setAttribute('fill',theme.air[i%2]);
    p.el.setAttribute('d',key==='autumn'?`M0 0q${p.size*3} ${-p.size*2} ${p.size*4} 0Q${p.size*2} ${p.size*3} 0 0z`:`M${-p.size} 0a${p.size} ${p.size} 0 1 0 ${p.size*2} 0a${p.size} ${p.size} 0 1 0 ${-p.size*2} 0`);
  }
  resetRide();
  updateLabels();
}
function resetRide(){
  elapsed=0;distance=0;cleared=0;jump=null;previous=null;
  $('obstacles').replaceChildren();obstacles=[];
  const first=random(890,960);
  spawn(first);nextX=first+random(700,1040);
  count();render();
}
function advance(dt){
  elapsed+=dt;
  distance+=speed*dt;
  while(nextX-distance<1550){spawn(nextX);nextX+=random(700,1040);}
  if(jump && elapsed-jump.at>=jumpTime) jump=null;
  for(const ob of obstacles){
    const px=ob.x-distance;
    if(!ob.triggered && !jump && px<=origin+jumpStart){ob.triggered=true;jump={at:elapsed};}
    if(ob.triggered && !ob.counted && px<origin-156){ob.counted=true;cleared++;count();}
  }
  while(obstacles.length && obstacles[0].x-distance<-260) obstacles.shift().el.remove();
}
function render(){
  const time=elapsed;
  const phase=jump?Math.min((time-jump.at)/jumpTime,1):0;
  const arc=jump?Math.sin(Math.PI*phase):0;
  const height=157*Math.pow(arc,1.07);
  const bob=Math.sin(time*8)*1.4*(1-arc);
  const pitch=jump?-12*Math.sin(2*Math.PI*phase)*arc:Math.sin(time*4)*.5;
  $('rider').setAttribute('transform',`translate(${origin} ${base-height+bob}) rotate(${pitch})`);
  $('shadow').setAttribute('rx',168-arc*41);
  $('shadow').setAttribute('opacity',.28-arc*.17);
  $('body').setAttribute('transform',`rotate(${pitch*.27} 0 -56)`);
  $('wing').setAttribute('transform',`rotate(${-32*arc+Math.sin(time*13)*7*arc} 36 -104)`);
  $('bike').setAttribute('transform',`translate(0 ${-187-arc*10}) rotate(${pitch*.66+arc*7})`);
  ax.setAttribute('transform',`translate(${arc*7} ${-arc*12}) rotate(${-arc*13+Math.sin(time*8)*1.5} 1 -16)`);
  for(const w of wheels) w.setAttribute('transform',`rotate(${distance*2.22%360})`);
  for(const w of bikeWheels) w.setAttribute('transform',`rotate(${distance*2.02%360})`);
  $('pedal').setAttribute('transform',`rotate(${(time*165)%360})`);
  for(const ob of obstacles) ob.el.setAttribute('transform',`translate(${ob.x-distance} 615)`);
  for(const item of marks) item.el.setAttribute('transform',`translate(${mod(item.x-distance+230,1836)-230} 593)`);
  for(const [i,item] of decor.entries()) item.el.setAttribute('transform',`translate(${mod(item.x-distance*.83+230,1827)-230} ${488+(i%4)*6})`);
  for(const [i,item] of front.entries()) item.el.setAttribute('transform',`translate(${mod(item.x-distance*1.12+230,1854)-230} ${674+(i%3)*4})`);
  for(const {el,base} of clouds) el.setAttribute('transform',`translate(${Math.sin(time*.11)*32} 0) ${base}`);
  for(const p of air){
    const x=mod(p.x-time*p.speed,1750)-230;
    const y=p.y+Math.sin(time*1.1+p.phase)*15;
    p.el.setAttribute('transform',`translate(${x} ${y}) rotate(${(time*32+p.phase*60)%360})`);
    p.el.setAttribute('opacity',season==='summer'?.22:season==='spring'?.53:.72);
  }
  for(const [i,bit] of dust.entries()){
    const age=mod(time*2.8+i*.19,1);
    bit.setAttribute('cx',origin-110-age*(54+i*2));
    bit.setAttribute('cy',base-7-age*(9+i%3*5));
    bit.setAttribute('r',1+age*(2.5+i%3));
    bit.setAttribute('opacity',(1-age)*.42*(1-arc));
  }
}
function frame(now){
  if(running){
    if(previous!==null) advance(Math.min((now-previous)/1000,.05));
    render();previous=now;
  }else previous=null;
  requestAnimationFrame(frame);
}
function fit(){
  const aspect=stage.clientWidth/Math.max(1,stage.clientHeight);
  const width=680*aspect;
  const left=width<1150?Math.max(0,origin-width*.43):(1280-width)/2;
  scene.setAttribute('viewBox',`${left} 0 ${width} 680`);
}
for(const button of buttons) button.addEventListener('click',()=>{
  if(season!==button.dataset.season) setSeason(button.dataset.season);
});
$('play').addEventListener('click',()=>{running=!running;previous=null;updateLabels();});
$('restart').addEventListener('click',()=>{resetRide();updateLabels();});
motion.addEventListener('change',event=>{if(event.matches && running){running=false;updateLabels();}});
new ResizeObserver(fit).observe(stage);
setSeason('spring');fit();requestAnimationFrame(frame);
</script>
</body>
