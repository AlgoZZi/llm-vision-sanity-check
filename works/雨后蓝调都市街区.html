  grp.add(blackCat);
  animatedProps.blackCat = { group: blackCat, tail: bcTail, active: false, progress: 0, nextRippleT: 0 };

  scene.add(grp);
}

// ============================================================================
// 12. 粒子与天气系统（蒸汽、屋檐/电线滴雨、低空霓虹薄雾、漂浮水汽与落叶）
// ============================================================================
const particleSystems = {};
function buildWeatherAndParticles() {
  // 软圆粒子 Canvas 纹理
  const pCvs = document.createElement('canvas');
  pCvs.width = 64; pCvs.height = 64;
  const pCtx = pCvs.getContext('2d');
  const g = pCtx.createRadialGradient(32, 32, 2, 32, 32, 30);
  g.addColorStop(0, 'rgba(255,255,255,0.92)');
  g.addColorStop(0.5, 'rgba(220,234,255,0.45)');
  g.addColorStop(1, 'rgba(200,220,255,0.0)');
  pCtx.fillStyle = g;
  pCtx.fillRect(0, 0, 64, 64);
  const softTex = new THREE.CanvasTexture(pCvs);

  // 12.1 升腾蒸汽粒子池（烟囱、汤锅、拉面碗、关东煮、井盖、地铁通风口）
  const steamCount = 240;
  const steamPos = new Float32Array(steamCount * 3);
  const steamMeta = [];
  const emitters = animatedProps.steamEmitters.length ? animatedProps.steamEmitters : [{ pos: new THREE.Vector3(15, 1, 15), type: 'soup' }];
  for (let i = 0; i < steamCount; i++) {
    const em = emitters[i % emitters.length];
    const life = rng();
    steamMeta.push({ em, life, speed: randRange(0.28, 0.55), driftX: randRange(-0.22, 0.28), driftZ: randRange(-0.22, 0.22) });
    steamPos[i * 3] = em.pos.x;
    steamPos[i * 3 + 1] = em.pos.y + life * 2.5;
    steamPos[i * 3 + 2] = em.pos.z;
  }
  const steamGeo = new THREE.BufferGeometry();
  steamGeo.setAttribute('position', new THREE.BufferAttribute(steamPos, 3));
  const steamMat = new THREE.PointsMaterial({
    size: 1.45, map: softTex, transparent: true, opacity: 0.36,
    depthWrite: false, blending: THREE.NormalBlending, color: 0xffe6dc
  });
  const steamPoints = new THREE.Points(steamGeo, steamMat);
  steamPoints.frustumCulled = false;
  scene.add(steamPoints);
  particleSystems.steam = { geo: steamGeo, meta: steamMeta };

  // 12.2 空气中漂浮的细微霓虹水汽颗粒（随相机周围局部循环）
  const mistCount = 520;
  const mistPos = new Float32Array(mistCount * 3);
  const mistCol = new Float32Array(mistCount * 3);
  const mistPal = [new THREE.Color(0xff7cb8), new THREE.Color(0x7beeff), new THREE.Color(0xffd28a), new THREE.Color(0xa6baff)];
  for (let i = 0; i < mistCount; i++) {
    mistPos[i * 3] = randRange(-75, 75);
    mistPos[i * 3 + 1] = randRange(0.4, 22.0);
    mistPos[i * 3 + 2] = randRange(-75, 75);
    const c = mistPal[i % mistPal.length];
    mistCol[i * 3] = c.r; mistCol[i * 3 + 1] = c.g; mistCol[i * 3 + 2] = c.b;
  }
  const mistGeo = new THREE.BufferGeometry();
  mistGeo.setAttribute('position', new THREE.BufferAttribute(mistPos, 3));
  mistGeo.setAttribute('color', new THREE.BufferAttribute(mistCol, 3));
  const mistMat = new THREE.PointsMaterial({
    size: 0.42, map: softTex, vertexColors: true, transparent: true, opacity: 0.45,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const mistPoints = new THREE.Points(mistGeo, mistMat);
  mistPoints.frustumCulled = false;
  scene.add(mistPoints);
  particleSystems.mist = { geo: mistGeo };

  // 12.3 屋檐、雨棚与电线间歇滴落的残余雨滴（落地激起水洼波纹）
  const dripCount = 90;
  const dripPos = new Float32Array(dripCount * 3);
  const dripVel = new Float32Array(dripCount);
  for (let i = 0; i < dripCount; i++) {
    dripPos[i * 3] = randRange(-42, 42);
    dripPos[i * 3 + 1] = randRange(0.5, 9.5);
    dripPos[i * 3 + 2] = randRange(-42, 42);
    dripVel[i] = randRange(5.5, 9.2);
  }
  const dripGeo = new THREE.BufferGeometry();
  dripGeo.setAttribute('position', new THREE.BufferAttribute(dripPos, 3));
  const dripMat = new THREE.PointsMaterial({
    size: 0.14, color: 0xc2e6ff, transparent: true, opacity: 0.65, depthWrite: false
  });
  const dripPoints = new THREE.Points(dripGeo, dripMat);
  dripPoints.frustumCulled = false;
  scene.add(dripPoints);
  particleSystems.drips = { geo: dripGeo, vel: dripVel };

  // 12.4 贴在湿润路面的梧桐落叶与零星纸屑（InstancedMesh）
  const leafCount = 260;
  const leafGeo = new THREE.PlaneGeometry(0.18, 0.14);
  leafGeo.rotateX(-Math.PI / 2);
  const leafMat = getAnimeToonMaterial({ color: 0x9c5236, side: THREE.DoubleSide, cacheKey: 'wetLeaf' });
  const leafInst = new THREE.InstancedMesh(leafGeo, leafMat, leafCount);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < leafCount; i++) {
    dummy.position.set(randRange(-65, 65), 0.175, randRange(-65, 65));
    dummy.rotation.set(0, randRange(0, Math.PI * 2), 0);
    const s = randRange(0.7, 1.5);
    dummy.scale.set(s, 1, s);
    dummy.updateMatrix();
    leafInst.setMatrixAt(i, dummy.matrix);
  }
  leafInst.instanceMatrix.needsUpdate = true;
  scene.add(leafInst);
}

    toPos: new THREE.Vector3(),
    fromQuat: new THREE.Quaternion(),
    toQuat: new THREE.Quaternion()
  },
  // 输入状态
  keys: Object.create(null),
  dragButton: -1,
  lastMouseX: 0,
  lastMouseY: 0,
  pointerLocked: false,
  // 移动端双区触控状态
  touchMoveId: null,
  touchLookId: null,
  touchMoveOrigin: { x: 0, y: 0 },
  touchMoveVec: { x: 0, y: 0 },
  touchLookLast: { x: 0, y: 0 }
};

const eulerTemp = new THREE.Euler(0, 0, 0, 'YXZ');
const raycaster = new THREE.Raycaster();

function setCameraYawPitch(yaw, pitch) {
  eulerTemp.set(clamp(pitch, -1.42, 1.42), yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(eulerTemp);
}

// 碰撞解析（简易圆柱体对 AABB 推离，避免穿墙穿车）
function resolveWalkCollision(nextX, nextZ, footY) {
  const radius = 0.42;
  let x = clamp(nextX, -270, 270);
  let z = clamp(nextZ, -270, 270);
  for (let i = 0; i < colliders.length; i++) {
    const c = colliders[i];
    if (footY + 1.5 < c.minY || footY > c.maxY - 0.25) continue;
    const cx = clamp(x, c.minX, c.maxX);
    const cz = clamp(z, c.minZ, c.maxZ);
    const dx = x - cx;
    const dz = z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 < radius * radius) {
      if (d2 > 1e-6) {
        const d = Math.sqrt(d2);
        x += (dx / d) * (radius - d);
        z += (dz / d) * (radius - d);
      } else {
        // 内部推到最近边
        const dl = Math.abs(x - c.minX), dr = Math.abs(c.maxX - x);
        const dt = Math.abs(z - c.minZ), db = Math.abs(c.maxZ - z);
        const m = Math.min(dl, dr, dt, db);
        if (m === dl) x = c.minX - radius;
        else if (m === dr) x = c.maxX + radius;
        else if (m === dt) z = c.minZ - radius;
        else z = c.maxZ + radius;
      }
    }
  }
  return { x, z };
}

function beginModeTransition(targetMode, targetGroundXZ = null) {
  if (camState.mode === 'transition') return;
  if (document.pointerLockElement) document.exitPointerLock();

  const tr = camState.trans;
  tr.t = 0;
  tr.dur = CONFIG.modeTransitionSec;
  tr.toMode = targetMode;
  tr.fromPos.copy(camera.position);
  tr.fromQuat.copy(camera.quaternion);

  if (targetMode === 'walk') {
    let gx = targetGroundXZ ? targetGroundXZ.x : camera.position.x;
    let gz = targetGroundXZ ? targetGroundXZ.z : camera.position.z;
    const safe = resolveWalkCollision(gx, gz, 0.2);
    const gy = sampleGroundHeight(safe.x, safe.z, 0.3);
    camState.walkPos.set(safe.x, gy, safe.z);
    camState.walkYaw = camState.flyYaw;
    camState.walkPitch = 0.03; // 落地时自然转为平视
    tr.toPos.set(safe.x, gy + CONFIG.eyeHeight, safe.z);
    eulerTemp.set(camState.walkPitch, camState.walkYaw, 0, 'YXZ');
    tr.toQuat.setFromEuler(eulerTemp);
  } else {
    // 从步行点缓缓升回空中俯瞰
    const backDir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), camState.walkYaw);
    const fy = clamp(camState.walkPos.y + 42, CONFIG.flyMinY + 6, 95);
    camState.flyPos.set(
      camState.walkPos.x + backDir.x * 28,
      fy,
      camState.walkPos.z + backDir.z * 28
    );
    camState.flyVel.set(0, 0, 0);
    camState.flyYaw = camState.walkYaw;
    camState.flyPitch = -0.58;
    tr.toPos.copy(camState.flyPos);
    eulerTemp.set(camState.flyPitch, camState.flyYaw, 0, 'YXZ');
    tr.toQuat.setFromEuler(eulerTemp);
  }
  camState.mode = 'transition';
}

function setupControls() {
  const dom = renderer.domElement;

  window.addEventListener('keydown', (e) => {
    const code = e.code;
    camState.keys[code] = true;
    if (code === 'Tab' || code === 'KeyF') {
      e.preventDefault();
      if (camState.mode === 'intro') {
        camState.mode = 'walk';
        return;
      }
      if (camState.mode === 'walk') {
        beginModeTransition('fly');
      } else if (camState.mode === 'fly') {
        // 向前方视线下方的地面点俯冲
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const t = fwd.y < -0.12 ? clamp(-camera.position.y / fwd.y, 6, 120) : 28;
        beginModeTransition('walk', { x: camera.position.x + fwd.x * t, z: camera.position.z + fwd.z * t });
      }
    }
  });
  window.addEventListener('keyup', (e) => { camState.keys[e.code] = false; });

  // 阻止右键菜单，使右键拖拽用于空中视角旋转
  dom.addEventListener('contextmenu', (e) => e.preventDefault());

  dom.addEventListener('mousedown', (e) => {
    if (camState.mode === 'intro') {
      camState.mode = 'walk';
    }
    if (camState.mode === 'walk') {
      if (!document.pointerLockElement && e.button === 0) {
        dom.requestPointerLock?.();
      }
      camState.dragButton = e.button;
      camState.lastMouseX = e.clientX;
      camState.lastMouseY = e.clientY;
    } else if (camState.mode === 'fly') {
      camState.dragButton = e.button;
      camState.lastMouseX = e.clientX;
      camState.lastMouseY = e.clientY;
    }
  });

  window.addEventListener('mouseup', () => { camState.dragButton = -1; });

  window.addEventListener('mousemove', (e) => {
    if (camState.mode === 'walk') {
      if (document.pointerLockElement === dom) {
        camState.walkYaw -= e.movementX * 0.0022;
        camState.walkPitch = clamp(camState.walkPitch - e.movementY * 0.0022, -1.35, 1.38);
      } else if (camState.dragButton === 0 || camState.dragButton === 2) {
        const dx = e.clientX - camState.lastMouseX;
        const dy = e.clientY - camState.lastMouseY;
        camState.walkYaw -= dx * 0.004;
        camState.walkPitch = clamp(camState.walkPitch - dy * 0.004, -1.35, 1.38);
      }
    } else if (camState.mode === 'fly' && camState.dragButton !== -1) {
      const dx = e.clientX - camState.lastMouseX;
      const dy = e.clientY - camState.lastMouseY;
      if (camState.dragButton === 2) {
        // 右键拖拽旋转视角
        camState.flyYaw -= dx * 0.0038;
        camState.flyPitch = clamp(camState.flyPitch - dy * 0.0038, -1.45, 0.35);
      } else if (camState.dragButton === 0) {
        // 左键拖拽水平平移（高度越高速度越快）
        const scale = (0.045 + camState.flyPos.y * 0.0024);
        const right = new THREE.Vector3(Math.cos(camState.flyYaw), 0, -Math.sin(camState.flyYaw));
        const fwd = new THREE.Vector3(-Math.sin(camState.flyYaw), 0, -Math.cos(camState.flyYaw));
        camState.flyVel.addScaledVector(right, -dx * scale * 2.2);
        camState.flyVel.addScaledVector(fwd, dy * scale * 2.2);
      }
    }
    camState.lastMouseX = e.clientX;
    camState.lastMouseY = e.clientY;
  });

  // 滚轮控制空中高度
  dom.addEventListener('wheel', (e) => {
    if (camState.mode === 'fly') {
      e.preventDefault();
      const speed = Math.max(4, camState.flyPos.y * 0.16);
      camState.flyVel.y += Math.sign(e.deltaY) * speed * 1.45;
    }
  }, { passive: false });

  // 双击地面平滑俯冲落到该点；步行模式双击升空
  dom.addEventListener('dblclick', (e) => {
    if (camState.mode === 'fly') {
      const ndc = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      const hit = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(plane, hit)) {
        beginModeTransition('walk', { x: clamp(hit.x, -250, 250), z: clamp(hit.z, -250, 250) });
      }
    } else if (camState.mode === 'walk') {
      beginModeTransition('fly');
    }
  });

  document.addEventListener('pointerlockchange', () => {
    camState.pointerLocked = document.pointerLockElement === dom;
  });

  // 手机端隐形左半屏摇杆行走 + 右半屏滑动环顾（不显示多余按钮）
  dom.addEventListener('touchstart', (e) => {
    if (camState.mode === 'intro') camState.mode = 'walk';
    for (const t of e.changedTouches) {
      if (t.clientX < window.innerWidth * 0.48 && camState.touchMoveId === null) {
        camState.touchMoveId = t.identifier;
        camState.touchMoveOrigin = { x: t.clientX, y: t.clientY };
        camState.touchMoveVec = { x: 0, y: 0 };
      } else if (camState.touchLookId === null) {
        camState.touchLookId = t.identifier;
        camState.touchLookLast = { x: t.clientX, y: t.clientY };
      }
    }
  }, { passive: true });

  dom.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === camState.touchMoveId) {
        camState.touchMoveVec.x = clamp((t.clientX - camState.touchMoveOrigin.x) / 65, -1, 1);
        camState.touchMoveVec.y = clamp((t.clientY - camState.touchMoveOrigin.y) / 65, -1, 1);
      } else if (t.identifier === camState.touchLookId) {
        const dx = t.clientX - camState.touchLookLast.x;
        const dy = t.clientY - camState.touchLookLast.y;
        camState.touchLookLast = { x: t.clientX, y: t.clientY };
        if (camState.mode === 'walk') {
          camState.walkYaw -= dx * 0.0055;
          camState.walkPitch = clamp(camState.walkPitch - dy * 0.005, -1.35, 1.35);
        } else if (camState.mode === 'fly') {
          camState.flyYaw -= dx * 0.005;
          camState.flyPitch = clamp(camState.flyPitch - dy * 0.0045, -1.42, 0.3);
        }
      }
    }
  }, { passive: true });

  dom.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === camState.touchMoveId) {
        camState.touchMoveId = null;
        camState.touchMoveVec = { x: 0, y: 0 };
      }
      if (t.identifier === camState.touchLookId) camState.touchLookId = null;
    }
  });
}

function updateCameraAndMovement(dt, elapsed) {
  // 开场 6.2 秒电影航拍：高空斜俯瞰整个街区 -> 缓慢降低推进 -> 落在主路口人行道上
  if (camState.mode === 'intro') {
    camState.timeInIntro += dt;
    const u = clamp(camState.timeInIntro / CONFIG.introDurationSec, 0, 1);
    const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;

    const startPos = new THREE.Vector3(-82, 78, 92);
    const midPos = new THREE.Vector3(-22, 22, 34);
    const endPos = new THREE.Vector3(8.5, 0.16 + CONFIG.eyeHeight, 13.5);
    const p1 = new THREE.Vector3().lerpVectors(startPos, midPos, e);
    const p2 = new THREE.Vector3().lerpVectors(midPos, endPos, e);
    camera.position.lerpVectors(p1, p2, e);

    const lookStart = new THREE.Vector3(6, 4, -6);
    const lookEnd = new THREE.Vector3(14.5, 2.2, 5.5);
    camera.lookAt(new THREE.Vector3().lerpVectors(lookStart, lookEnd, smoothstep(0.3, 1.0, u)));

    if (u >= 1.0) {
      camState.mode = 'walk';
      camState.walkPos.set(8.5, 0.16, 13.5);
      const eu = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
      camState.walkYaw = eu.y;
      camState.walkPitch = eu.x;
    }
  } else if (camState.mode === 'transition') {
    const tr = camState.trans;
    tr.t += dt;
    const u = clamp(tr.t / tr.dur, 0, 1);
    // 三次平滑缓动（带轻微俯冲弧度）
    const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    camera.position.lerpVectors(tr.fromPos, tr.toPos, e);
    camera.position.y += Math.sin(u * Math.PI) * (tr.toMode === 'walk' ? -3.5 : 4.5);
    camera.quaternion.slerpQuaternions(tr.fromQuat, tr.toQuat, e);
    if (u >= 1.0) {
      camState.mode = tr.toMode;
    }
  } else if (camState.mode === 'fly') {
    const hFactor = clamp(camState.flyPos.y / 28, 0.65, 6.2);
    const speed = CONFIG.flyBaseSpeed * hFactor;
    const fwd = new THREE.Vector3(-Math.sin(camState.flyYaw), 0, -Math.cos(camState.flyYaw));
    const right = new THREE.Vector3(Math.cos(camState.flyYaw), 0, -Math.sin(camState.flyYaw));

    let inF = (camState.keys.KeyW || camState.keys.ArrowUp ? 1 : 0) - (camState.keys.KeyS || camState.keys.ArrowDown ? 1 : 0) - camState.touchMoveVec.y;
    let inR = (camState.keys.KeyD || camState.keys.ArrowRight ? 1 : 0) - (camState.keys.KeyA || camState.keys.ArrowLeft ? 1 : 0) + camState.touchMoveVec.x;
    let inY = (camState.keys.KeyE ? 1 : 0) - (camState.keys.KeyQ ? 1 : 0);

    camState.flyVel.addScaledVector(fwd, inF * speed * dt * 4.5);
    camState.flyVel.addScaledVector(right, inR * speed * dt * 4.5);
    camState.flyVel.y += inY * speed * 0.85 * dt * 4.5;

    // 稳定器惯性与指数阻尼
    const damp = Math.exp(-CONFIG.flyDamping * dt);
    camState.flyVel.multiplyScalar(damp);
    camState.flyPos.addScaledVector(camState.flyVel, dt);
    camState.flyPos.x = clamp(camState.flyPos.x, -340, 340);
    camState.flyPos.z = clamp(camState.flyPos.z, -340, 340);
    camState.flyPos.y = clamp(camState.flyPos.y, CONFIG.flyMinY, CONFIG.flyMaxY);

    camera.position.copy(camState.flyPos);
    setCameraYawPitch(camState.flyYaw, camState.flyPitch);
  } else if (camState.mode === 'walk') {
    const isRunning = !!(camState.keys.ShiftLeft || camState.keys.ShiftRight);
    const moveSpeed = isRunning ? CONFIG.runSpeed : CONFIG.walkSpeed;
    const fwd = new THREE.Vector3(-Math.sin(camState.walkYaw), 0, -Math.cos(camState.walkYaw));
    const right = new THREE.Vector3(Math.cos(camState.walkYaw), 0, -Math.sin(camState.walkYaw));

    let inF = (camState.keys.KeyW || camState.keys.ArrowUp ? 1 : 0) - (camState.keys.KeyS || camState.keys.ArrowDown ? 1 : 0) - camState.touchMoveVec.y;
    let inR = (camState.keys.KeyD || camState.keys.ArrowRight ? 1 : 0) - (camState.keys.KeyA || camState.keys.ArrowLeft ? 1 : 0) + camState.touchMoveVec.x;

    const moveVec = new THREE.Vector3().addScaledVector(fwd, inF).addScaledVector(right, inR);
    const isMoving = moveVec.lengthSq() > 0.001;
    if (isMoving) {
      moveVec.normalize().multiplyScalar(moveSpeed * dt);
      const next = resolveWalkCollision(camState.walkPos.x + moveVec.x, camState.walkPos.z + moveVec.z, camState.walkPos.y);
      const stepDist = Math.hypot(next.x - camState.walkPos.x, next.z - camState.walkPos.z);
      camState.walkPos.x = next.x;
      camState.walkPos.z = next.z;
      camState.bobPhase += dt * (isRunning ? 11.5 : 7.8);
      camState.lastStepDist += stepDist;

      // 每跨出一步，踩在湿路面/积水时触发水洼涟漪与轻微镜头水珠反馈
      if (camState.lastStepDist > 1.05 && camState.walkPos.y < 0.35) {
        camState.lastStepDist = 0;
        spawnFootRipple(camState.walkPos.x, camState.walkPos.z, isRunning ? 1.25 : 0.85);
        sharedUniforms.uScreenDew.value = Math.min(1.0, sharedUniforms.uScreenDew.value + 0.14);
      }
    }

    const targetFootY = sampleGroundHeight(camState.walkPos.x, camState.walkPos.z, camState.walkPos.y);
    camState.walkPos.y = lerp(camState.walkPos.y, targetFootY, Math.min(1, dt * 12));

    const breathY = Math.sin(elapsed * 1.9) * 0.015;
    const stepBob = isMoving ? Math.sin(camState.bobPhase) * (isRunning ? 0.055 : 0.032) : 0;
    camera.position.set(camState.walkPos.x, camState.walkPos.y + CONFIG.eyeHeight + breathY + stepBob, camState.walkPos.z);
    setCameraYawPitch(camState.walkYaw, camState.walkPitch);
  }

  sharedUniforms.uPlayerPos.value.copy(camera.position);

  // 唯一允许的开场淡入/淡出极细操作提示（开场约 6 秒后淡入，停留 5.5 秒后永久消失）
  if (!camState.hintShown && elapsed > 6.0) {
    camState.hintShown = true;
    const hint = document.getElementById('ephemeral-hint');
    if (hint) {
      hint.style.opacity = '1';
      setTimeout(() => { hint.style.opacity = '0'; }, 5500);
      setTimeout(() => { hint.remove(); }, 7600);
    }
  }
}

// ============================================================================
// 14. 三渲二后处理管线（近景纤细描边远景自动淡出 + 轻度 Bloom + 镜头水汽光晕）
// ============================================================================
let composer, bloomPass, animePostPass;
const AnimePostShader = {
  uniforms: {
    tDiffuse: { value: null },
    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    uTime: sharedUniforms.uTime,
    uOutlineStrength: { value: 0.42 },
    uScreenDew: sharedUniforms.uScreenDew
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 uResolution;
    uniform float uTime;
    uniform float uOutlineStrength;
    uniform float uScreenDew;
    varying vec2 vUv;

    float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }

    void main() {
      vec2 texel = 1.0 / uResolution;
      vec3 center = texture2D(tDiffuse, vUv).rgb;

      // 纤细二次元轮廓线检测（高亮度霓虹与远景柔和雾区自动淡出，防止线条糊成一团）
      float cL = luma(center);
      float cR = luma(texture2D(tDiffuse, vUv + vec2(texel.x, 0.0)).rgb);
      float cU = luma(texture2D(tDiffuse, vUv + vec2(0.0, texel.y)).rgb);
      float cD = luma(texture2D(tDiffuse, vUv - vec2(0.0, texel.y)).rgb);
      float cL2 = luma(texture2D(tDiffuse, vUv - vec2(texel.x, 0.0)).rgb);

      float edge = abs(cR - cL2) + abs(cU - cD);
      // 纤细二次元轮廓线（白天用清爽蓝灰墨线，清晰勾勒建筑结构）
      float skyMask = smoothstep(0.92, 0.45, vUv.y);
      float brightGuard = 1.0 - smoothstep(0.88, 1.35, cL);
      float lineMask = smoothstep(0.14, 0.34, edge) * uOutlineStrength * skyMask * brightGuard;
      vec3 inkColor = vec3(0.20, 0.26, 0.42);
      vec3 col = mix(center, inkColor, lineMask * 0.45);

      // 步行踩水时镜头边缘轻微水珠/水汽折射
      if (uScreenDew > 0.01) {
        vec2 dp = vUv * 2.0 - 1.0;
        float rim = smoothstep(0.45, 1.15, length(dp));
        float drops = smoothstep(0.82, 0.96, sin(vUv.x * 46.0 + sin(vUv.y * 28.0)) * cos(vUv.y * 38.0 - uTime * 0.6));
        col += vec3(0.68, 0.84, 1.0) * drops * rim * uScreenDew * 0.14;
      }

      // 极轻度镜头柔边（白天不压暗画面）
      float vig = 1.0 - dot(vUv - 0.5, vUv - 0.5) * 0.10;
      col *= vig;
      gl_FragColor = vec4(col, 1.0);
    }
  `
};

function setupPostProcessing() {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.20, // 白天极轻柔高光泛光，通透不过曝
    0.45,
    0.88
  );
  composer.addPass(bloomPass);
  animePostPass = new ShaderPass(AnimePostShader);
  composer.addPass(animePostPass);
}

// ============================================================================
// 15. 动态动画更新、极偶发事件、Chunk 视锥剔除、室内 LOD 与自适应性能调优
// ============================================================================
const frustum = new THREE.Frustum();
const projScreenMatrix = new THREE.Matrix4();
const perfState = {
  frames: 0,
  accTime: 0,
  dpr: Math.min(window.devicePixelRatio, 1.6),
  qualityLevel: 2 // 2: 高, 1: 中, 0: 低
};

function updateAnimationsAndEvents(dt, elapsed) {
  sharedUniforms.uTime.value = elapsed;
  sharedUniforms.uScreenDew.value = Math.max(0, sharedUniforms.uScreenDew.value - dt * 0.18);

  // 15.1 红绿灯周期循环（24秒一周期：0..10 东西绿，10..12 黄，12..22 东西红/南北绿，22..24 黄）
  const tc = elapsed % CONFIG.intervals.trafficCycleSec;
  let ewGreen = false, nsGreen = false, isYellow = false;
  if (tc < 10) { ewGreen = true; sharedUniforms.uTrafficPhase.value = 0; }
  else if (tc < 12) { isYellow = true; sharedUniforms.uTrafficPhase.value = 1; }
  else if (tc < 22) { nsGreen = true; sharedUniforms.uTrafficPhase.value = 2; }
  else { isYellow = true; sharedUniforms.uTrafficPhase.value = 1; }

  animatedProps.trafficSignals.forEach((s) => {
    const gOn = (s.dir === 'EW' && ewGreen) || (s.dir === 'NS' && nsGreen);
    const yOn = isYellow;
    const rOn = !gOn && !yOn;
    s.green.visible = gOn;
    s.yellow.visible = yOn;
    s.red.visible = rOn;
  });

  // 15.2 沿主干道行驶的车辆（遇红灯停在停止线前，绿灯缓缓启动）
  animatedProps.vehicles.forEach((v) => {
    const posCoord = v.axis === 'x' ? v.mesh.position.x : v.mesh.position.z;
    const canGo = v.axis === 'x' ? ewGreen : nsGreen;
    const distToStop = (v.dir > 0) ? (-13.5 - posCoord) : (posCoord - 13.5);
    const shouldWait = !canGo && distToStop > 0 && distToStop < 7.5;
    const targetSpd = shouldWait ? 0 : v.speed;
    v.curSpeed = lerp(v.curSpeed, targetSpd, Math.min(1, dt * 4.5));
    const nextCoord = posCoord + v.dir * v.curSpeed * dt;
    const wrapped = nextCoord > 125 ? -125 : (nextCoord < -125 ? 125 : nextCoord);
    if (v.axis === 'x') v.mesh.position.x = wrapped;
    else v.mesh.position.z = wrapped;
  });

  // 15.3 高架通勤电车周期驶过（含扫掠街面的车窗光带与动态扫光光源）
  const trainCycle = elapsed % CONFIG.intervals.trainSec;
  if (animatedProps.elevatedTrain) {
    if (trainCycle < 14.5) {
      const tx = lerp(-320, 320, trainCycle / 14.5);
      animatedProps.elevatedTrain.position.x = tx;
      animatedProps.elevatedTrain.visible = true;
      sharedUniforms.uTrainX.value = tx;
      sharedUniforms.uTrainActive.value = 1.0 - smoothstep(230, 310, Math.abs(tx));
      if (dynamicLights.trainSweep) {
        dynamicLights.trainSweep.position.x = tx;
        dynamicLights.trainSweep.intensity = 16 * sharedUniforms.uTrainActive.value;
      }
    } else {
      animatedProps.elevatedTrain.visible = false;
      sharedUniforms.uTrainActive.value = 0;
      if (dynamicLights.trainSweep) dynamicLights.trainSweep.intensity = 0;
    }
  }

  // 15.4 地下地铁列车周期驶过（经过通风井下方时喷发气浪并照亮通风格栅）
  const subCycle = elapsed % CONFIG.intervals.subwaySec;
  if (animatedProps.subwayTrain) {
    if (subCycle < 9.0) {
      const sz = lerp(-150, 150, subCycle / 9.0);
      animatedProps.subwayTrain.position.z = sz;
      animatedProps.subwayTrain.visible = true;
      sharedUniforms.uSubwayZ.value = sz;
      sharedUniforms.uSubwayActive.value = 1;
    } else {
      animatedProps.subwayTrain.visible = false;
      sharedUniforms.uSubwayActive.value = 0;
    }
  }

  // 15.5 极偶发事件：每隔约 75 秒，一只黑猫悄悄穿过主路口斑马线，留下积水涟漪并伴随远处轻掠光影
  const bc = animatedProps.blackCat;
  if (bc) {
    const catTimer = elapsed % CONFIG.intervals.blackCatSec;
    if (catTimer > 18 && catTimer < 30) {
      const u = (catTimer - 18) / 12.0;
      bc.group.visible = true;
      const cx = lerp(-7.5, 9.8, u);
      const cz = 9.4 + Math.sin(u * Math.PI) * 0.8;
      bc.group.position.set(cx, 0.04 + Math.abs(Math.sin(elapsed * 9.5)) * 0.035, cz);
      bc.group.rotation.y = Math.PI / 2;
      bc.tail.rotation.z = Math.sin(elapsed * 5.2) * 0.25;
      if (elapsed > bc.nextRippleT) {
        bc.nextRippleT = elapsed + 0.52;
        spawnFootRipple(cx, cz, 0.65);
      }
      // 同步触发一次远处铁轨极轻光影掠动
      if (sharedUniforms.uTrainActive.value < 0.05) {
        sharedUniforms.uTrainX.value = lerp(-90, 90, u);
        sharedUniforms.uTrainActive.value = Math.sin(u * Math.PI) * 0.35;
      }
    } else {
      bc.group.visible = false;
    }
  }

  // 15.6 暖帘、晾晒衣物、秋千、蓝塑料布、灯笼微风摆动 & 文库本翻页 & 唱片转动 & 电视闪烁 & 橘猫与乌鸦
  animatedProps.swayingMeshes.forEach((sw) => {
    sw.mesh.rotation[sw.axis] = sw.base + Math.sin(elapsed * sw.speed + sw.phase) * sw.amp;
  });
  animatedProps.bookPages.forEach((pg) => {
    pg.rotation.z = -0.35 + Math.sin(elapsed * 1.8) * 0.45;
  });
  animatedProps.turntables.forEach((disc) => { disc.rotation.y += dt * 2.2; });
  animatedProps.tvScreens.forEach((tv) => {
    const f = 0.85 + 0.25 * Math.sin(elapsed * 14.0) * Math.cos(elapsed * 7.3);
    tv.material.color.setRGB(0.42 * f, 0.85 * f, 1.15 * f);
  });
  animatedProps.cats.forEach((c) => {
    c.tail.rotation.y = Math.sin(elapsed * 2.4) * 0.35;
    c.head.rotation.z = Math.sin(elapsed * 0.9) > 0.92 ? 0.16 : 0;
  });
  animatedProps.ducks.forEach((d) => {
    d.position.z += dt * 0.48;
    if (d.position.z > 90) d.position.z = -90;
    d.position.y = -0.27 + Math.sin(elapsed * 3.1) * 0.025;
    d.rotation.y = Math.sin(elapsed * 0.8) * 0.4;
  });
  animatedProps.crows.forEach((cr) => {
    const cyc = (elapsed + cr.phase * 4.0) % 28.0;
    if (cyc < 3.6) {
      const u = cyc / 3.6;
      cr.group.position.set(
        cr.home.x + Math.sin(u * Math.PI * 2) * 3.5,
        cr.home.y + Math.sin(u * Math.PI) * 3.2,
        cr.home.z + Math.cos(u * Math.PI * 2) * 2.2
      );
      const flap = Math.sin(elapsed * 24.0) * 0.75;
      cr.wingL.rotation.x = flap;
      cr.wingR.rotation.x = -flap;
    } else {
      cr.group.position.copy(cr.home);
      cr.wingL.rotation.x = 0.08 * Math.sin(elapsed * 2.0 + cr.phase);
      cr.wingR.rotation.x = -0.08 * Math.sin(elapsed * 2.0 + cr.phase);
    }
  });

  // 霓虹老旧灯管偶发明灭闪烁
  animatedProps.flickerSigns.forEach((fs) => {
    const n = Math.sin(elapsed * 19.0 + fs.phase) * Math.sin(elapsed * 5.7 + fs.phase * 2.1);
    const mult = n > 0.88 ? 0.25 : 1.0;
    fs.mat.color.setScalar(fs.baseIntensity * mult);
  });

  // 高楼航空障碍红灯呼吸闪烁 & 天空划过飞机与远处直升机
  animatedProps.aviationLights.forEach((av) => {
    const pulse = 0.25 + 0.75 * Math.pow(0.5 + 0.5 * Math.sin(elapsed * 2.1 + av.phase), 3.0);
    av.mesh.scale.setScalar(0.65 + pulse * 0.65);
  });
  if (animatedProps.airplane) {
    const pu = (elapsed % CONFIG.intervals.planeSec) / CONFIG.intervals.planeSec;
    animatedProps.airplane.group.position.set(lerp(-1100, 1100, pu), 285, lerp(-520, -240, pu));
    animatedProps.airplane.strobe.visible = (elapsed % 1.4) < 0.14;
  }
  if (animatedProps.helicopter) {
    const ha = elapsed * 0.14;
    animatedProps.helicopter.position.set(Math.cos(ha) * 540, 168 + Math.sin(elapsed * 0.6) * 8, -420 + Math.sin(ha) * 160);
    animatedProps.helicopter.visible = (elapsed % 0.9) < 0.22;
  }

  // 15.7 蒸汽、水汽颗粒与间歇屋檐滴雨更新
  if (particleSystems.steam) {
    const arr = particleSystems.steam.geo.attributes.position.array;
    const meta = particleSystems.steam.meta;
    for (let i = 0; i < meta.length; i++) {
      const m = meta[i];
      const boost = (m.em.type === 'subwayVent' && sharedUniforms.uSubwayActive.value > 0.5 && Math.abs(m.em.pos.z - sharedUniforms.uSubwayZ.value) < 16) ? 2.8 : 1.0;
      m.life += dt * m.speed * boost;
      if (m.life > 1.0) m.life -= 1.0;
      const maxH = m.em.type === 'chimney' ? 6.2 : (m.em.type === 'soup' ? 1.4 : 2.8);
      arr[i * 3] = m.em.pos.x + Math.sin(elapsed * 1.2 + i) * 0.25 * m.life + m.driftX * m.life * 2.0;
      arr[i * 3 + 1] = m.em.pos.y + m.life * maxH;
      arr[i * 3 + 2] = m.em.pos.z + Math.cos(elapsed * 1.1 + i) * 0.25 * m.life + m.driftZ * m.life * 2.0;
    }
    particleSystems.steam.geo.attributes.position.needsUpdate = true;
  }
  if (particleSystems.mist) {
    const arr = particleSystems.mist.geo.attributes.position.array;
    for (let i = 0; i < arr.length; i += 3) {
      arr[i] += dt * 0.35;
      arr[i + 1] += Math.sin(elapsed * 0.7 + i) * dt * 0.08;
      if (arr[i] > camera.position.x + 75) arr[i] -= 150;
      if (arr[i] < camera.position.x - 75) arr[i] += 150;
      if (arr[i + 2] > camera.position.z + 75) arr[i + 2] -= 150;
      if (arr[i + 2] < camera.position.z - 75) arr[i + 2] += 150;
    }
    particleSystems.mist.geo.attributes.position.needsUpdate = true;
  }
  if (particleSystems.drips) {
    const arr = particleSystems.drips.geo.attributes.position.array;
    const vel = particleSystems.drips.vel;
    for (let i = 0; i < vel.length; i++) {
      arr[i * 3 + 1] -= vel[i] * dt;
      if (arr[i * 3 + 1] <= 0.16) {
        arr[i * 3] = camera.position.x + randRange(-26, 26);
        arr[i * 3 + 1] = randRange(3.2, 9.2);
        arr[i * 3 + 2] = camera.position.z + randRange(-26, 26);
      }
    }
    particleSystems.drips.geo.attributes.position.needsUpdate = true;
  }

  // 15.8 区块视锥剔除 + 室内细节距离 LOD + 描边随相机高度自动淡出
  camera.updateMatrixWorld();
  projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(projScreenMatrix);
  for (let i = 0; i < chunks.length; i++) {
    chunks[i].group.visible = frustum.intersectsBox(chunks[i].box);
  }
  for (let i = 0; i < interiorDetails.length; i++) {
    const it = interiorDetails[i];
    it.group.visible = camera.position.distanceTo(it.pos) < it.radius;
  }
  if (animePostPass) {
    // 飞高后描边自动柔化减弱，避免远景线条糊成一团
    animePostPass.uniforms.uOutlineStrength.value = lerp(0.46, 0.12, smoothstep(8, 120, camera.position.y));
  }

  // 15.9 自适应像素比与特效等级（保证桌面端 60fps、笔记本 30fps+）
  perfState.frames++;
  perfState.accTime += dt;
  if (perfState.accTime >= 2.0) {
    const fps = perfState.frames / perfState.accTime;
    perfState.frames = 0;
    perfState.accTime = 0;
    if (fps < CONFIG.perf.lowFPS && perfState.dpr > 0.85) {
      perfState.dpr = Math.max(0.8, perfState.dpr - 0.2);
      renderer.setPixelRatio(perfState.dpr);
      composer.setPixelRatio(perfState.dpr);
      if (bloomPass) bloomPass.strength = 0.14;
    } else if (fps > CONFIG.perf.targetFPS && perfState.dpr < Math.min(window.devicePixelRatio, 1.6)) {
      perfState.dpr = Math.min(Math.min(window.devicePixelRatio, 1.6), perfState.dpr + 0.1);
      renderer.setPixelRatio(perfState.dpr);
      composer.setPixelRatio(perfState.dpr);
      if (bloomPass) bloomPass.strength = 0.20;
    }
  }
}

// ============================================================================
// 16. 窗口自适应与主渲染启动
// ============================================================================
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (composer) composer.setSize(w, h);
  if (animePostPass) animePostPass.uniforms.uResolution.value.set(w, h);
});

function initCity() {
  buildSkyAndHorizon();
  setupLighting();
  buildTerrainAndRoads();
  buildElevatedRailwayAndStation();
  buildLandmarkRamenAndKonbini();
  buildLandmarkCafeOfficeShrinePark();
  buildProceduralCityChunks();
  buildStreetPropsVehiclesAndTraces();
  buildWeatherAndParticles();
  setupControls();
  setupPostProcessing();

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const elapsed = clock.elapsedTime;
    updateCameraAndMovement(dt, elapsed);
    updateAnimationsAndEvents(dt, elapsed);
    composer.render();
  }
  animate();
}

initCity();
</script>
