<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const CYCLE = 6;
  const TAU = Math.PI * 2;
  const make = (name, attrs, parent) => {
    const node = document.createElementNS(NS, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (parent) parent.appendChild(node);
    return node;
  };
  // Seeded decoration stays perfectly fixed between frames and loop boundaries.
  let seed = 2718;
  const random = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const sand = document.getElementById('sandSpecks');
  for (let i = 0; i < 94; i++) {
    const x = 26 + random() * 330, y = 390 + random() * 355;
    if (x < 370 - (y - 390) * .62) make('ellipse', { cx:x, cy:y, rx:.6 + random() * 1.5, ry:.45 + random() * .5 }, sand);
  }
  const currents = [];
  const currentLayer = document.getElementById('currents');
  for (let i = 0; i < 34; i++) {
    const x = random() * 1800 - 100, y = 398 + random() * 470;
    const length = 25 + random() * 85;
    const node = make('path', { d:`M0 0q${length / 2} -4 ${length} -1`, 'stroke-width':i % 4 === 0 ? 2.5 : 1.4 }, currentLayer);
    currents.push({ node, x, y, phase:random() * TAU, opacity:.22 + random() * .5 });
  }
  const plants = [];
  const plantLayer = document.getElementById('floatingPlants');
  // Wrapping takes place outside the visible frame, never across open water.
  const plantSpecs = [
    {x:14,y:752,s:.72,p:.2}, {x:410,y:806,s:.83,p:1.5},
    {x:845,y:716,s:.91,p:3.1}, {x:1210,y:775,s:.63,p:4.2},
    {x:1490,y:681,s:.76,p:2.2}, {x:950,y:462,s:.49,p:5.1},
    {x:1420,y:521,s:.57,p:.8}
  ];
  plantSpecs.forEach(spec => {
    const node = make('g', {}, plantLayer);
    make('use', { href:'#duckweed' }, node);
    plants.push({ ...spec, node });
  });
  const rings = [];
  const rippleLayer = document.getElementById('ripples');
  for (let i = 0; i < 3; i++) {
    const group = make('g', { opacity:0 }, rippleLayer);
    const dark = make('ellipse', { fill:'none', stroke:'#3c7c7c', 'stroke-width':1.5 }, group);
    const light = make('ellipse', { fill:'none', stroke:'#dfebcc', 'stroke-width':2.1 }, group);
    rings.push({ group, dark, light, delay:i * .19 });
  }
  const splash = document.getElementById('splash');
  const drops = Array.from({length:5}, () => make('path', {}, splash));
  const tail = document.getElementById('tail');
  const beaver = document.getElementById('beaver');
  const eye = document.getElementById('eye');
  const reeds = Array.from(document.querySelectorAll('.reedMotion'));
  const smooth = n => n * n * (3 - 2 * n);
  const clamp = n => Math.max(0, Math.min(1, n));
  const keys = [[0,-9],[1.15,-9],[1.77,-24],[2.10,0],[2.36,-5],[2.85,-9],[6,-9]];
  function tailAngle(t) {
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) {
        const [a, x] = keys[i-1], [b, y] = keys[i];
        const u = clamp((t-a)/(b-a));
        // A decisive but gentle downstroke, followed by a slower recovery.
        const ease = i === 3 ? u*u : smooth(u);
        return x + (y-x)*ease;
      }
    }
    return -9;
  }
  function render(t) {
    const phase = t / CYCLE * TAU;
    tail.setAttribute('transform', `translate(570 482) rotate(${tailAngle(t)})`);
    beaver.setAttribute('transform', `translate(0 ${Math.sin(phase)*.85})`);
    const blink = t > 4.65 && t < 4.91 ? 1 - .92 * Math.sin((t-4.65)/.26*Math.PI) : 1;
    eye.setAttribute('transform', `translate(0 ${348*(1-blink)}) scale(1 ${blink})`);
    currents.forEach(item => {
      const x = ((item.x + 1920*t/CYCLE + 160) % 1920) - 160;
      const edge = clamp((x+100)/90) * clamp((1700-x)/90);
      item.node.setAttribute('transform', `translate(${x} ${item.y + Math.sin(phase+item.phase)*1.7})`);
      item.node.setAttribute('opacity', edge*item.opacity);
    });
    plants.forEach(plant => {
      // Exactly one full hidden-to-hidden traversal in six seconds.
      const x = ((plant.x + 1800*t/CYCLE + 100) % 1800)-100;
      const y = plant.y + Math.sin(phase+plant.p)*3;
      const angle = Math.sin(phase+plant.p)*4;
      const edge = clamp((x+45)/75)*clamp((1645-x)/75);
      plant.node.setAttribute('opacity', edge);
      plant.node.setAttribute('transform', `translate(${x} ${y}) rotate(${angle}) scale(${plant.s})`);
    });
    // A single impact at 2.10 s produces three concentric wave crests.
    rings.forEach(ring => {
      const age = t-2.10-ring.delay;
      const life = 3.37-ring.delay;
      if (age < 0 || age > life) { ring.group.setAttribute('opacity', 0); return; }
      const u = age/life;
      const radius = 13+261*(1-Math.pow(1-u,1.2));
      const alpha = clamp(age/.12)*Math.pow(1-u,1.3)*.83;
      ring.group.setAttribute('opacity', alpha);
      for (const [node, offset] of [[ring.dark,2.5],[ring.light,0]]) {
        node.setAttribute('cx', 789+age*10);
        node.setAttribute('cy', 594+offset);
        node.setAttribute('rx', radius);
        node.setAttribute('ry', radius*.285);
      }
    });
    const splashAge = t-2.10;
    if (splashAge >= 0 && splashAge < .52) {
      const u = splashAge/.52;
      splash.setAttribute('opacity', Math.sin(Math.PI*u)*.85);
      drops.forEach((drop,i) => {
        const dx = (i-2)*13*u;
        const x = 789+dx;
        const y = 591-Math.sin(Math.PI*u)*(17+((i*7)%18));
        drop.setAttribute('d', `M${x} ${y}l${(i-2)*.8} ${-3.5*(1-u)}`);
      });
    } else splash.setAttribute('opacity',0);
    reeds.forEach((node,i) => node.setAttribute('transform', `rotate(${Math.sin(phase+i*.8)*1.7})`));
  }
  // All movement is evaluated from one 6000 ms clock. No accumulating state,
  // timers, external assets, or network access are needed for repeated playback.
  const start = performance.now();
  render(0);
  function frame(now) {
    render(((now-start)%6000)/1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
