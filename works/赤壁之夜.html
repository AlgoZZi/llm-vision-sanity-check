 previousTimeline=timeline;if(!seeking)storyClock+=dt;timeline=storyClock%BEAT.end;const nextCycle=Math.floor(storyClock/BEAT.end);if(nextCycle!==cycle){cycle=nextCycle;if(walk.host||controls.follow?.dead){walk.host=null;if(controls.mode==='walk')riseToFlight()}}
 U.time.value=elapsed;U.story.value=timeline;const rise=smooth(BEAT.wind,BEAT.voyage-3,timeline),calm=1-smooth(BEAT.embers+4,BEAT.end-2,timeline);U.wind.value=mix(CONFIG.wind.calm,CONFIG.wind.maximum,rise*calm);
 let sum=0;for(const s of ships)sum+=s.burn;const fire=clamp(sum/67,0,1);U.blaze.value=mix(U.blaze.value,fire,1-Math.exp(-dt*2));U.mist.value=clamp(1-fire*.92+smooth(BEAT.embers+4,BEAT.end-1,timeline)*.24,.08,1.15);
 const opening=smooth(0,3,elapsed),loopFade=seeking||elapsed<seekGraceUntil?1:Math.min(smooth(0,.8,timeline),1-smooth(BEAT.end-1.1,BEAT.end,timeline));finalPass.uniforms.uFade.value=opening*loopFade;
}
function updateFlags(){
 const damage=flagMesh.geometry.attributes.aDamage.array,angle=Math.atan2(-WIND.z,WIND.x);
 for(let i=0;i<flagRecords.length;i++){const f=flagRecords[i];let x=f.x,y=f.y,z=f.z,loss=0;if(f.ship){const s=f.ship,l=f.local;let lx=l[0],ly=l[1],lz=l[2];if(s.collapse>0){const pivot=s.spec.deck,h=ly-pivot,theta=s.collapse*(1.3+s.seed*.2);lx-=Math.sin(theta)*h;ly=pivot+Math.cos(theta)*h}const p=shipToWorld(s,lx,ly,lz);x=p.x;y=p.y;z=p.z;loss=s.char*.99;if(s.isFire&&timeline>BEAT.ignition+7.5&&timeline<BEAT.ignition+7.75)loss=0;}else if(z<northBank(x)-40&&timeline>BEAT.inferno+36)loss=smooth(BEAT.inferno+36,BEAT.embers+12,timeline)*.75;
  dummy.position.set(x,y,z);dummy.rotation.set(0,angle,0);const scale=loss>.94?1-smooth(.94,1,loss):1;dummy.scale.set(f.w*scale,f.h*scale,1);dummy.updateMatrix();flagMesh.setMatrixAt(i,dummy.matrix);damage[i]=loss;
 }flagMesh.instanceMatrix.needsUpdate=true;flagMesh.geometry.attributes.aDamage.needsUpdate=true;
}
const lightCandidates=[];
function updateFireLight(dt){
 lightCandidates.length=0;
 for(const s of ships)if(s.burn>.03){const p=new THREE.Vector3(s.x,s.y+7,s.z),d=camera.position.distanceToSquared(p);lightCandidates.push({x:p.x,y:p.y,z:p.z,power:s.burn*1.4,score:s.burn/(d+90)})}
 // 最多三个表面动态点光；其余九个光斑仅参与水面反射。
 for(const f of groundFlames){const power=f.camp?smooth(BEAT.inferno+27+f.delay,BEAT.inferno+37+f.delay,timeline)*(1-smooth(BEAT.embers+2,BEAT.end-1,timeline))*.9:f.strength*.22;if(power<.01)continue;const d=(camera.position.x-f.x)**2+(camera.position.y-f.y)**2+(camera.position.z-f.z)**2;lightCandidates.push({x:f.x,y:f.y+1,z:f.z,power,score:power/(d+15)})}
 lightCandidates.sort((a,b)=>b.score-a.score);for(let i=0;i<3;i++){const f=lightCandidates[i];if(f)fireSources[i].set(f.x,f.y,f.z,f.power*(.92+Math.sin(elapsed*7+i*3)*.045));else fireSources[i].w=0;}
 for(let k=0;k<9;k++){const min=-370+k*83,max=min+83;let x=0,z=0,total=0;for(const s of ships)if(s.burn>.02&&s.x>=min&&s.x<max){x+=s.x*s.burn;z+=s.z*s.burn;total+=s.burn}if(total>0)fireSources[k+3].set(x/total,8,z/total,clamp(total/4,0,2.7));else fireSources[k+3].set(min+41,5,-100,.025)}
 let heat=0;if(controls.mode==='walk')for(const s of ships){if(s.burn<.08)continue;const d=Math.hypot(s.x-camera.position.x,s.z-camera.position.z);heat=Math.max(heat,s.burn*(1-smooth(3,s.spec.length*.6+12,d)))}U.heat.value=mix(U.heat.value,heat,1-Math.exp(-dt*2.6));
}
let performanceSeconds=0,performanceFrames=0,lastQualityChange=0;
function adaptQuality(rawDt){
 if(elapsed<6||document.hidden)return;performanceSeconds+=rawDt;performanceFrames++;if(performanceSeconds<3)return;const fps=performanceFrames/performanceSeconds;performanceFrames=0;performanceSeconds=0;let next=quality;if(fps<28)next=clamp(quality-.16,.5,1);else if(fps<43)next=clamp(quality-.07,.5,1);else if(fps>57&&elapsed-lastQualityChange>12)next=clamp(quality+.04,.5,1);if(Math.abs(next-quality)<.015)return;quality=next;lastQualityChange=elapsed;U.quality.value=quality;const pixel=clamp(Math.min(devicePixelRatio,CONFIG.quality.maxPixelRatio)*quality,CONFIG.quality.minPixelRatio,CONFIG.quality.maxPixelRatio);renderer.setPixelRatio(pixel);composer.setPixelRatio(pixel);U.pixel.value=pixel;sparks.geometry.setDrawRange(0,Math.floor(CONFIG.quality.embers*quality));bloomPass.enabled=quality>.54;
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);finalPass.uniforms.uResolution.value.set(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio())}window.addEventListener('resize',resize);
const hint=document.getElementById('hint');let hintShown=false,hintGone=false;
function updateHint(){if(!hintShown&&elapsed>6){hintShown=true;const mobile=navigator.maxTouchPoints>1;hint.textContent=mobile?'左侧行走 · 右侧环顾 · 双指轻点切换 · 双击船只跟随':'左拖平移 · 右键环顾 · 滚轮升降 · WASD / Q E 漫游 · Tab / F 登临 · Esc 解锁 · 双击跟随';if(mobile){hint.style.fontSize='9px';hint.style.letterSpacing='.03em'}hint.style.opacity='1'}if(!hintGone&&elapsed>12.5){hintGone=true;hint.style.opacity='0';setTimeout(()=>hint.remove(),2400)}}

// ── 分块创建：构件模板只生成一次，重复物件随后全部实例化。 ──
createTerrain();createWater();createFleet();createConnections();
createCamp();createCommandPlatform();createShoreDetails();
createPeople();createFlags();createFire();createMist();createNavalLOD();createBirds();worldBatch.finish();
worldReady=true;camera.position.copy(introPos.getPoint(0));camera.lookAt(introLook.getPoint(0));resize();
let lastNow=performance.now();
function animate(now){
 requestAnimationFrame(animate);const rawDt=Math.max(.001,(now-lastNow)/1000);lastNow=now;if(document.hidden)return;const dt=Math.min(rawDt,.05);elapsed+=dt;frame++;
 updateTimeline(dt);updateShips(timeline);if(seekPending){let burn=0;for(const s of ships)burn+=s.burn;U.blaze.value=clamp(burn/67,0,1);U.mist.value=clamp(1-U.blaze.value*.92+smooth(BEAT.embers+4,BEAT.end-1,timeline)*.24,.08,1.15);seekPending=false;}updateFlags();updateCamera(dt);updateFireLight(dt);updateHint();if(frame%4===0)updatePlaybackUI();
 skyObjects.sky.position.copy(camera.position);skyObjects.stars.position.copy(camera.position);
 if(frame%2===0){updatePeople();updateBirds();updateTowLines()}if(frame%3===0)updateDebris();if(frame%12===0)updateLOD();
 bloomPass.strength=.48+U.blaze.value*.27;composer.render(dt);adaptQuality(rawDt);
}
updateFlags();updatePeople();updateBirds();updateTowLines();updateDebris();updateLOD();requestAnimationFrame(animate);

</script>
