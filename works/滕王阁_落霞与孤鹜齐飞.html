<style>

  }
  .hud-title {

  }
  .hud-meta {
    display: flex; align-items: center; gap: 10px;

  }

  .shot-num {

  .shot-row2 {

</style>

function sampleEnvironment(tSec) {
  const u = THREE.MathUtils.clamp(tSec / TOTAL_DURATION, 0, 1);
  let i = 0;
  while (i < TIME_KEYS.length - 2 && u > TIME_KEYS[i + 1].u) i++;
  const a = TIME_KEYS[i], b = TIME_KEYS[i + 1];
  const f = smoothstep(THREE.MathUtils.clamp((u - a.u) / Math.max(1e-5, b.u - a.u), 0, 1));

  const elev = THREE.MathUtils.lerp(a.sunElev, b.sunElev, f) * Math.PI / 180;
  const az = THREE.MathUtils.lerp(a.sunAz, b.sunAz, f) * Math.PI / 180;
  envState.sunDir.set(
    Math.cos(elev) * Math.sin(az),
    Math.sin(elev),
    Math.cos(elev) * Math.cos(az)
  ).normalize();

  lerpHex(a.zenith, b.zenith, f, envState.zenith);
  lerpHex(a.mid, b.mid, f, envState.mid);
  lerpHex(a.horizon, b.horizon, f, envState.horizon);
  lerpHex(a.sunCol, b.sunCol, f, envState.sunCol);
  lerpHex(a.ambCol, b.ambCol, f, envState.ambCol);

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  uniforms: skyUniforms,
  vertexShader: `
    varying vec3 vWorldDir;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldDir = normalize(wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;

  fragmentShader: `
    varying vec3 vWorldDir;
    uniform vec3 uZenith, uMid, uHorizon, uSunDir, uSunCol, uCloudCol, uCloudGlow;
    uniform float uStars, uTime, uCloudOpen;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }
    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                 mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
      for (int i = 0; i < 4; i++) {
        v += a * noise(p);
        p = rot * p * 2.05;
        a *= 0.5;
      }
      return v;
    }

    void main() {
      vec3 d = normalize(vWorldDir);
      float h = clamp(d.y, 0.0, 1.0);
      vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.28, h));
      col = mix(col, uZenith, smoothstep(0.22, 0.82, h));

      // 太阳与霞光晕染
      float sunDot = max(dot(d, normalize(uSunDir)), 0.0);
      float sunVis = smoothstep(-0.12, 0.04, uSunDir.y);
      float halo = pow(sunDot, 6.0) * 0.42 + pow(sunDot, 48.0) * 0.55;
      float disc = smoothstep(0.9992, 0.9997, sunDot) * 2.2 * sunVis;
      col += uSunCol * (halo * smoothstep(-0.22, 0.08, uSunDir.y) + disc);

      float glowBand = exp(-abs(d.y - 0.03) * 14.0) * pow(sunDot, 2.0) * smoothstep(-0.25, 0.05, uSunDir.y);
      col += uCloudGlow * glowBand * 0.45;

      // 程序化云层（随时间飘动，镜12-13出现云开裂隙）
      if (d.y > 0.015) {
        vec2 uv = d.xz / (d.y + 0.16) * 0.95;
        uv.x += uTime * 0.008;
        uv.y += uTime * 0.003;
        float n = fbm(uv * 1.45 + vec2(fbm(uv * 0.8), 0.0) * 0.5);
        float thresh = 0.44 + uCloudOpen * 0.12;
        float cloud = smoothstep(thresh, thresh + 0.28, n) * smoothstep(0.015, 0.16, d.y) * (1.0 - smoothstep(0.55, 0.95, d.y));
        vec3 cShade = mix(uCloudCol, uCloudGlow, pow(sunDot, 2.2) * 0.85);
        col = mix(col, cShade, cloud * 0.72);
      }

      // 夜空星辰
      if (uStars > 0.01 && d.y > 0.04) {
        vec2 suv = floor(vec2(atan(d.z, d.x) * 140.0, asin(clamp(d.y, -1.0, 1.0)) * 220.0));
        float st = hash(suv);
        if (st > 0.9935) {
          float tw = 0.65 + 0.35 * sin(uTime * 2.4 + st * 900.0);
          float bright = smoothstep(0.9935, 0.9998, st) * tw * uStars * smoothstep(0.04, 0.25, d.y);
          col += vec3(0.88, 0.93, 1.0) * bright * 1.35;
        }
      }

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const WATER_Y = 0;

  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat

const reflectCam = new THREE.PerspectiveCamera();
const clipPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -WATER_Y + 0.05);
const textureMatrix = new THREE.Matrix4();

const waterUniforms = {
  tReflect: { value: reflectRT.texture },
  uTexMatrix: { value: textureMatrix },
  uTime: { value: 0 },
  uSunDir: { value: new THREE.Vector3() },
  uSunCol: { value: new THREE.Color() },
  uWaterTint: { value: new THREE.Color(0x2a5a75) },
  uFogCol: { value: new THREE.Color(0xc2d1dc) },
  uFogDen: { value: 0.002 }
};

const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  vertexShader: `
    uniform mat4 uTexMatrix;
    varying vec4 vReflCoord;
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      vReflCoord = uTexMatrix * wp;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform sampler2D tReflect;
    uniform float uTime;
    uniform vec3 uSunDir, uSunCol, uWaterTint, uFogCol;
    uniform float uFogDen;
    varying vec4 vReflCoord;
    varying vec3 vWorldPos;

    float waveH(vec2 p, float t) {
      float w = 0.0;
      w += sin(p.x * 0.17 + t * 1.15 + cos(p.y * 0.13 - t * 0.7)) * 0.45;
      w += sin(p.y * 0.29 - t * 1.45 + p.x * 0.09) * 0.30;
      w += sin((p.x - p.y) * 0.52 + t * 2.1) * 0.16;
      w += cos((p.x + p.y * 1.3) * 0.95 - t * 2.6) * 0.09;
      return w;
    }

    void main() {
      vec2 p = vWorldPos.xz;
      float eps = 0.22;
      float hC = waveH(p, uTime);
      float hX = waveH(p + vec2(eps, 0.0), uTime);
      float hZ = waveH(p + vec2(0.0, eps), uTime);
      vec3 N = normalize(vec3((hC - hX) * 0.18, 1.0, (hC - hZ) * 0.18));

      vec3 V = normalize(cameraPosition - vWorldPos);
      float dist = length(cameraPosition - vWorldPos);

      // 真实平面反射 UV + 水波折射扰动
      vec2 reflUV = vReflCoord.xy / max(vReflCoord.w, 0.0001);
      float distAtten = clamp(1.0 / (1.0 + dist * 0.004), 0.18, 1.0);
      vec2 distort = N.xz * (0.045 * distAtten);
      vec2 uv = clamp(reflUV + distort, vec2(0.003), vec2(0.997));
      vec3 reflCol = texture2D(tReflect, uv).rgb;

      // Fresnel 混合水体底色与实时倒影
      float ndv = clamp(dot(N, V), 0.0, 1.0);
      float fresnel = mix(0.18, 0.96, pow(1.0 - ndv, 3.2));
      vec3 deepCol = uWaterTint * (0.55 + 0.45 * clamp(uSunDir.y + 0.35, 0.15, 1.0));
      vec3 col = mix(deepCol, reflCol, fresnel);

      // 日照/霞光水面碎金高光
      vec3 L = normalize(vec3(uSunDir.x, max(uSunDir.y, 0.045), uSunDir.z));
      vec3 H = normalize(L + V);
      float spec = pow(max(dot(N, H), 0.0), 160.0) * 1.85 + pow(max(dot(N, H), 0.0), 28.0) * 0.25;
      float sunFade = smoothstep(-0.22, 0.08, uSunDir.y);
      col += uSunCol * spec * sunFade;

      // 指数平方雾与远景一致
      float fogF = 1.0 - exp(-pow(dist * uFogDen, 2.0));
      col = mix(col, uFogCol, clamp(fogF, 0.0, 1.0));

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const waterMesh = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400, 1, 1), waterMat);

function updateWaterReflection() {
  waterMesh.visible = false;
  reflectCam.copy(camera);
  reflectCam.position.y = 2 * WATER_Y - camera.position.y;
  const look = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).add(camera.position);
  look.y = 2 * WATER_Y - look.y;
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  up.y = -up.y;
  reflectCam.up.copy(up);
  reflectCam.lookAt(look);
  reflectCam.updateMatrixWorld();
  reflectCam.updateProjectionMatrix();

  // 构造投影矩阵（翻转镜像纹理映射）
  textureMatrix.set(
    0.5, 0.0, 0.0, 0.5,
    0.0, 0.5, 0.0, 0.5,
    0.0, 0.0, 0.5, 0.5,
    0.0, 0.0, 0.0, 1.0
  );
  textureMatrix.multiply(reflectCam.projectionMatrix);
  textureMatrix.multiply(reflectCam.matrixWorldInverse);

  // 裁剪水下几何体避免倒影穿帮
  renderer.clippingPlanes = [clipPlane];
  const prevTarget = renderer.getRenderTarget();
  renderer.setRenderTarget(reflectRT);
  renderer.clear();
  renderer.render(scene, reflectCam);
  renderer.setRenderTarget(prevTarget);
  renderer.clippingPlanes = [];
  waterMesh.visible = true;
}

  for (const [x, z, rx, h, rz, tier] of peaks) {
    const geo = new THREE.ConeGeometry(1, h, 7, 2);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
      const n = 1 + 0.18 * Math.sin(vx * 5 + x) * Math.cos(vz * 4 + z);
      pos.setXYZ(i, vx * rx * n, vy + h * 0.45, vz * rz * n);
    }
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, tier === 0 ? mountainMatFar : mountainMatMid);
    m.position.set(x, -3, z);
    group.add(m);
  }

  // 滕王阁所在东岸基堤 + 远处沙洲
  const bank = new THREE.Mesh(new THREE.CylinderGeometry(52, 68, 6, 32), shoreMat);
  bank.position.set(0, -1.2, -16);
  bank.scale.set(1.25, 1, 0.92);
  bank.receiveShadow = true;
  group.add(bank);

  const shoals = [[-130, 85, 42, 14], [155, 115, 52, 18], [-85, -135, 36, 12]];
  for (const [sx, sz, rx, rz] of shoals) {
    const s = new THREE.Mesh(new THREE.CylinderGeometry(rx * 0.7, rx, 2.2, 18), shoreMat);
    s.position.set(sx, -0.4, sz);
    s.scale.set(1, 1, rz / rx);
    group.add(s);
  }

  // 岸畔古柳与松树（低多边形写意层次）
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3b2c22, roughness: 0.95 });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x2c4731, roughness: 0.88 });
  const treeCoords = [
    [-34, 2, -6], [-40, 2, -16], [-32, 2, -26], [34, 2, -6], [42, 2, -18], [30, 2, -28],
    [-26, 2, -34], [24, 2, -36], [-48, 1.5, -22], [46, 1.5, -10]
  ];
  for (const [tx, ty, tz] of treeCoords) {
    const tGrp = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.48, 5.2, 6), trunkMat);
    trunk.position.y = 2.6;
    trunk.rotation.z = (Math.sin(tx) * 0.14);
    tGrp.add(trunk);
    for (let k = 0; k < 3; k++) {
      const crown = new THREE.Mesh(new THREE.DodecahedronGeometry(2.4 - k * 0.35, 1), leafMat);
      crown.position.set((k - 1) * 1.1, 5.0 + k * 0.9, Math.cos(tz + k) * 0.8);
      crown.scale.set(1.25, 0.78, 1.15);
      tGrp.add(crown);
    }
    tGrp.position.set(tx, ty, tz);
    group.add(tGrp);
  }

  scene.add(group);
}

// ==================== 7. 孤鹜与飞鸟群（镜14长焦实时追踪领航孤鹜） ====================
const birds = [];
const birdBodyMat = new THREE.MeshStandardMaterial({ color: 0xf4ece2, roughness: 0.7 });
const birdWingTipMat = new THREE.MeshStandardMaterial({ color: 0x2a2726, roughness: 0.8 });

function createBird(scale = 1.0) {
  const root = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.22, 1.35, 6), birdBodyMat);
  body.rotation.x = Math.PI / 2;
  root.add(body);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.55, 5), birdBodyMat);
  neck.rotation.x = Math.PI / 2.2;
  neck.position.set(0, 0.08, 0.75);
  root.add(neck);

  // 左右扇动翅膀
  const wingGeo = new THREE.BoxGeometry(1.45, 0.05, 0.42);
  wingGeo.translate(0.72, 0, 0);
  const leftPivot = new THREE.Group();
  const leftWing = new THREE.Mesh(wingGeo, birdBodyMat);
  const leftTip = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.045, 0.34), birdWingTipMat);
  leftTip.position.set(1.55, 0, -0.04);
  leftPivot.add(leftWing, leftTip);
  leftPivot.position.set(0.1, 0.05, 0.08);
  root.add(leftPivot);

  const rightPivot = new THREE.Group();
  const rightWing = new THREE.Mesh(wingGeo, birdBodyMat);
  rightWing.scale.x = -1;
  const rightTip = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.045, 0.34), birdWingTipMat);
  rightTip.position.set(-1.55, 0, -0.04);
  rightPivot.add(rightWing, rightTip);
  rightPivot.position.set(-0.1, 0.05, 0.08);
  root.add(rightPivot);

  root.scale.setScalar(scale);
  scene.add(root);
  return { root, leftPivot, rightPivot };
}

// 1 只领航孤鹜（用于镜14-15精准跟拍）+ 6 只伴飞远鸿
const leadBird = createBird(1.35);
birds.push({ obj: leadBird, isLead: true, offset: new THREE.Vector3(0, 0, 0), phase: 0 });
const flockOffsets = [
  [-5.5, 1.4, -4.5], [6.2, 2.0, -5.8], [-10.5, 2.8, -9.0],
  [11.0, 0.9, -10.2], [-15.5, 3.6, -14.0], [16.8, 2.2, -16.0]
];
flockOffsets.forEach((off, idx) => {
  birds.push({
    obj: createBird(0.95 + (idx % 2) * 0.15),
    isLead: false,
    offset: new THREE.Vector3(...off),
    phase: idx * 1.15 + 0.7
  });
});

// 确定性飞鸟轨迹函数（任意时间 tSec 可精确定位，确保长焦锁拍稳定）
function getLeadBirdPos(tSec, out = new THREE.Vector3()) {
  // 在 120s-140s 期间掠过阁前江天与落霞方向
  const dt = tSec - 125;
  const x = -65 + dt * 5.2 + Math.sin(dt * 0.25) * 8;
  const y = 34 + Math.sin(dt * 0.32) * 3.8 + Math.max(0, dt) * 0.22;
  const z = 44 - Math.cos(dt * 0.18) * 14 - dt * 1.1;
  return out.set(x, y, z);
}

const _bPos = new THREE.Vector3(), _bNext = new THREE.Vector3();
function updateBirds(tSec) {
  getLeadBirdPos(tSec, _bPos);
  getLeadBirdPos(tSec + 0.15, _bNext);
  for (const b of birds) {
    const p = _bPos.clone().add(b.offset);
    if (!b.isLead) {
      p.y += Math.sin(tSec * 1.4 + b.phase) * 0.9;
    }
    const pNext = _bNext.clone().add(b.offset);
    b.obj.root.position.copy(p);
    b.obj.root.lookAt(pNext);
    const flap = Math.sin(tSec * 6.8 + b.phase) * 0.58;
    b.obj.leftPivot.rotation.z = flap;
    b.obj.rightPivot.rotation.z = -flap;
  }
}

// 辅助函数：构建带翘角飞檐、瓦当与脊兽的中式重檐屋顶
function buildChineseRoof(width, depth, height, eaveOverhang, yPos, isTop = false) {
  const g = new THREE.Group();
  const halfW = width * 0.5 + eaveOverhang;
  const halfD = depth * 0.5 + eaveOverhang;

  // 1) 主屋面（四坡微微反宇曲面）
  const segX = 12, segZ = 12;
  const roofGeo = new THREE.PlaneGeometry(halfW * 2, halfD * 2, segX, segZ);
  roofGeo.rotateX(-Math.PI / 2);
  const pos = roofGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const nx = Math.abs(x) / halfW;
    const nz = Math.abs(z) / halfD;
    const d = Math.max(nx, nz); // 0=中心, 1=檐口
    // 传统反宇举折曲线 + 四角翼角翘起
    const ridgeFlat = isTop ? 0.14 : 0.34;
    const slopeT = THREE.MathUtils.clamp((d - ridgeFlat) / (1 - ridgeFlat), 0, 1);
    let y = height * Math.pow(Math.max(0, 1 - slopeT), 1.45);
    // 翼角翘起（四角 nx, nz 同大处明显上扬）
    const cornerBoost = Math.pow(Math.max(0, nx * nz), 1.8) * 2.15;
    y += cornerBoost;
    pos.setY(i, y);
  }
  roofGeo.computeVertexNormals();
  const roofMesh = new THREE.Mesh(roofGeo, matTileGreen);
  roofMesh.castShadow = true;
  roofMesh.receiveShadow = true;
  g.add(roofMesh);

  // 2) 四条垂脊 + 翼角翘脊与脊兽（镜05近景特写要点）
  const corners = [
    [-halfW, -halfD], [halfW, -halfD], [halfW, halfD], [-halfW, halfD]
  ];
  for (const [cx, cz] of corners) {
    const dirX = Math.sign(cx), dirZ = Math.sign(cz);
    // 脊兽队列（仙人走兽 4 尊沿翼角斜脊排列）
    for (let k = 0; k < 4; k++) {
      const f = 0.72 + k * 0.085;
      const sx = cx * f, sz = cz * f;
      const rf = isTop ? 0.14 : 0.34;
      const st = THREE.MathUtils.clamp((f - rf) / (1 - rf), 0, 1);
      const sy = height * Math.pow(Math.max(0, 1 - st), 1.45)
                 + Math.pow(f * f, 1.8) * 2.15 + 0.42;
      const beast = new THREE.Mesh(
        new THREE.ConeGeometry(0.18 - k * 0.02, 0.72 - k * 0.06, 5),
        matGold
      );
      beast.position.set(sx, sy, sz);
      beast.rotation.z = -dirX * 0.18;
      beast.rotation.x = dirZ * 0.18;
      g.add(beast);
    }
    // 檐角翘首龙头吻饰
    const finial = new THREE.Mesh(new THREE.OctahedronGeometry(0.36, 0), matGold);
    finial.position.set(cx * 1.01, 2.35, cz * 1.01);
    g.add(finial);
  }

  // 3) 檐口金色瓦当排列（沿正南临江面和东西两侧）
  const wadangGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.16, 8);
  wadangGeo.rotateX(Math.PI / 2);
  const step = 1.15;
  for (let x = -halfW + 0.6; x <= halfW - 0.6; x += step) {
    const nx = Math.abs(x) / halfW;
    const wy = Math.pow(nx, 1.8) * 2.15 - 0.08;
    const w1 = new THREE.Mesh(wadangGeo, matGold);
    w1.position.set(x, wy, halfD + 0.04);
    g.add(w1);
    const w2 = new THREE.Mesh(wadangGeo, matGold);
    w2.position.set(x, wy, -halfD - 0.04);
    g.add(w2);
  }

  // 4) 顶层正脊与宝顶鸱吻
  if (isTop) {
    const ridge = new THREE.Mesh(new THREE.BoxGeometry(width * 0.45, 0.9, 0.75), matGold);
    ridge.position.y = height + 0.35;
    g.add(ridge);
    const spire = new THREE.Mesh(new THREE.ConeGeometry(0.85, 3.8, 8), matGold);
    spire.position.y = height + 2.4;
    g.add(spire);
    for (const s of [-1, 1]) {
      const chiwen = new THREE.Mesh(new THREE.BoxGeometry(0.95, 1.5, 0.6), matGold);
      chiwen.position.set(s * (width * 0.22), height + 0.95, 0);
      g.add(chiwen);
    }
  }

  // 5) 檐下斗拱带（红木色横枋+斗拱块）
  const beam = new THREE.Mesh(new THREE.BoxGeometry(width + 1.2, 0.9, depth + 1.2), matCrimson);
  beam.position.y = -0.5;
  g.add(beam);

  const dgGeo = new THREE.BoxGeometry(0.55, 0.52, 0.85);
  for (let x = -width * 0.48; x <= width * 0.48; x += 2.2) {
    const dgF = new THREE.Mesh(dgGeo, matGold);
    dgF.position.set(x, -0.88, depth * 0.5 + 0.35);
    g.add(dgF);
    const dgB = new THREE.Mesh(dgGeo, matGold);
    dgB.position.set(x, -0.88, -depth * 0.5 - 0.35);
    g.add(dgB);
  }

  g.position.y = yPos;
  return g;
}

// 辅助函数：白玉石栏杆一段
function buildBalustrade(x1, z1, x2, z2, y, posts = 6) {
  const g = new THREE.Group();
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.hypot(dx, dz);
  const ang = Math.atan2(dx, dz);
  const rail = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.18, len), matMarble);
  rail.position.set((x1 + x2) * 0.5, y + 0.95, (z1 + z2) * 0.5);
  rail.rotation.y = ang;
  g.add(rail);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.62, len - 0.2), matMarble);
  panel.position.set((x1 + x2) * 0.5, y + 0.45, (z1 + z2) * 0.5);
  panel.rotation.y = ang;
  g.add(panel);

  for (let i = 0; i <= posts; i++) {
    const f = i / posts;
    const px = x1 + dx * f, pz = z1 + dz * f;
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.22, 0.3), matMarble);
    post.position.set(px, y + 0.61, pz);
    g.add(post);
    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.17, 7, 7), matMarble);
    orb.position.set(px, y + 1.32, pz);
    g.add(orb);
  }
  return g;
}

// 构筑滕王阁主体（中心位于 x=0, z=-16，正面朝向 +Z 赣江）
function buildTengwangPavilion() {
  const Z0 = -16;

  // --- A. 临江水岸码头 + 丹陛石阶（镜02、镜03沿阶加速仰升） ---
  const pier = new THREE.Mesh(new THREE.BoxGeometry(20, 1.4, 14), matStoneDark);
  pier.position.set(0, 0.5, 22);
  pier.receiveShadow = true;
  pavilionGroup.add(pier);

  // 逐级石阶（从水岸 z=16, y=1.1 升至一层台基 z=4, y=6.5）
  const stepCount = 16;
  for (let i = 0; i < stepCount; i++) {
    const f = i / (stepCount - 1);
    const st = new THREE.Mesh(new THREE.BoxGeometry(11.5, 0.48, 0.95), matStone);
    st.position.set(0, 1.2 + f * 5.2, 16.5 - f * 12.2);
    st.receiveShadow = true;
    pavilionGroup.add(st);
  }
  // 石阶两侧白石望柱与斜栏（形成镜03前景掠过）
  for (const side of [-1, 1]) {
    for (let i = 0; i <= 7; i++) {
      const f = i / 7;
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.55, 0.45), matMarble);
      p.position.set(side * 6.0, 1.9 + f * 5.2, 16.6 - f * 12.2);
      pavilionGroup.add(p);
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 8), matMarble);
      cap.position.set(side * 6.0, 2.75 + f * 5.2, 16.6 - f * 12.2);
      pavilionGroup.add(cap);
    }
  }

  // --- B. 高大砖石城台基座（仿宋高台制式） ---
  const base1 = new THREE.Mesh(new THREE.BoxGeometry(44, 6.5, 36), matStoneDark);
  base1.position.set(0, 3.25, Z0);
  base1.receiveShadow = true;
  base1.castShadow = true;
  pavilionGroup.add(base1);

  const base2 = new THREE.Mesh(new THREE.BoxGeometry(36, 3.0, 30), matStone);
  base2.position.set(0, 8.0, Z0);
  base2.receiveShadow = true;
  pavilionGroup.add(base2);

  // 台基四周白石栏杆（临江正中留石阶开口）
  const Y_BASE1 = 6.5;
  pavilionGroup.add(buildBalustrade(-21.5, Z0 + 17.5, -6.2, Z0 + 17.5, Y_BASE1, 5));
  pavilionGroup.add(buildBalustrade(6.2, Z0 + 17.5, 21.5, Z0 + 17.5, Y_BASE1, 5));
  pavilionGroup.add(buildBalustrade(-21.5, Z0 - 17.5, -21.5, Z0 + 17.5, Y_BASE1, 8));
  pavilionGroup.add(buildBalustrade(21.5, Z0 - 17.5, 21.5, Z0 + 17.5, Y_BASE1, 8));

  // --- C. 三层明阁 + 朱漆廊柱回廊 + 宫灯 + 上层雕花望江窗 ---
  const floors = [
    { y: 9.5,  h: 6.4, w: 26, d: 21, eave: 4.2, roofH: 3.6, colStep: 4.3, hasTerrace: false, isTop: false },
    { y: 18.8, h: 6.0, w: 21, d: 17, eave: 3.9, roofH: 3.4, colStep: 4.1, hasTerrace: true,  isTop: false },
    { y: 27.6, h: 5.8, w: 15.5, d: 12.5, eave: 3.6, roofH: 5.4, colStep: 3.7, hasTerrace: true, isTop: true }
  ];

  floors.forEach((fl, fi) => {
    const fg = new THREE.Group();
    fg.position.set(0, fl.y, Z0);

    // 平台楼板
    const slab = new THREE.Mesh(new THREE.BoxGeometry(fl.w + 4.8, 0.7, fl.d + 4.8), matStone);
    slab.position.y = -0.35;
    slab.receiveShadow = true;
    fg.add(slab);

    // 核心殿身墙体（留出顶层正南临江开窗洞，供镜11窗内望江）
    if (!fl.isTop) {
      const core = new THREE.Mesh(new THREE.BoxGeometry(fl.w - 3.6, fl.h, fl.d - 3.6), matWallCream);
      core.position.y = fl.h * 0.5;
      core.castShadow = true;
      core.receiveShadow = true;
      fg.add(core);
      // 暖光格栅门窗装饰条
      const winBand = new THREE.Mesh(new THREE.BoxGeometry(fl.w - 3.4, fl.h * 0.58, fl.d - 3.4), matWindowGlow);
      winBand.position.y = fl.h * 0.52;
      fg.add(winBand);
    } else {
      // 顶层中空明间（北、东、西三面墙 + 南面雕花大窗框，方便镜10-12穿窗）
      const iw = fl.w - 3.6, id = fl.d - 3.6;
      const backW = new THREE.Mesh(new THREE.BoxGeometry(iw, fl.h, 0.5), matWallCream);
      backW.position.set(0, fl.h * 0.5, -id * 0.5);
      const leftW = new THREE.Mesh(new THREE.BoxGeometry(0.5, fl.h, id), matWallCream);
      leftW.position.set(-iw * 0.5, fl.h * 0.5, 0);
      const rightW = new THREE.Mesh(new THREE.BoxGeometry(0.5, fl.h, id), matWallCream);
      rightW.position.set(iw * 0.5, fl.h * 0.5, 0);
      fg.add(backW, leftW, rightW);

      // 南面望江雕花大窗框（镜11以窗框当画框！）
      const fz = id * 0.5;
      const frameTop = new THREE.Mesh(new THREE.BoxGeometry(iw, 1.15, 0.42), matCrimson);
      frameTop.position.set(0, fl.h - 0.58, fz);
      const frameBot = new THREE.Mesh(new THREE.BoxGeometry(iw, 1.25, 0.42), matCrimson);

// 辅助：平滑样条节点插值（使用 Catmull-Rom 风格切线，保证速度连续无折角）
function evalCatmullScalar(p0, p1, p2, p3, u) {
  const u2 = u * u, u3 = u2 * u;
  return 0.5 * (
    (2 * p1) +
    (-p0 + p2) * u +
    (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 +
    (-p0 + 3 * p1 - 3 * p2 + p3) * u3
  );
}

function evalCatmullVec3(a0, a1, a2, a3, u, out) {
  out.set(
    evalCatmullScalar(a0[0], a1[0], a2[0], a3[0], u),
    evalCatmullScalar(a0[1], a1[1], a2[1], a3[1], u),
    evalCatmullScalar(a0[2], a1[2], a2[2], a3[2], u)
  );
  return out;
}

function updateCameraAndFx(tSec) {
  const t = THREE.MathUtils.clamp(tSec, 0, TOTAL_DURATION);

  // 查找当前所属分段 i (CAM_NODES[i].t <= t <= CAM_NODES[i+1].t)
  let i = 0;
  while (i < CAM_NODES.length - 2 && t >= CAM_NODES[i + 1].t) i++;
  const n0 = CAM_NODES[Math.max(0, i - 1)];
  const n1 = CAM_NODES[i];
  const n2 = CAM_NODES[i + 1];
  const n3 = CAM_NODES[Math.min(CAM_NODES.length - 1, i + 2)];

  let u = THREE.MathUtils.clamp((t - n1.t) / Math.max(1e-5, n2.t - n1.t), 0, 1);

  // 第一幕入景（镜01-03）：抬升带明显加速度（非线性时间映射，非匀速平移）
  if (i === 0) {
    u = Math.pow(u, 1.55); // 贴水由极慢渐加速
  } else if (i === 1) {
    u = Math.pow(u, 1.38); // 离水抬升继续带加速度
  } else if (i === 2) {
    u = Math.pow(u, 1.25); // 拾级而上带仰升加速度
  } else if (i === 14) {
    // 镜15：急速拉出到天际线（前快后舒展）
    u = 1 - Math.pow(1 - u, 2.35);
  }

  // 基础平滑样条位置与朝向
  evalCatmullVec3(n0.pos, n1.pos, n2.pos, n3.pos, u, _v1);
  evalCatmullVec3(n0.look, n1.look, n2.look, n3.look, u, _v2);
  let fov = THREE.MathUtils.lerp(n1.fov, n2.fov, smoothstep(u));

  // === 镜头专属连续细节修饰（使用 sin(pi*u) 窗函数，端点严格为 0，绝不破坏连续性） ===
  const win = Math.sin(Math.PI * u);

  // 镜01 (0-8s)：严格贴水只看倒影，压低视线避免楼体提前入画
  if (i === 0) {
    _v1.y = Math.min(_v1.y, 0.58 + u * 0.55);
    _v2.y = THREE.MathUtils.lerp(-11.2, -1.8, Math.pow(u, 1.8));
  }

  // 镜04 (23-30s)：绕宫灯微弧
  if (i === 3) {
    _v1.x += win * 2.2;
    _v1.z += win * 2.4;
  }

  // 镜06 (37-45s)：朱漆廊柱间横移（特意贴近 z=-6.3 穿行于柱列外侧，柱子从镜头前依次掠过）
  if (i === 5) {
    const rawU = THREE.MathUtils.clamp((t - n1.t) / (n2.t - n1.t), 0, 1);
    _v1.set(
      THREE.MathUtils.lerp(12.2, -0.95, smoothstep(rawU)),
      THREE.MathUtils.lerp(20.8, 20.65, rawU) + Math.sin(rawU * Math.PI) * 0.35,
      THREE.MathUtils.lerp(-5.2, -7.7, rawU) + Math.sin(rawU * Math.PI) * 2.1
    );
    _v2.set(
      THREE.MathUtils.lerp(4.0, 0.0, rawU),
      20.6,
      THREE.MathUtils.lerp(-7.8, 22.0, smoothstep(rawU))
    );
  }

  // 镜07 (45-55s)：越肩把人物甩出画（先贴在人物左肩后，推进越过 z=-5.6，将人甩到镜头背后）
  if (i === 6) {
    const rawU = THREE.MathUtils.clamp((t - n1.t) / (n2.t - n1.t), 0, 1);
    const s = smoothstep(rawU);
    _v1.set(
      THREE.MathUtils.lerp(-0.95, 0.2, s) - Math.sin(rawU * Math.PI) * 0.35,
      THREE.MathUtils.lerp(20.65, 21.6, s),
      THREE.MathUtils.lerp(-7.7, 4.5, Math.pow(rawU, 1.15))
    );
    _v2.set(
      THREE.MathUtils.lerp(0.0, 0.0, s),
      THREE.MathUtils.lerp(20.4, 19.5, s),
      THREE.MathUtils.lerp(22.0, 65.0, s)
    );
  }

  // 镜09 (66-78s)：大航拍环绕 >160°（沿半径 76m 弧线绕楼旋转，端点与 n1/n2 精确闭合）
  if (i === 8) {
    const rawU = THREE.MathUtils.clamp((t - n1.t) / (n2.t - n1.t), 0, 1);
    const s = smoothstep(rawU);
    const angStart = Math.atan2(n1.pos[0], n1.pos[2] + 16); // ~0.58 rad
    const angEnd = angStart + 2.88; // 旋转 ~165°（满足 >120° 硬指标）
    const rStart = Math.hypot(n1.pos[0], n1.pos[2] + 16);
    const rEnd = Math.hypot(n2.pos[0], n2.pos[2] + 16);
    const ang = THREE.MathUtils.lerp(angStart, angEnd, s);
    // 末端平滑拉回 n2 实际方位角，保持 165° 大弧同时无缝落位 n2
    const targetAng = Math.atan2(n2.pos[0], n2.pos[2] + 16) + Math.PI * 2;
    const blendedAng = THREE.MathUtils.lerp(angStart, targetAng, s);
    const rad = THREE.MathUtils.lerp(rStart, rEnd, s) + Math.sin(s * Math.PI) * 26.0;
    _v1.set(
      Math.sin(blendedAng) * rad,
      THREE.MathUtils.lerp(n1.pos[1], n2.pos[1], s) + Math.sin(s * Math.PI) * 18.0,
      -16 + Math.cos(blendedAng) * rad
    );
    _v2.set(0, THREE.MathUtils.lerp(18.0, 30.2, s * s), -16);
  }

  // 镜11 (88-99s)：顶层窗内往外看（严格保持在顶层明间内部，窗框清晰框住江景）
  if (i === 10) {
    const rawU = THREE.MathUtils.clamp((t - n1.t) / (n2.t - n1.t), 0, 1);
    const s = smoothstep(rawU);
    _v1.set(
      THREE.MathUtils.lerp(1.4, -0.5, s),
      THREE.MathUtils.lerp(30.0, 30.2, s),
      THREE.MathUtils.lerp(-16.8, -10.8, s)
    );
    _v2.set(
      THREE.MathUtils.lerp(-0.8, -6.0, s),
      THREE.MathUtils.lerp(29.3, 28.5, s),
      THREE.MathUtils.lerp(18.0, 35.0, s)
    );
  }

  // 镜14 (120-130s)：长焦真实锁定跟拍领航孤鹜
  if (i === 13) {
    const rawU = THREE.MathUtils.clamp((t - n1.t) / (n2.t - n1.t), 0, 1);
    getLeadBirdPos(t, _birdTmp);
    // 权重在镜中达 1.0，两端平滑融入前后镜朝向
    const lockW = smoothstep(Math.min(1, rawU * 4.5)) * smoothstep(Math.min(1, (1 - rawU) * 5.0));
    _v2.lerp(_birdTmp, lockW);
    fov = THREE.MathUtils.lerp(36, 20, smoothstep(rawU));
  }

  // 镜15 (130-140s)：前段仍带一点跟鸟惯性，随即急速广角拉向天际线
  if (i === 14) {
    const rawU = THREE.MathUtils.clamp((t - n1.t) / (n2.t - n1.t), 0, 1);
    getLeadBirdPos(t, _birdTmp);
    const tailLock = Math.max(0, 1 - rawU * 3.0);
    _v2.lerp(_birdTmp, tailLock * tailLock);
    fov = THREE.MathUtils.lerp(20, 54, 1 - Math.pow(1 - rawU, 2.2));
  }

  // 镜24 (253-271s)：高处露台大角度缓环绕（>145°），柱子与飞檐掠过前景
  if (i === 23) {
    const rawU = THREE.MathUtils.clamp((t - n1.t) / (n2.t - n1.t), 0, 1);
    const s = smoothstep(rawU);
    const cx = 0.0, cz = -8.0; // 以露台人物与高阁为中心
    const a1 = Math.atan2(n1.pos[0] - cx, n1.pos[2] - cz);
    let a2 = Math.atan2(n2.pos[0] - cx, n2.pos[2] - cz);
    // 确保逆时针/顺时针跨越约 150°+
    while (a2 - a1 < 2.45) a2 += Math.PI * 2;
    if (a2 - a1 > 3.6) a2 = a1 + 2.65;
    const r1 = Math.hypot(n1.pos[0] - cx, n1.pos[2] - cz);
    const r2 = Math.hypot(n2.pos[0] - cx, n2.pos[2] - cz);
    // 末端精确对齐 n2
    const ang = THREE.MathUtils.lerp(a1, Math.atan2(n2.pos[0] - cx, n2.pos[2] - cz) - Math.PI * 2, s);
    // 选弧长 ~2.6 rad (~149°)
    const arcAng = a1 - s * 2.58;
    const endFix = smoothstep(Math.max(0, (s - 0.82) / 0.18));
    const rad = THREE.MathUtils.lerp(r1, r2, s) + Math.sin(s * Math.PI) * 5.2;
    const rx = cx + Math.sin(arcAng) * rad;
    const rz = cz + Math.cos(arcAng) * rad;
    const ry = THREE.MathUtils.lerp(n1.pos[1], n2.pos[1], s) + Math.sin(s * Math.PI) * 1.4;
    _v1.set(
      THREE.MathUtils.lerp(rx, n2.pos[0], endFix),
      THREE.MathUtils.lerp(ry, n2.pos[1], endFix),
      THREE.MathUtils.lerp(rz, n2.pos[2], endFix)
    );
    _v2.set(
      THREE.MathUtils.lerp(0.0, -4.0, s),
      THREE.MathUtils.lerp(29.2, 26.0, s),
      THREE.MathUtils.lerp(-8.0, -12.0, s)
    );
  }

  // 镜27 (309-330s)：保留极轻柔的江风呼吸感微漂，杜绝完全静止
  if (i === 26) {
    const rawU = THREE.MathUtils.clamp((t - n1.t) / (n2.t - n1.t), 0, 1);
    _v1.y += Math.sin(rawU * Math.PI * 2) * 0.35;
    _v2.x += Math.sin(rawU * Math.PI) * 3.5;
  }

  camera.position.copy(_v1);
  camera.fov = fov;
  camera.updateProjectionMatrix();
  camera.lookAt(_v2);

  // 云开光斑（镜12-13：99s–120s 期间在楼身上自西向东缓缓扫过）
  const spotWindow = smoothstep(THREE.MathUtils.clamp((t - 97) / 4, 0, 1)) *
                     (1 - smoothstep(THREE.MathUtils.clamp((t - 118) / 4, 0, 1)));
  skyUniforms.uCloudOpen.value = spotWindow;
  sunSpot.intensity = spotWindow * 18.0;
  const spotProg = THREE.MathUtils.clamp((t - 99) / 21, 0, 1);
  sunSpotTarget.position.set(
    THREE.MathUtils.lerp(-18, 22, spotProg),
    THREE.MathUtils.lerp(16, 30, Math.sin(spotProg * Math.PI)),
    -14
  );
  sunSpotTarget.updateMatrixWorld();
}

// ==================== 11. 网页交互与播放状态管理 ====================
const state = {
  time: 0,
  playing: true,
  loopSingle: false,
  currentShotIdx: 0,
  menuOpen: true
};

// DOM 元素
const elShotId = document.getElementById('hud-shot-id');
const elClock = document.getElementById('hud-clock');
const elTitle = document.getElementById('hud-title');
const elShotTime = document.getElementById('hud-shot-time');
const elTotalTime = document.getElementById('hud-total-time');
const elFps = document.getElementById('hud-fps');
const elMiniFill = document.getElementById('hud-mini-fill');
const elDrawer = document.getElementById('shot-drawer');
const elShotList = document.getElementById('shot-list');
const elMenuToggle = document.getElementById('menu-toggle');
const elMenuToggleLabel = document.getElementById('menu-toggle-label');
const elBtnSeq = document.getElementById('btn-seq');
const elBtnPlay = document.getElementById('btn-play');
const elBtnPrev = document.getElementById('btn-prev');
const elBtnNext = document.getElementById('btn-next');
const elBtnLoop = document.getElementById('btn-loop');
const elScrubber = document.getElementById('scrubber');
const elLoading = document.getElementById('loading-mask');

function fmtTime(sec) {
  const s = Math.max(0, Math.floor(sec));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
}

function fmtStoryClock(tSec) {
  // 0s -> 15:30 (930min), 330s -> 21:00 (1260min)
  const mins = Math.floor(930 + (tSec / TOTAL_DURATION) * 330);
  const hh = Math.floor(mins / 60);
  const mm = mins % 60;
  let shichen = '申时';
  if (hh >= 17 && hh < 19) shichen = '酉时';
  else if (hh >= 19) shichen = '戌时';
  return `${shichen} · ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}

function findShotIndex(tSec) {
  for (let i = SHOTS.length - 1; i >= 0; i--) {
    if (tSec >= SHOTS[i].start - 1e-4) return i;
  }
  return 0;
}

// 渲染 27 镜分镜表
const shotButtons = [];
function buildShotMenu() {
  let lastAct = '';
  SHOTS.forEach((s, idx) => {
    if (s.act !== lastAct) {
      lastAct = s.act;
      const div = document.createElement('div');
      div.className = 'act-divider';
      div.textContent = s.act;
      elShotList.appendChild(div);
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'shot-item';
    btn.dataset.index = String(idx);
    btn.innerHTML = `
      <div class="shot-row1">
        <span class="shot-num">${String(s.id).padStart(2, '0')}</span>
        <span class="shot-name">${s.title}</span>
        <span class="shot-time">${fmtTime(s.start)}-${fmtTime(s.start + s.dur)} (${s.dur}s)</span>
      </div>
      <div class="shot-row2">
        <span>${s.scale} · ${s.move}</span>
        ${s.person ? '<span class="shot-tag">人物</span>' : ''}
      </div>
    `;
    btn.addEventListener('click', () => jumpToShot(idx, true));
    elShotList.appendChild(btn);
    shotButtons.push(btn);
  });
}
buildShotMenu();

function syncControlUI() {
  elBtnPlay.textContent = state.playing ? '暂停' : '继续';
  elBtnLoop.textContent = state.loopSingle ? '单镜循环: 开' : '单镜循环: 关';
  elBtnLoop.classList.toggle('active-toggle', state.loopSingle);
  elDrawer.classList.toggle('collapsed', !state.menuOpen);
  elMenuToggleLabel.textContent = state.menuOpen ? '收起分镜' : '展开分镜 (27)';
}

function highlightShot(idx) {
  state.currentShotIdx = idx;
  shotButtons.forEach((b, i) => b.classList.toggle('active', i === idx));
  const activeBtn = shotButtons[idx];
  if (activeBtn && state.menuOpen) {
    activeBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function jumpToShot(idx, autoPlay = true) {
  const clamped = THREE.MathUtils.clamp(idx, 0, SHOTS.length - 1);
  state.time = SHOTS[clamped].start;
  if (autoPlay) state.playing = true;
  highlightShot(clamped);
  syncControlUI();
  applySceneAtTime(state.time, 0);
}

// 按钮交互绑定
elMenuToggle.addEventListener('click', () => {
  state.menuOpen = !state.menuOpen;
  syncControlUI();
});

// 按顺序播放：关闭单镜循环，从第1镜 00:00 连续播放到全片结束
elBtnSeq.addEventListener('click', () => {
  state.loopSingle = false;
  state.time = 0;
  state.playing = true;
  highlightShot(0);
  syncControlUI();
  applySceneAtTime(state.time, 0);
});

elBtnPlay.addEventListener('click', () => {
  if (!state.playing && state.time >= TOTAL_DURATION - 0.05) {
    state.time = 0;
  }
  state.playing = !state.playing;
  syncControlUI();
});

elBtnPrev.addEventListener('click', () => {
  const cur = findShotIndex(state.time);
  const s = SHOTS[cur];
  // 若在镜内已过 1.5s，先回到本镜开头，否则切上一镜
  if (state.time - s.start > 1.5 && !state.loopSingle) {
    jumpToShot(cur, state.playing);
  } else {
    jumpToShot(Math.max(0, cur - 1), state.playing);
  }
});

elBtnNext.addEventListener('click', () => {
  const cur = findShotIndex(state.time);
  jumpToShot(Math.min(SHOTS.length - 1, cur + 1), state.playing);
});

elBtnLoop.addEventListener('click', () => {
  state.loopSingle = !state.loopSingle;
  syncControlUI();
});

let scrubbing = false;
elScrubber.addEventListener('input', () => {
  scrubbing = true;
  state.time = parseFloat(elScrubber.value);
  const idx = findShotIndex(state.time);
  if (idx !== state.currentShotIdx) highlightShot(idx);
  applySceneAtTime(state.time, 0);
});
elScrubber.addEventListener('change', () => { scrubbing = false; });

// 键盘操作（Space 播放/暂停，左右方向键切镜，L 单镜循环，M 展开/收起菜单）
window.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' && e.code !== 'Space')) return;
  if (e.code === 'Space') {
    e.preventDefault();
    elBtnPlay.click();
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    const cur = findShotIndex(state.time);
    jumpToShot(Math.max(0, cur - 1), state.playing);
  } else if (e.code === 'ArrowRight') {
    e.preventDefault();
    const cur = findShotIndex(state.time);
    jumpToShot(Math.min(SHOTS.length - 1, cur + 1), state.playing);
  } else if (e.key === 'l' || e.key === 'L') {
    elBtnLoop.click();
  } else if (e.key === 'm' || e.key === 'M') {
    elMenuToggle.click();
  }
});

// ==================== 12. 场景状态统一更新与渲染主循环 ====================
function applySceneAtTime(tSec, realElapsed) {
  sampleEnvironment(tSec);

  // 更新天空着色器
  skyUniforms.uZenith.value.copy(envState.zenith);
  skyUniforms.uMid.value.copy(envState.mid);
  skyUniforms.uHorizon.value.copy(envState.horizon);
  skyUniforms.uSunDir.value.copy(envState.sunDir);
  skyUniforms.uSunCol.value.copy(envState.sunCol);
  skyUniforms.uCloudCol.value.copy(envState.cloudCol);
  skyUniforms.uCloudGlow.value.copy(envState.cloudGlow);
  skyUniforms.uStars.value = envState.stars;
  skyUniforms.uTime.value = tSec * 0.6 + realElapsed * 0.15;

  // 更新平行光、环境光、距离雾、曝光
  sunLight.position.copy(envState.sunDir).multiplyScalar(180);
  sunLight.color.copy(envState.sunCol);
  sunLight.intensity = envState.sunInt;
  hemiLight.color.copy(envState.ambCol);
  hemiLight.intensity = envState.ambInt;
  fog.color.copy(envState.fogCol);
  fog.density = envState.fogDen;
  renderer.toneMappingExposure = envState.exp;

  // 更新灯笼、暖窗与建筑点光源（随暮色自然渐亮）
  matLanternGlow.emissiveIntensity = envState.lantern * 2.2;
  matWindowGlow.emissiveIntensity = envState.lantern * 1.45;
  for (let i = 0; i < pavilionLights.length; i++) {
    pavilionLights[i].intensity = envState.lantern * (i === 1 ? 38 : 24);
  }

  // 更新水面着色器参数
  waterUniforms.uTime.value = tSec * 0.85 + realElapsed * 0.4;
  waterUniforms.uSunDir.value.copy(envState.sunDir);
  waterUniforms.uSunCol.value.copy(envState.sunCol);
  waterUniforms.uWaterTint.value.copy(envState.waterTint);
  waterUniforms.uFogCol.value.copy(envState.fogCol);
  waterUniforms.uFogDen.value = envState.fogDen;

  // 更新渔舟缓缓航行与水波起伏
  for (const b of boats) {
    b.group.position.set(
      b.cfg.x + b.cfg.vx * tSec,
      0.08 + Math.sin(tSec * 1.2 + b.cfg.x) * 0.08,
      b.cfg.z + b.cfg.vz * tSec
    );
    b.group.rotation.z = Math.sin(tSec * 0.9 + b.cfg.z) * 0.03;
  }

  // 更新飞鸟、人物、相机
  updateBirds(tSec);
  updatePersonForTime(tSec);
  updateCameraAndFx(tSec);

  // 更新 HUD
  const idx = findShotIndex(tSec);
  if (idx !== state.currentShotIdx) highlightShot(idx);
  const s = SHOTS[idx];
  const inShot = THREE.MathUtils.clamp(tSec - s.start, 0, s.dur);
  elShotId.textContent = `镜 ${String(s.id).padStart(2, '0')} / ${SHOTS.length}`;
  elClock.textContent = fmtStoryClock(tSec);
  elTitle.textContent = s.title;
  elShotTime.textContent = `${fmtTime(inShot)} / ${fmtTime(s.dur)}`;
  elTotalTime.textContent = `${fmtTime(tSec)} / ${fmtTime(COMPUTED_TOTAL)}`;
  elMiniFill.style.width = `${(tSec / TOTAL_DURATION) * 100}%`;
  if (!scrubbing) elScrubber.value = tSec.toFixed(2);
}

// 窗口尺寸自适应
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// 暴露只读调试句柄，便于验证（不影响画面）
window.__TENGWANGGE__ = {
  shots: SHOTS,
  totalDuration: COMPUTED_TOTAL,
  getState: () => ({ ...state, cameraPos: camera.position.toArray(), fov: camera.fov }),
  jumpToTime: (t) => { state.time = THREE.MathUtils.clamp(t, 0, TOTAL_DURATION); applySceneAtTime(state.time, 0); },
  jumpToShot: (idx) => jumpToShot(idx, false)
};

// 初始化首帧并隐藏加载层
syncControlUI();
highlightShot(0);
applySceneAtTime(0, 0);
requestAnimationFrame(() => elLoading.classList.add('hidden'));

// 渲染循环（实时计算平面水面反射 + 统计 FPS）
let lastNow = performance.now();
let realElapsed = 0;
let fpsFrames = 0, fpsAcc = 0;

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastNow) * 0.001, 0.1);
  lastNow = now;
  realElapsed += dt;

  fpsFrames++;
  fpsAcc += dt;
  if (fpsAcc >= 0.5) {
    elFps.textContent = `${Math.round(fpsFrames / fpsAcc)} FPS`;
    fpsFrames = 0;
    fpsAcc = 0;
  }

  if (state.playing && !scrubbing) {
    state.time += dt;
    if (state.loopSingle) {
      const s = SHOTS[state.currentShotIdx];
      if (state.time >= s.start + s.dur) {
        state.time = s.start;
      }
    } else if (state.time >= TOTAL_DURATION) {
      state.time = TOTAL_DURATION;
      state.playing = false;
      syncControlUI();
    }
  }

  applySceneAtTime(state.time, realElapsed);
  updateWaterReflection();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

</script>
