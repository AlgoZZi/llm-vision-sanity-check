<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e16}

  .heading{position:fixed;left:4.2vw;top:6.1vh;pointer-events:none;text-shadow:0 2px 18px #030a12;transition:opacity 1.8s}
  .eyebrow{font:9px/1.5 system-ui,sans-serif;letter-spacing:.36em;color:#b9bca9;opacity:.65}
  h1{font-size:clamp(18px,2.1vw,31px);line-height:1.5;font-weight:400;letter-spacing:.28em;margin:9px 0 5px}
  .subtitle{font-size:10px;letter-spacing:.23em;color:#a2b1ae;opacity:.68}
  .signature{position:fixed;left:4.2vw;bottom:4.6vh;font:9px/1.8 system-ui,sans-serif;letter-spacing:.26em;color:#91a5a7;opacity:.6;pointer-events:none;transition:opacity 1s}
  .controls{position:fixed;right:3.8vw;bottom:3.9vh;display:flex;gap:7px;opacity:0;transition:opacity .7s}
  body.awake .controls,.controls:focus-within{opacity:1}
  button{width:34px;height:34px;display:grid;place-items:center;border:1px solid #aebba72b;border-radius:3px;background:#0b151d66;color:#bfcbc3;cursor:pointer;backdrop-filter:blur(8px)}
  button:hover,button:focus-visible{border-color:#d1c4918c;background:#233333a0;outline:none}button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4}
  body.clean .heading,body.clean .signature{opacity:0}body.clean{cursor:none}body.awake{cursor:default}
  .help{position:fixed;right:3.8vw;bottom:calc(3.9vh + 46px);font:10px system-ui,sans-serif;letter-spacing:.08em;color:#a0b2af;opacity:0;transition:opacity .7s;pointer-events:none}body.awake .help{opacity:.65}
  @media(prefers-reduced-motion:reduce){.heading,.controls,.signature{transition:none}}

<body class="awake">
<canvas id="world" width="960" height="540" aria-label="像素艺术动画：月光与细雨中的中世纪墓园，一位披着暗红披风的铠甲骑士单膝跪地，双手扶剑，向墓碑低头。远处有城堡、山谷与湖面，近处的蜡烛与落叶轻轻摇动。"></canvas>
<div class="vignette"></div>
<header class="heading"><div class="eyebrow">AN ENDLESS PIXEL REQUIEM</div><h1>最后的守夜</h1><div class="subtitle">T H E &nbsp; L A S T &nbsp; V I G I L</div></header>
<div class="signature">誓言长存，直至黎明。<br><span style="font-size:8px;letter-spacing:.18em;opacity:.58">FOR ALL THE DAWNS YOU WILL NOT SEE.</span></div>

<button id="text" type="button" title="显示 / 隐藏文字（H）" aria-label="显示或隐藏文字"><svg viewBox="0 0 16 16"><path d="M3 4V2h10v2M8 2v12M5 14h6"/></svg></button>
<button id="fullscreen" type="button" title="全屏（F）" aria-label="切换全屏"><svg viewBox="0 0 16 16"><path d="M2 6V2h4m4 0h4v4m0 4v4h-4m-4 0H2v-4"/></svg></button>
</div>
<script>
'use strict';
(() => {
  // Everything is painted locally. No images, fonts, libraries or network requests.
  const W=960,H=540,TAU=Math.PI*2,LOOP=48;
  const canvas=document.getElementById('world');
  const out=canvas.getContext('2d',{alpha:false});
  out.imageSmoothingEnabled=false;
  let g,seed=1;
  const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
  const rand=(a,b)=>a+rnd()*(b-a);
  const pick=a=>a[(rnd()*a.length)|0];
  const px=v=>Math.round(v);
  const mod=(v,n)=>(v%n+n)%n;
  function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(px(x),px(y),Math.ceil(w),Math.ceil(h))}
  function poly(points,c){g.fillStyle=c;g.beginPath();g.moveTo(px(points[0][0]),px(points[0][1]));for(let i=1;i<points.length;i++)g.lineTo(px(points[i][0]),px(points[i][1]));g.closePath();g.fill()}
  function line(x1,y1,x2,y2,c,width=1){g.strokeStyle=c;g.lineWidth=width;g.beginPath();g.moveTo(px(x1)+.5,px(y1)+.5);g.lineTo(px(x2)+.5,px(y2)+.5);g.stroke()}
  function ellipse(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(px(x),px(y),rx,ry,0,0,TAU);g.fill()}
  function glow(x,y,r,c,alpha=1){g.save();g.globalAlpha=alpha;const a=g.createRadialGradient(x,y,0,x,y,r);a.addColorStop(0,c);a.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=a;g.fillRect(x-r,y-r,r*2,r*2);g.restore()}
  function layer(draw, s=123){const c=document.createElement('canvas');c.width=W;c.height=H;g=c.getContext('2d');g.imageSmoothingEnabled=false;seed=s;draw();return c}
  function dither(x,y,w,h,c,density=.15,size=1){for(let i=0;i<w*h*density/(size*size);i++)rect(rand(x,x+w),rand(y,y+h),size,size,c)}
  const sky=layer(()=>{
    const gr=g.createLinearGradient(0,0,0,355);
    gr.addColorStop(0,'#101b30');gr.addColorStop(.35,'#263b4d');gr.addColorStop(.66,'#536565');gr.addColorStop(.86,'#93917b');gr.addColorStop(1,'#b6a582');
    g.fillStyle=gr;g.fillRect(0,0,W,H);
    glow(344,148,220,'rgba(208,193,136,.14)');
    // A restrained ordered dither avoids smooth vector-like sky gradients.
    const colors=['#b7c6bb','#627e89','#173344'];
    for(let y=0;y<350;y+=2)for(let x=0;x<W;x+=2){if(rnd()<.065){g.globalAlpha=.14;rect(x,y,1,1,pick(colors))}}g.globalAlpha=1;
    for(let i=0;i<74;i++){const x=rand(85,870),y=rand(18,186);rect(x,y,1,1,`rgba(204,216,207,${rand(.13,.55)})`)}
    // The moon is made of individual stepped scanlines, not a vector disc.
    const mx=351,my=111,r=25;
    glow(mx,my,95,'rgba(230,215,161,.13)');glow(mx,my,46,'rgba(233,213,150,.1)');
    for(let y=-r;y<=r;y++){const rw=Math.floor(Math.sqrt(r*r-y*y));rect(mx-rw,my+y,rw*2,1,y<-17?'#c9c5a5':'#ded3ac')}
    for(let i=0;i<135;i++){const x=rand(-23,23),y=rand(-23,23);if(x*x+y*y<530)rect(mx+x,my+y,rand(1,4),1,pick(['#babda2','#c8c6a5','#e6dbb5']))}
    rect(346,90,5,2,'#e6dcba');rect(331,109,3,5,'#c0bfa1');rect(359,122,6,2,'#babb9c');
  },441);

  const cloudForms=[];
  seed=981;
  for(let i=0;i<24;i++)cloudForms.push({x:rand(-200,1160),y:rand(24,255),w:rand(95,275),h:rand(5,20),speed:pick([1,2]),a:rand(.035,.15),phase:rand(0,TAU)});
  function clouds(t){
    for(const c of cloudForms){const dx=Math.sin(TAU*t/LOOP+c.phase)*22*c.speed;
      g.globalAlpha=c.a;for(let j=0;j<4;j++)rect(c.x+dx+j*11,c.y+j*3,c.w-j*24,c.h-j*2,j===0?'#c2c9b5':'#12293a');}
    g.globalAlpha=1;
    // A veil passing slowly in front of the moon.
    g.globalAlpha=.22;poly([[282,117],[320,113],[355,115],[391,110],[438,112],[473,120],[425,122],[382,119],[343,122],[311,120]],'#344956');g.globalAlpha=1;
  }

  function ridge(base,amp,step,c){const pts=[[0,H]];let y=base;for(let x=-20;x<=W+step;x+=step){y=base+rand(-amp,amp);pts.push([x,y])}pts.push([W,H]);poly(pts,c)}
  function pine(x,y,h,c){
    rect(x-1,y-h,2,h,c);
    for(let i=0;i<8;i++){const yy=y-h+i*h/9,w=h*(.08+i*.025);poly([[x,yy-h*.2],[x-w,yy+h*.11],[x+w,yy+h*.11]],c)}
  }
  function pointedWindow(x,y,w,h,c){poly([[x,y+h],[x,y+w*.65],[x+w*.25,y+w*.24],[x+w*.5,y],[x+w*.75,y+w*.24],[x+w,y+w*.65],[x+w,y+h]],c)}
  const distance=layer(()=>{
    ridge(264,33,44,'#697b7a');ridge(278,20,32,'#5d7474');
    // Weather-softened mountain faces.
    poly([[0,279],[113,215],[159,254],[186,247],[228,278]],'#5b7377');
    poly([[112,215],[126,252],[159,254]],'#70817c');
    poly([[566,275],[663,209],[744,266],[791,235],[877,279]],'#61797a');
    poly([[662,209],[650,249],[681,234],[702,256],[741,266]],'#738480');
    ridge(297,13,23,'#49686e');
    // A distant ruined cathedral on a narrow ridge.
    poly([[176,288],[184,268],[193,266],[193,238],[199,238],[199,232],[205,232],[205,214],[208,209],[212,214],[212,232],[218,232],[218,239],[222,239],[222,251],[232,251],[232,236],[237,236],[237,231],[241,231],[241,209],[244,209],[244,187],[247,174],[250,187],[250,210],[254,210],[254,233],[262,233],[262,240],[270,240],[270,259],[287,267],[290,286]],'#38565f');
    poly([[222,258],[231,249],[258,249],[268,258]],'#46626a');
    rect(232,258,32,30,'#3d5a62');
    pointedWindow(240,260,7,18,'#73857c');pointedWindow(202,240,5,17,'#76877d');pointedWindow(248,237,4,9,'#6a8079');
    rect(243,264,1,15,'#38565f');line(239,271,248,271,'#38565f');
    line(207,209,207,201,'#39575e');line(204,204,210,204,'#39575e');
    for(let i=0;i<26;i++){const x=rand(175,300),y=rand(275,290);rect(x,y,rand(3,9),rand(2,8),'#3b5b63')}
    poly([[142,292],[184,282],[246,289],[294,280],[353,304],[390,320],[116,320]],'#3d6067');
    // The river bends from the horizon into the valley.
    const water=g.createLinearGradient(0,304,0,368);water.addColorStop(0,'#89977f');water.addColorStop(.4,'#617f7e');water.addColorStop(1,'#385e69');g.fillStyle=water;g.fillRect(0,305,W,71);
    poly([[0,304],[122,297],[207,304],[296,304],[331,309],[315,313],[251,315],[202,321],[94,331],[0,338]],'#3a5f67');
    poly([[960,295],[817,289],[733,304],[632,304],[555,307],[510,312],[557,317],[655,320],[746,331],[960,344]],'#3e656b');
    for(let i=0;i<430;i++){const y=rand(307,371),x=rand(0,W);rect(x,y,rand(2,16),1,pick(['#739184','#54797a','#547679','#8a9c87']))}
    // Tiny causeway, crenellations and an arched bridge over the water.
    poly([[91,313],[121,308],[145,309],[166,305],[184,307],[184,316],[91,322]],'#345862');
    for(let x=93;x<181;x+=9)rect(x,309,4,4,'#345862');
    rect(162,310,3,20,'#365b63');rect(178,310,3,16,'#365b63');
    for(let x=0;x<325;x+=rand(4,10)){const yy=302+Math.sin(x*.03)*6;pine(x,yy,rand(5,16),'#365963')}
    for(let x=654;x<970;x+=rand(4,11))pine(x,310+Math.sin(x*.03)*4,rand(9,26),'#355b64');
    // Nearer wooded promontories, with cool haze between planes.
    poly([[0,330],[92,327],[161,339],[228,341],[263,352],[321,355],[357,370],[0,396]],'#294c58');
    poly([[960,320],[864,324],[823,334],[769,335],[718,352],[679,359],[650,375],[960,399]],'#254a55');
    for(let i=0;i<78;i++){const x=rand(0,250);pine(x,350+x*.055,rand(8,31),'#2c515d')}
    for(let i=0;i<67;i++){const x=rand(723,965);pine(x,350-(x-723)*.05,rand(12,36),'#294e59')}
    g.globalAlpha=.1;rect(0,317,W,5,'#b8c5ac');rect(0,335,W,3,'#a6bbad');g.globalAlpha=1;
  },7731);

  function smallGrave(x,y,s=1,light=false){g.save();g.translate(px(x),px(y));g.scale(s,s);
    const c=light?'#52656a':'#274550';poly([[-8,0],[-7,-22],[-5,-26],[5,-26],[8,-22],[9,0]],c);rect(-11,-1,23,4,c);line(-4,-21,4,-21,light?'#71817b':'#3e5a61');line(0,-20,0,-12,'#213f4b');line(-3,-17,3,-17,'#213f4b');g.restore()}
  const terrace=layer(()=>{
    // Grass-topped rock escarpment. Diagonal seams lead toward the kneeling figure.
    poly([[0,382],[68,378],[111,383],[186,371],[231,378],[277,372],[328,368],[357,373],[404,369],[454,375],[497,370],[550,375],[602,369],[652,376],[706,371],[758,380],[817,371],[873,378],[960,375],[960,540],[0,540]],'#1b323a');
    poly([[0,404],[130,395],[228,391],[347,388],[434,394],[541,389],[684,398],[804,390],[960,406],[960,483],[0,489]],'#293b3d');
    poly([[0,440],[140,435],[245,415],[374,405],[511,410],[616,419],[755,425],[960,457],[960,540],[0,540]],'#203238');
    // Stone retaining wall in the middle distance.
    for(let row=0;row<2;row++)for(let col=-1;col<27;col++){
      const x=col*42+(row%2)*21,y=365+row*12;
      poly([[x,y+3],[x+38,y],[x+40,y+10],[x+1,y+12]],pick(['#344b4d','#3b5051','#405455','#32494d']));
      line(x+2,y+3,x+36,y+1,'#53635c');line(x+38,y+2,x+38,y+8,'#243c42');
      if(rnd()<.5)rect(x+rand(4,30),y+rand(4,9),rand(3,8),1,'#5b675b');
    }
    // Small memorials receding toward the valley.
    smallGrave(104,371,.76);smallGrave(167,369,.52,true);smallGrave(249,368,.55,true);smallGrave(709,370,.6,true);smallGrave(754,377,.83);smallGrave(798,370,.55);
    rect(279,340,4,29,'#39555b');rect(271,347,20,4,'#39555b');rect(276,338,10,4,'#3f5b5d');
    rect(674,341,3,28,'#3a565b');rect(668,347,16,4,'#3a565b');
    // Dark loam and lichen. Clustered strokes, rather than uniform image noise.
    for(let i=0;i<7800;i++){
      const x=rand(0,W),y=rand(378,540),s=(y-370)/170;
      rect(x,y,rand(1,3+s*3),pick([1,1,2]),pick(['#2a403f','#344843','#172e36','#31413c','#3f4c40','#1b353b']));
    }
    // Cobblestones radiate away from the graveside.
    for(let row=0;row<7;row++){
      const y=399+row*16,scale=1+row*.16;
      for(let col=-4;col<8;col++){
        const x=457+(col-1)*41*scale+row*13+(row%2)*18;
        if(x<50||x>913||rnd()<.22)continue;
        const w=rand(24,37)*scale,h=rand(6,11)*scale;
        poly([[x-w/2,y],[x+w/2-4,y-2],[x+w/2+5,y+h-2],[x-w/2+2,y+h]],'#142c34');
        poly([[x-w/2+1,y-1],[x+w/2-4,y-3],[x+w/2+3,y+h-4],[x-w/2+3,y+h-2]],pick(['#3d4c48','#40504c','#344949','#43514a','#3a4c48']));
        line(x-w/2+2,y-1,x+w/2-5,y-3,'#5d6556');
        if(rnd()<.65)line(x-3,y,x+2,y+h-4,'#243e40');
        if(rnd()<.6)rect(x+rand(-7,8),y+rand(1,4),rand(2,7),1,'#637063');
      }
    }
    // Flattened slick rock surrounding the knight and tomb.
    ellipse(531,406,156,16,'#1c3238');ellipse(551,407,126,11,'#344747');
    for(let i=0;i<220;i++){const x=rand(377,696),y=rand(395,423);if(((x-534)/160)**2+((y-406)/16)**2<1)rect(x,y,rand(1,7),1,pick(['#50615b','#243c41','#3e5551']))}
    // Broken capstones.
    poly([[288,398],[311,388],[338,391],[343,399],[313,407]],'#4d5c56');poly([[288,398],[313,403],[343,395],[343,401],[313,410],[288,403]],'#263e40');
    line(293,396,313,390,'#75806a');line(315,392,327,398,'#2b4545');
    poly([[700,410],[716,402],[746,405],[751,415],[727,424],[703,420]],'#41534f');line(707,409,721,404,'#6d7762');
    // Puddles hold little slivers of the sky.
    for(const p of [[327,438,50,5],[468,461,70,6],[631,443,42,4],[790,467,68,6],[214,480,41,4],[570,492,99,7],[860,419,33,3]]){
      ellipse(p[0],p[1],p[2],p[3]+2,'#152f38');ellipse(p[0],p[1],p[2]-2,p[3],'#3d5656');
      for(let i=0;i<12;i++)rect(p[0]+rand(-p[2]+5,p[2]-5),p[1]+rand(-p[3]+1,p[3]-1),rand(2,13),1,pick(['#526b64','#60756a','#354e52']));
    }
    // Minute autumn leaves on the wet earth.
    for(let i=0;i<750;i++){
      const x=rand(0,W),y=rand(380,540),sz=rand(1,3);
      rect(x,y,sz,1,pick(['#9e7948','#725d39','#b08a4c','#695c3d','#4b5140','#927545']));
      if(sz>2)rect(x+1,y-1,1,1,'#b49555');
    }
  },3719);

  function branch(points,w,c){for(let i=0;i<points.length-1;i++)line(points[i][0],points[i][1],points[i+1][0],points[i+1][1],c,Math.max(1,w*(1-i/points.length)))}
  function leafCluster(x,y,r,palette,count=30){for(let i=0;i<count;i++){let a=rand(0,TAU),d=Math.sqrt(rnd())*r;const xx=x+Math.cos(a)*d,yy=y+Math.sin(a)*d*.42;rect(xx,yy,rand(2,8),rand(1,4),pick(palette))}}
  const trees=layer(()=>{
    // Slim, almost invisible cypresses behind the central action.
    for(const v of [[70,393,110],[135,385,86],[820,386,126],[763,377,61]]){
      pine(v[0],v[1],v[2],'#203f4a');
      for(let i=0;i<110;i++){const yy=rand(v[1]-v[2],v[1]),w=(yy-(v[1]-v[2]))*.11;rect(v[0]+rand(-w,w),yy,rand(1,4),1,'#2e4d54')}
    }
    // The ancient tree on the right is deliberately asymmetric.
    poly([[848,423],[864,377],[865,318],[859,272],[869,225],[870,178],[888,135],[889,91],[908,37],[928,-9],[963,-9],[943,49],[920,101],[916,146],[899,196],[900,239],[890,280],[900,326],[889,378],[906,424]],'#132b35');
    poly([[864,401],[877,350],[872,309],[877,262],[880,219],[890,183],[888,154],[902,122],[897,171],[891,219],[891,255],[884,281],[891,328],[881,375]],'#2b4143');
    poly([[884,309],[891,325],[883,378],[869,408],[878,365]],'#46504a');
    poly([[891,164],[877,125],[856,107],[827,94],[794,83],[776,69],[743,63],[719,43],[696,44],[713,57],[739,72],[767,78],[789,95],[823,107],[850,122],[873,144],[878,184]],'#152f39');
    poly([[873,242],[840,205],[816,188],[794,166],[757,152],[730,136],[701,135],[690,122],[676,119],[687,136],[724,147],[753,164],[788,175],[810,199],[834,215],[868,264]],'#172f38');
    branch([[858,113],[836,69],[806,43],[799,15],[777,-3]],8,'#17313b');
    branch([[828,98],[805,110],[768,111],[734,100],[718,104]],6,'#1a333b');
    branch([[792,83],[778,52],[761,43],[754,22]],5,'#1a333b');
    branch([[756,68],[721,76],[688,68],[659,73],[632,66]],5,'#1a333b');
    branch([[732,143],[712,167],[684,171],[664,187],[645,191]],5,'#1b353e');
    branch([[811,191],[811,162],[795,143],[798,126]],5,'#1a333b');
    branch([[898,195],[932,180],[959,143]],13,'#102a35');
    branch([[907,125],[937,115],[960,87]],10,'#112b35');
    branch([[911,83],[941,76],[967,53]],9,'#102a34');
    branch([[881,330],[849,354],[831,375],[804,381]],9,'#1b333a');
    // Bark fissures, lichen and moonward edges follow the trunk.
    for(let i=0;i<120;i++){const y=rand(75,397),x=890+Math.sin(y*.025)*9+rand(-5,10);line(x,y,x+rand(-3,2),y+rand(3,14),pick(['#344846','#0f2833','#536054','#243d3f']))}
    branch([[895,153],[881,130],[854,113],[827,103]],1,'#5a6050');

    poly([[534,267],[540,269],[552,278],[551,281],[539,274],[533,271]],'#0d2937');

    poly([[531,270],[539,276],[551,283],[551,286],[541,282],[532,275]],'#526f77');

  // The sword is painted on top, with both hands visibly resting over its grip.
  const sword=layer(()=>{

  const foreground=layer(()=>{
    // Hundreds of grouped grass blades have a direction and a light-facing side.
    for(let i=0;i<1120;i++){
      const x=rand(-10,970),y=rand(386,548);const edge=Math.abs(x-500)/500;

    function fern(x,y,len,ang,color){const ex=x+Math.cos(ang)*len,ey=y+Math.sin(ang)*len;line(x,y,ex,ey,color,1);for(let i=2;i<11;i++){const q=i/11,cx=x+(ex-x)*q,cy=y+(ey-y)*q,l=len*.20*(1-q)+2;line(cx,cy,cx-Math.sin(ang)*l-Math.cos(ang)*l*.5,cy+Math.cos(ang)*l-Math.sin(ang)*l*.5,color);line(cx,cy,cx+Math.sin(ang)*l-Math.cos(ang)*l*.5,cy-Math.cos(ang)*l-Math.sin(ang)*l*.5,color)}}
    for(let i=0;i<19;i++){fern(91+rand(-27,27),541,rand(34,89),rand(-2.7,-.35),pick(['#0b2630','#102e33','#1b3938','#29433b']))}
    for(let i=0;i<17;i++){fern(872+rand(-24,24),545,rand(40,96),rand(-2.6,-.6),pick(['#0a2530','#133137','#1d3939']))}
    for(let i=0;i<90;i++){const x=rand(0,W),y=rand(515,550);line(x,y,x+rand(-10,10),y-rand(10,30),'#102b31')}

    branch([[87,503],[119,477],[137,473]],3,'#152f34');
    leafCluster(41,489,35,['#3d4936','#5b5337','#79613c','#9b7745'],65);
    leafCluster(151,509,26,['#3b4533','#6b5736','#8b693e'],46);
    // A few unmistakable tiny mushrooms next to the root.
    for(const [x,y,s] of [[814,443,1],[824,446,.8],[801,447,.65],[187,418,.7]]){rect(x,y-6*s,2*s,7*s,'#b0aa83');rect(x-4*s,y-7*s,10*s,2*s,'#8e5e45');rect(x-2*s,y-9*s,6*s,2*s,'#b27a54');rect(x-1*s,y-8*s,1,1,'#d5bd8d')}
  },1743);

  const motes=[],rain=[],leaves=[],ripples=[];seed=12345;
  for(let i=0;i<40;i++)motes.push({x:rand(210,815),y:rand(210,437),a:rand(0,TAU),b:rand(0,TAU),k:pick([1,2,3]),bright:rand(.2,.8)});
  for(let i=0;i<570;i++)rain.push({x:rand(-100,1060),y:rand(0,540),depth:rand(.15,1),phase:rnd(),k:pick([18,22,26,30,34])});
  for(let i=0;i<35;i++)leaves.push({x:rand(0,W),phase:rnd(),y:rand(0,H),s:rand(.6,1.6),a:rand(0,TAU),k:pick([1,2,3]),c:pick(['#b39153','#a98046','#d1ab62','#7b7549','#9a6b41'])});
  for(let i=0;i<48;i++)ripples.push({x:rand(172,858),y:rand(421,514),phase:rnd(),r:rand(3,9),k:pick([24,32,40,48])});

  function cloak(t){
    // Ripple coefficients all have integer periods of the master 48-second loop.
    const a=Math.sin(t*TAU/6),b=Math.sin(t*TAU/8+1),c=Math.sin(t*TAU/12);
    const flutter=px(a*2+b*1.5),edge=px(c*3);
    poly([[586,289],[596,296],[606,318],[611,340],[625,363],[644+flutter,382],[649+flutter,394],[638+edge,400],[623,396],[609,398],[602,384],[594,361],[591,336],[586,318]],'#132e39');
    poly([[588,292],[595,298],[602,320],[607,344],[618,366],[638+flutter,385],[642+flutter,393],[630,391],[618,394],[609,388],[602,367],[597,343],[594,318]],'#4e353c');
    poly([[591,298],[597,315],[599,340],[609,366],[620+edge,389],[617,392],[609,383],[601,362],[596,342]],'#784847');
    poly([[595,308],[600,324],[604,347],[618,374],[631+flutter,389],[635+flutter,392],[626,389],[613,375],[603,354],[599,338]],'#8a514a');
    poly([[600,333],[606,350],[619,368],[637+flutter,383],[645+flutter,393],[636,390],[621,379],[611,363]],'#623d42');
    poly([[590,317],[592,340],[599,368],[609,393],[612,395],[603,389],[596,369],[591,347]],'#2f323c');
    line(596,318,601,341,'#9d6854');line(603,348,615,369,'#a06a53');
    line(612,381,618,392,'#b48b61');line(623,393,630,391,'#a8875e');line(636+flutter,394,642+flutter,394,'#ad885a');
    // Worn gold hem; tiny breaks keep it from looking freshly embroidered.
    line(609,392,614,395,'#8b7155');line(616,395,622,394,'#8b7155');line(626,395,632,394,'#927351');
    rect(639+flutter,395,2,3,'#4e3a3d');
  }
  function flames(t){
    const candles=[[354,382,1],[463,391,.84],[346,400,.75],[87,239,.72]];
    for(let i=0;i<candles.length;i++){
      const [x,y,s]=candles[i],f=Math.sin(t*TAU/1.5+i*2)+.5*Math.sin(t*TAU/1.2+i),dx=px(f*.7);
      glow(x,y-3,33*s,'rgba(229,154,57,.14)',.85+.10*f);glow(x,y-2,12*s,'rgba(255,171,65,.2)');
      poly([[x-2,y],[x-3,y-3],[x-1+dx,y-7-px(f)],[x+dx,y-10-px(f)],[x+2+dx,y-5],[x+2,y-1]],'#bf763b');
      poly([[x-1,y],[x-2,y-3],[x+dx,y-8],[x+1,y-4],[x+1,y]],'#f1bc65');rect(x,y-3,1,3,'#fff0b7');
      g.globalAlpha=.12+.02*f;ellipse(x,y+19,13*s,2,'#d8ac58');g.globalAlpha=1;
    }
    glow(382,375,61,'rgba(209,159,73,.055)');
  }
  function mist(t,front=false){
    const yy=front?427:343;
    g.save();g.globalAlpha=front?.075:.11;
    for(let i=0;i<(front?5:7);i++){
      const x=-190+i*210+Math.sin(TAU*t/LOOP+i*1.7)*65;
      const y=yy+Math.sin(TAU*t/24+i)*7+(i%3)*5;
      const gr=g.createRadialGradient(x+160,y,0,x+160,y,180);gr.addColorStop(0,'#c3d0bb');gr.addColorStop(1,'rgba(123,164,159,0)');
      g.fillStyle=gr;g.save();g.translate(0,y);g.scale(1,.065);g.fillRect(x,-180,360,360);g.restore();
    }g.restore();
  }
  // Broad translucent pixel ribbons are rendered separately from the soft haze.
  const fogRibbons=layer(()=>{
    for(let i=0;i<31;i++){
      const x=rand(-180,960),y=rand(325,365),w=rand(70,290);
      g.globalAlpha=rand(.015,.07);rect(x,y,w,1,pick(['#b6cab8','#a8c2b5','#d7d2b4']));
    }g.globalAlpha=1;
  },122);
  function waterAndRain(t,front){
    if(!front){
      for(let i=0;i<52;i++){
        const a=i*3.91,y=311+mod(i*7.13,48),x=351+Math.sin(a)*((y-307)*1.8+3);
        g.globalAlpha=.08+.08*Math.sin(t*TAU/6+a);rect(x+Math.sin(t*TAU/12+a)*3,y,2+(i%7),1,'#e0d0a1');
      }g.globalAlpha=1;
      return;
    }
    for(const p of ripples){
      const age=mod(t/LOOP*p.k+p.phase,1);g.globalAlpha=(1-age)*.22;const r=age*p.r;
      line(p.x-r,p.y,p.x-1,p.y,'#a8b6a5');line(p.x+1,p.y,p.x+r,p.y,'#a8b6a5');
      if(age>.35){rect(p.x-r*.65,p.y-1,Math.max(1,r*.5),1,'#718e89');rect(p.x+r*.3,p.y+1,Math.max(1,r*.5),1,'#718e89')}
    }g.globalAlpha=1;
  }
  function rainfall(t,near){
    for(const p of rain){if((p.depth>.73)!==near)continue;
      const f=mod(p.phase+t/LOOP*p.k,1),x=mod(p.x-f*100,1100)-65,y=f*620-50;
      const l=near?4+p.depth*6:2+p.depth*4;
      g.globalAlpha=near?.10+p.depth*.10:.045+p.depth*.07;
      line(x,y,x-2*p.depth,y+l,near?'#a4b8b1':'#b1c4b7');
      if(y>385&&y<515&&near&&f>.7&&p.phase<.14){rect(x-2,y+l,2,1,'#bfd1c3')}
    }g.globalAlpha=1;
  }
  function fallingLeaves(t,front){
    for(const p of leaves){if((p.s>1.1)!==front)continue;
      const f=mod(p.phase+t/LOOP*p.k,1),y=-20+f*590;
      const x=mod(p.x+f*165+Math.sin(f*TAU*3+p.a)*23,W+60)-30;
      const twist=Math.sin(f*TAU*8+p.a),w=Math.max(1,Math.abs(twist)*4*p.s);
      g.globalAlpha=front?.8:.46;
      rect(x,y,w,2*p.s,p.c);rect(x+(twist>0?1:-1),y-1,Math.max(1,w-1),1,p.c);
      if(front){rect(x,y,1,1,'#e0b871');line(x,y+1,x-2,y+3,'#6c6344')}
    }g.globalAlpha=1;
  }
  function fireflies(t){
    for(const p of motes){
      const a=TAU*t/LOOP*p.k+p.a,x=p.x+Math.sin(a)*12+Math.sin(a*2+p.b)*3,y=p.y+Math.cos(a+p.b)*7;
      const b=Math.pow(Math.max(0,Math.sin(a*2+p.b)),4)*p.bright;
      if(b<.04)continue;
      glow(x,y,7,'rgba(198,184,98,.14)',b);g.globalAlpha=b;rect(x,y,1,1,'#e2d08a');g.globalAlpha=1;
    }
  }
  function clothAtGrave(t){
    const q=px(Math.sin(t*TAU/8)*2);
    poly([[447,340],[449,348],[450+q,356],[454+q,366],[450+q,363],[447,354]],'#334c53');line(450+q,355,453+q,363,'#617174');
  }
  function rays(t){
    g.save();g.globalCompositeOperation='screen';
    const a=.017+.004*Math.sin(t*TAU/24);
    g.globalAlpha=a;
    poly([[335,129],[358,128],[650,447],[572,447]],'#c9cdb0');
    g.globalAlpha=a*.8;poly([[342,128],[351,128],[505,416],[476,413]],'#d7d5b3');
    g.globalAlpha=a*.5;poly([[365,132],[372,130],[778,452],[714,451]],'#c7d0b7');g.restore();
  }
  // Gentle shafts and a filmic darkening are prepainted to avoid per-frame filters.
  const finish=layer(()=>{
    const gr=g.createLinearGradient(0,425,0,540);gr.addColorStop(0,'rgba(6,18,29,0)');gr.addColorStop(1,'rgba(5,16,25,.47)');g.fillStyle=gr;g.fillRect(0,425,W,115);
    const top=g.createLinearGradient(0,0,0,96);top.addColorStop(0,'rgba(6,13,24,.2)');top.addColorStop(1,'rgba(6,13,24,0)');g.fillStyle=top;g.fillRect(0,0,W,96);
  });

  let running=!matchMedia('(prefers-reduced-motion: reduce)').matches;
  let elapsed=0,last=0,frame=0;
  function paint(t){
    g=out;g.globalAlpha=1;g.drawImage(sky,0,0);clouds(t);g.drawImage(distance,0,0);waterAndRain(t,false);
    mist(t,false);g.drawImage(fogRibbons,px(Math.sin(t*TAU/LOOP)*22),0);
    g.drawImage(terrace,0,0);g.drawImage(trees,0,0);g.drawImage(ruins,0,0);
    rainfall(t,false);fallingLeaves(t,false);
    // Long, very faint cast shadows unify all characters with the ground plane.
    g.globalAlpha=.17;poly([[414,394],[423,395],[491,463],[464,463]],'#071d29');poly([[552,399],[585,396],[693,452],[631,444]],'#071d29');g.globalAlpha=1;
    g.drawImage(memorial,0,0);clothAtGrave(t);cloak(t);g.drawImage(knight,0,0);g.drawImage(sword,0,0);g.drawImage(stillLife,0,0);
    flames(t);rays(t);waterAndRain(t,true);fireflies(t);mist(t,true);
    g.drawImage(foreground,0,0);fallingLeaves(t,true);rainfall(t,true);g.drawImage(finish,0,0);
  }
  function tick(ms){if(last&&running&&document.visibilityState==='visible')elapsed+=Math.min((ms-last)/1000,.06);last=ms;if(running||!frame)paint(mod(elapsed,LOOP));frame++;requestAnimationFrame(tick)}
  function updatePause(){document.getElementById('pauseIcon').setAttribute('d',running?'M5 3v10M11 3v10':'M5 3l8 5-8 5Z');document.getElementById('pause').setAttribute('aria-label',running?'暂停动画':'继续动画')}
  function togglePause(){running=!running;updatePause();wake()}
  async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){console.info('Fullscreen is unavailable in this browser context.')}wake()}
  let idle;
  function wake(){document.body.classList.add('awake');clearTimeout(idle);idle=setTimeout(()=>document.body.classList.remove('awake'),2800)}
  document.addEventListener('pointermove',wake,{passive:true});document.addEventListener('pointerdown',wake,{passive:true});
  document.getElementById('pause').addEventListener('click',togglePause);document.getElementById('fullscreen').addEventListener('click',fullscreen);
  document.getElementById('text').addEventListener('click',()=>{document.body.classList.toggle('clean');wake()});
  document.addEventListener('keydown',e=>{if(e.target instanceof HTMLButtonElement)return;if(e.code==='Space'){e.preventDefault();togglePause()}else if(e.code==='KeyF'){fullscreen()}else if(e.code==='KeyH'){document.body.classList.toggle('clean');wake()}});
  document.addEventListener('visibilitychange',()=>{last=0});
  // A deterministic hook for visual checks and exact seamless-loop verification.
  window.Vigil={render(t=0){paint(mod(t,LOOP))},get time(){return elapsed},get running(){return running},setPaused(v=true){running=!v;updatePause()},loopDuration:LOOP,width:W,height:H};
  updatePause();wake();requestAnimationFrame(tick);
})();
