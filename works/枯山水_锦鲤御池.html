  const btnRippleMode = document.getElementById('btnRippleMode');
  const btnRain = document.getElementById('btnRain');
  const btnAddKoi = document.getElementById('btnAddKoi');
  const btnBamboo = document.getElementById('btnBamboo');

  let hintTimer = setTimeout(() => hint.classList.add('fade'), 7500);
  function fadeHintNow() {
    clearTimeout(hintTimer);
    hint.classList.add('fade');
  }

  function resize() {
    state.width = window.innerWidth;
    state.height = window.innerHeight;
    state.dpr = Math.min(window.devicePixelRatio || 1, 2);

    glCanvas.width = Math.floor(state.width * state.dpr);
    glCanvas.height = Math.floor(state.height * state.dpr);
    overlayCanvas.width = Math.floor(state.width * state.dpr);
    overlayCanvas.height = Math.floor(state.height * state.dpr);
    octx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

    buildPondBed(state.width, state.height);
    initSurfaceElements(state.width, state.height);
  }

  function pushRippleAtPixel(px, py, radius = 0.028, strength = 0.42) {
    state.ripplesQueue.push({
      x: clamp(px / Math.max(1, state.width), 0, 1),
      y: clamp(1.0 - py / Math.max(1, state.height), 0, 1),
      radius,
      strength,
    });
    // 推动附近睡莲微晃
    for (const pad of lilyPads) {
      const dx = pad.x - px;
      const dy = pad.y - py;
      const d = Math.hypot(dx, dy) || 1;
      if (d < pad.r * 3.5) {
        const push = (1 - d / (pad.r * 3.5)) * 12 * strength;
        pad.vx += (dx / d) * push;
        pad.vy += (dy / d) * push;
      }
    }
  }

  function dropFood(px, py) {
    const pellets = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < pellets; i++) {
      const a = Math.random() * Math.PI * 2;
      const dist = Math.random() * 18;
      state.food.push({
        x: clamp(px + Math.cos(a) * dist, 16, state.width - 16),
        y: clamp(py + Math.sin(a) * dist, 16, state.height - 16),
        vx: Math.cos(a) * (10 + Math.random() * 14),
        vy: Math.sin(a) * (10 + Math.random() * 14),
        r: 2.8 + Math.random() * 1.4,
        age: 0,
        eaten: false,
      });
    }
    pushRippleAtPixel(px, py, 0.032, 0.45);
    spawnSplash(px, py, 6);
    audio.playPlop(1.0, 0.16);
  }

  function triggerScareWave(px, py) {
    pushRippleAtPixel(px, py, 0.055, 0.85);
    spawnSplash(px, py, 14);
    audio.playPlop(0.72, 0.24);
    for (const k of kois) k.scare(px, py, 1.15);
  }

  // 指针交互（兼容鼠标与触屏）
  let activePointers = new Set();
  stage.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    fadeHintNow();
    triggerScareWave(e.clientX, e.clientY);
  });

  stage.addEventListener('pointerdown', (e) => {
    if (e.button === 2) return;
    fadeHintNow();
    activePointers.add(e.pointerId);
    if (activePointers.size >= 2) {
      triggerScareWave(e.clientX, e.clientY);
      return;
    }
    state.pointer.down = true;
    state.pointer.lastX = e.clientX;
    state.pointer.lastY = e.clientY;

    if (state.mode === 'feed') {
      dropFood(e.clientX, e.clientY);
    } else {
      pushRippleAtPixel(e.clientX, e.clientY, 0.034, 0.52);
      spawnSplash(e.clientX, e.clientY, 6);
      audio.playPlop(1.15, 0.14);
    }
  });

  stage.addEventListener('pointermove', (e) => {
    const dx = e.clientX - state.pointer.lastX;
    const dy = e.clientY - state.pointer.lastY;
    const dist = Math.hypot(dx, dy);
    if (dist < 4) return;

    if (state.pointer.down) {
      pushRippleAtPixel(e.clientX, e.clientY, 0.022, clamp(dist * 0.012, 0.12, 0.46));
      if (dist > 28) {
        for (const k of kois) k.scare(e.clientX, e.clientY, 0.42);
      }
    } else if (dist > 10) {
      // 轻拂水面也能荡开极细微清波
      pushRippleAtPixel(e.clientX, e.clientY, 0.014, clamp(dist * 0.003, 0.03, 0.11));
    }
    state.pointer.lastX = e.clientX;
    state.pointer.lastY = e.clientY;
  });

  const endPointer = (e) => {
    activePointers.delete(e.pointerId);
    if (activePointers.size === 0) state.pointer.down = false;
  };
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  // 四时切换
  document.querySelectorAll('.hud [data-time]').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.hud [data-time]').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      state.targetTimeKey = btn.dataset.time;
    });
  });

  btnFeedMode.addEventListener('click', () => {
    state.mode = 'feed';
    btnFeedMode.classList.add('active');
    btnRippleMode.classList.remove('active');
  });

  btnRippleMode.addEventListener('click', () => {
    state.mode = 'ripple';
    btnRippleMode.classList.add('active');
    btnFeedMode.classList.remove('active');
  });

  btnRain.addEventListener('click', () => {
    state.rain = !state.rain;
    btnRain.classList.toggle('active', state.rain);
    audio.setRain(state.rain);
  });

  btnAddKoi.addEventListener('click', () => {
    const cx = state.width * (0.28 + Math.random() * 0.44);
    const cy = state.height * (0.28 + Math.random() * 0.44);
    spawnKoi(cx, cy);
    pushRippleAtPixel(cx, cy, 0.045, 0.62);
    spawnSplash(cx, cy, 12);
    audio.playPlop(0.88, 0.2);
  });

  btnBamboo.addEventListener('click', () => {
    if (!state.bamboo.pouring) {
      state.bamboo.pouring = true;
      state.bamboo.phase = 0;
    }
  });

  btnSound.addEventListener('click', () => {
    state.soundOn = !state.soundOn;
    audio.setEnabled(state.soundOn);
    audio.setRain(state.rain);
    btnSound.textContent = state.soundOn ? '🔊' : '🔇';
    btnSound.classList.toggle('active', state.soundOn);
  });

  function toggleZenView() {
    state.hudHidden = !state.hudHidden;
    hud.classList.toggle('hidden', state.hudHidden);
    brand.style.opacity = state.hudHidden ? '0' : '1';
    btnHide.classList.toggle('active', state.hudHidden);
  }
  btnHide.addEventListener('click', toggleZenView);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H') toggleZenView();
  });
  window.addEventListener('resize', resize);

  // 初始化并启动渲染主循环
  resize();
  initWaterEngine();
  for (let i = 0; i < CONFIG.initialKoi; i++) {
    spawnKoi();
  }
  // 初始轻点几圈静谧水波
  pushRippleAtPixel(state.width * 0.5, state.height * 0.5, 0.05, 0.4);

  let lastTs = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastTs) / 1000);
    lastTs = now;
    state.time += dt;

    updateEnvironment(dt);
    renderUnderwaterScene(dt);
    stepWaterSimulation(state.time);
    renderWaterFrame(state.time);
    renderOverlay(dt, state.time);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
