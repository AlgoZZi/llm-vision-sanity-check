<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初雪蓝调时刻 · 山间温泉旅馆与索道小站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1328; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==================== 渲染器、场景与相机 ====================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1833);
scene.fog = new THREE.FogExp2(0x182347, 0.0115);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.2, 260);
camera.position.set(22.5, 16.5, 24.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 2.2, 0.2);
controls.minDistance = 8.5;
controls.maxDistance = 58;
controls.maxPolarAngle = Math.PI * 0.56;
controls.minPolarAngle = 0.14;

// ==================== 三渲二材质与轮廓线系统 ====================
function createGradientMap(stops) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 1;
  const ctx = c.getContext('2d');
  for (let i = 0; i < stops.length; i++) {
    const start = Math.floor(stops[i][0] * 256);
    const end = i < stops.length - 1 ? Math.floor(stops[i + 1][0] * 256) : 256;
    ctx.fillStyle = stops[i][1];
    ctx.fillRect(start, 0, end - start, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  return tex;
}

const gradSoft = createGradientMap([[0, '#445282'], [0.32, '#7d92c4'], [0.66, '#cbdcf5'], [0.88, '#ffffff']]);
const gradWarm = createGradientMap([[0, '#423659'], [0.35, '#8f7288'], [0.7, '#d8c3ba'], [0.9, '#ffffff']]);
const gradSnow = createGradientMap([[0, '#5a6da8'], [0.28, '#8ba6db'], [0.62, '#d4e9fa'], [0.85, '#f4fbff']]);

const outlineMat = new THREE.MeshBasicMaterial({ color: 0x161b33, side: THREE.BackSide });
const outlineThinMat = new THREE.MeshBasicMaterial({ color: 0x1e2440, side: THREE.BackSide });

function addOutline(mesh, thickness = 0.028, thin = false) {
  const ol = new THREE.Mesh(mesh.geometry, thin ? outlineThinMat : outlineMat);
  ol.scale.setScalar(1 + thickness);
  ol.renderOrder = -1;
  mesh.add(ol);
  return mesh;
}

function toonMat(color, opts = {}) {
  const m = new THREE.MeshToonMaterial({
    color,
    gradientMap: opts.snow ? gradSnow : (opts.warm ? gradWarm : gradSoft),
    emissive: opts.emissive || 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 1.0,
    transparent: opts.transparent || false,
    opacity: opts.opacity ?? 1.0,
    side: opts.side ?? THREE.FrontSide,
    map: opts.map || null,
  });
  return m;
}

// 带次表面淡青透光与蓝紫阴影的积雪着色器材质
const snowShaderMat = new THREE.MeshToonMaterial({
  color: 0xe6f3ff,
  gradientMap: gradSnow,
});
snowShaderMat.onBeforeCompile = (shader) => {
  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <dithering_fragment>',
    `
    // 积雪次表面淡青透光（菲涅尔边缘）与蓝紫冷阴影润色
    vec3 vDir = normalize(vViewPosition);
    float rim = pow(1.0 - clamp(dot(normalize(vNormal), vDir), 0.0, 1.0), 2.4);
    gl_FragColor.rgb += vec3(0.14, 0.30, 0.42) * rim * 0.55;
    float lum = dot(gl_FragColor.rgb, vec3(0.299, 0.587, 0.114));
    vec3 coolShadowTint = vec3(0.30, 0.38, 0.72);
    gl_FragColor.rgb = mix(gl_FragColor.rgb * 0.75 + coolShadowTint * 0.25, gl_FragColor.rgb, smoothstep(0.18, 0.62, lum));
    #include <dithering_fragment>
    `
  );
};

// ==================== 共享基础材质库 ====================
const M = {
  snow: snowShaderMat,
  snowDeep: toonMat(0xbcd3f5, { snow: true }),
  rock: toonMat(0x4a5b7a),
  rockDark: toonMat(0x2b344d),
  rockVolcanic: toonMat(0x1f2436),
  woodDark: toonMat(0x4b352c, { warm: true }),
  woodMid: toonMat(0x75523d, { warm: true }),
  woodLight: toonMat(0xb68a63, { warm: true }),
  woodTimber: toonMat(0x5e4031, { warm: true }),
  vermilion: toonMat(0xc8372d, { warm: true }),
  vermilionDark: toonMat(0x8c2321, { warm: true }),
  roofTile: toonMat(0x36415c),
  shojiGlow: new THREE.MeshBasicMaterial({ color: 0xffcf7a }),
  shojiSoft: toonMat(0xffd58b, { emissive: 0xffa640, emissiveIntensity: 0.78 }),
  lanternRed: toonMat(0xe84836, { emissive: 0xff6229, emissiveIntensity: 0.92 }),
  lanternWarm: toonMat(0xffb85c, { emissive: 0xff942e, emissiveIntensity: 1.0 }),
  metalDark: toonMat(0x3a4359),
  metalSteel: toonMat(0x7888a6),
  straw: toonMat(0xc4a462, { warm: true }),
  bamboo: toonMat(0x6c8754, { warm: true }),
  pine: toonMat(0x28474c),
  pineDark: toonMat(0x1c343d),
  tatami: toonMat(0xb8b074, { warm: true }),
  ice: new THREE.MeshPhysicalMaterial({
    color: 0xaee6ff,
    emissive: 0x3b6ea5,
    emissiveIntensity: 0.22,
    roughness: 0.14,
    metalness: 0.05,
    transmission: 0.62,
    transparent: true,
    opacity: 0.82,
    ior: 1.31
  }),
  glassMist: new THREE.MeshPhysicalMaterial({
    color: 0xcbe8ff,
    roughness: 0.25,
    transparent: true,
    opacity: 0.42
  }),
  norenBlue: toonMat(0x1e3561),
  gold: toonMat(0xe2b14a, { warm: true }),
  redCloth: toonMat(0xd63638, { warm: true }),
  whiteCeramic: toonMat(0xf2efe9, { warm: true }),
  charcoalGlow: new THREE.MeshBasicMaterial({ color: 0xff5a1f }),
  crystalPink: toonMat(0xf4b6c9, { emissive: 0xd9739c, emissiveIntensity: 0.25 }),
};

// 通用网格构建器
function mkBox(w, h, d, mat, pos = [0, 0, 0], outline = 0.03) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (outline > 0) addOutline(m, outline, outline < 0.025);
  return m;
}
function mkCyl(rt, rb, h, seg, mat, pos = [0, 0, 0], outline = 0.03) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (outline > 0) addOutline(m, outline, outline < 0.025);
  return m;
}
function mkSphere(r, ws, hs, mat, pos = [0, 0, 0], outline = 0.028) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, ws, hs), mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  if (outline > 0) addOutline(m, outline, outline < 0.025);
  return m;
}

// ==================== 蓝调时刻灯光系统 ====================
const hemiLight = new THREE.HemisphereLight(0x5274c4, 0x262856, 0.95);
scene.add(hemiLight);

const moonDir = new THREE.DirectionalLight(0x9ab8ff, 1.35);
moonDir.position.set(-18, 28, -14);
moonDir.castShadow = true;
moonDir.shadow.mapSize.set(2048, 2048);
moonDir.shadow.camera.near = 2;
moonDir.shadow.camera.far = 65;
const sc = 16;
moonDir.shadow.camera.left = -sc;
moonDir.shadow.camera.right = sc;
moonDir.shadow.camera.top = sc;
moonDir.shadow.camera.bottom = -sc;
moonDir.shadow.bias = -0.0005;
scene.add(moonDir);

// 地平线残留暖粉夕照背光
const sunsetRim = new THREE.DirectionalLight(0xf28d8d, 0.45);
sunsetRim.position.set(22, 6, -24);
scene.add(sunsetRim);

// 收集需要呼吸式闪烁的暖光源
const flickerLights = [];
function addWarmLight(x, y, z, color = 0xffa042, intensity = 3.2, distance = 9, phase = Math.random() * 10) {
  const l = new THREE.PointLight(color, intensity, distance, 1.65);
  l.position.set(x, y, z);
  scene.add(l);
  flickerLights.push({ light: l, base: intensity, phase });
  return l;
}

// ==================== 蓝调时刻穹顶、星空、弯月、流星与远山 ====================
const skyGeo = new THREE.SphereGeometry(125, 40, 28);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    varying vec3 vWorldPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y, -0.25, 1.0);
      vec3 cZenith = vec3(0.055, 0.088, 0.22);
      vec3 cMid = vec3(0.14, 0.17, 0.38);
      vec3 cDusk = vec3(0.36, 0.24, 0.44);
      vec3 cHorizon = vec3(0.86, 0.50, 0.46);
      vec3 cBelow = vec3(0.05, 0.07, 0.16);
      vec3 col = mix(cDusk, cMid, smoothstep(0.04, 0.32, h));
      col = mix(col, cZenith, smoothstep(0.28, 0.78, h));
      // 地平线残留一线暖粉橘（偏向北方/后方天际）
      float sunSide = smoothstep(-0.3, 0.85, -dir.z * 0.75 + dir.x * 0.45);
      float horizonBand = exp(-pow((h - 0.025) * 11.0, 2.0));
      col = mix(col, cHorizon, horizonBand * (0.42 + 0.55 * sunSide));
      col = mix(cBelow, col, smoothstep(-0.18, 0.02, h));
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// 闪烁星空
const starCount = 420;
const starPos = new Float32Array(starCount * 3);
const starPhase = new Float32Array(starCount);
const starSize = new Float32Array(starCount);
for (let i = 0; i < starCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(0.15 + Math.random() * 0.85);
  const r = 108;
  starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPos[i * 3 + 1] = r * Math.cos(phi);
  starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  starPhase[i] = Math.random() * Math.PI * 2;
  starSize[i] = 1.6 + Math.random() * 2.8;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('aPhase', new THREE.BufferAttribute(starPhase, 1));
starGeo.setAttribute('aSize', new THREE.BufferAttribute(starSize, 1));
const starMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute float aPhase;
    attribute float aSize;
    varying float vTwinkle;
    uniform float uTime;
    void main() {
      vTwinkle = 0.45 + 0.55 * sin(uTime * 1.8 + aPhase);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (260.0 / -mv.z) * (0.8 + 0.3 * vTwinkle);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vTwinkle;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float alpha = smoothstep(0.5, 0.05, d) * vTwinkle;
      gl_FragColor = vec4(0.92, 0.96, 1.0, alpha);
    }
  `
});
scene.add(new THREE.Points(starGeo, starMat));

// 细弯月（山顶背后深靛蓝星空）
const moonGroup = new THREE.Group();
moonGroup.position.set(-28, 34, -68);
const moonCanvas = document.createElement('canvas');
moonCanvas.width = 128; moonCanvas.height = 128;
const mctx = moonCanvas.getContext('2d');
mctx.clearRect(0, 0, 128, 128);
mctx.fillStyle = '#fff5cf';
mctx.beginPath(); mctx.arc(64, 64, 42, 0, Math.PI * 2); mctx.fill();
mctx.globalCompositeOperation = 'destination-out';
mctx.beginPath(); mctx.arc(78, 56, 38, 0, Math.PI * 2); mctx.fill();
const moonSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: new THREE.CanvasTexture(moonCanvas), transparent: true, fog: false
}));
moonSprite.scale.set(9.5, 9.5, 1);
moonGroup.add(moonSprite);
scene.add(moonGroup);

// 流星对象
const meteorGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(-8, 3.2, 0)]);
const meteorMat = new THREE.LineBasicMaterial({ color: 0xeaf4ff, transparent: true, opacity: 0, fog: false });
const meteorLine = new THREE.Line(meteorGeo, meteorMat);
scene.add(meteorLine);
const meteorState = { active: false, t: 0, dur: 1.1, next: 4.5, start: new THREE.Vector3(), dir: new THREE.Vector3() };

// 空气透视远山与缓慢流动的山谷夜雾
const farMountainGroup = new THREE.Group();
const mountainRings = [
  { r: 52, count: 14, hMin: 11, hMax: 21, col: 0x1d294d, yOff: -9 },
  { r: 78, count: 16, hMin: 18, hMax: 32, col: 0x263460, yOff: -12 },
  { r: 102, count: 18, hMin: 24, hMax: 42, col: 0x33406e, yOff: -14 },
];
mountainRings.forEach((ring, ri) => {
  const mat = new THREE.MeshBasicMaterial({ color: ring.col, fog: true });
  for (let i = 0; i < ring.count; i++) {
    const a = (i / ring.count) * Math.PI * 2 + ri * 0.4;
    const h = ring.hMin + ((i * 37 + ri * 19) % 10) / 10 * (ring.hMax - ring.hMin);
    const rad = 14 + ((i * 23) % 9);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(rad, h, 5), mat);
    cone.position.set(Math.cos(a) * ring.r, ring.yOff + h * 0.45, Math.sin(a) * ring.r);
    cone.rotation.y = a;
    farMountainGroup.add(cone);
  }
});
scene.add(farMountainGroup);

// 远谷夜雾层
const valleyMists = [];
const mistCanvas = document.createElement('canvas');
mistCanvas.width = 128; mistCanvas.height = 128;
const mistCtx = mistCanvas.getContext('2d');
const mg = mistCtx.createRadialGradient(64, 64, 6, 64, 64, 64);
mg.addColorStop(0, 'rgba(130, 165, 225, 0.24)');
mg.addColorStop(0.55, 'rgba(95, 130, 195, 0.10)');
mg.addColorStop(1, 'rgba(60, 85, 150, 0.0)');
mistCtx.fillStyle = mg; mistCtx.fillRect(0, 0, 128, 128);
const mistTex = new THREE.CanvasTexture(mistCanvas);
for (let i = 0; i < 16; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: mistTex, transparent: true, depthWrite: false, opacity: 0.42, fog: false
  }));
  const a = (i / 16) * Math.PI * 2;
  const dist = 28 + (i % 3) * 10;
  sp.position.set(Math.cos(a) * dist, -2.5 + (i % 4) * 1.4, Math.sin(a) * dist);
  sp.scale.set(24 + (i % 3) * 6, 7.5, 1);
  scene.add(sp);
  valleyMists.push({ sprite: sp, angle: a, dist, speed: 0.012 + (i % 3) * 0.005, baseY: sp.position.y });
}

// ==================== 展柜主根组 ====================
const diorama = new THREE.Group();
scene.add(diorama);

// ==================== 模块1：正方形底座与精密地质/建筑剖面 ====================
const BASE_SIZE = 16; // X: -8..8, Z: -8..8
const BASE_BOT = -3.4;

// 展柜微缩底座黑胡桃木框边（底部装饰镶边，突出玻璃展柜精致摆件感）
const plinthFrame = mkBox(BASE_SIZE + 0.48, 0.42, BASE_SIZE + 0.48, M.rockVolcanic, [0, BASE_BOT - 0.21, 0], 0.015);
diorama.add(plinthFrame);
const brassTrim = mkBox(BASE_SIZE + 0.36, 0.08, BASE_SIZE + 0.36, M.gold, [0, BASE_BOT + 0.02, 0], 0);
diorama.add(brassTrim);

// 共享动态集合
const animKoi = [];
const animBubbles = [];
const animSteam = [];
const animSway = [];
const animSparks = [];
const animSnowFlakes = [];
const animEaveSnow = [];

// ----- 1.1 左半侧山体剖面（索道站与山坡高地：X -8..0.6） -----
// 底层灰蓝色安山岩基座（左半）
const andesiteCore = mkBox(8.6, 5.4, BASE_SIZE, M.rock, [-3.7, -0.7, 0], 0.008);
diorama.add(andesiteCore);
// 左后高台山坡（杉树林与小祠区域：X -8..-0.2, Z -8..-1.5）
const upperHill = mkBox(8.2, 3.0, 6.8, M.rock, [-3.9, 3.3, -4.6], 0.01);
diorama.add(upperHill);
// 山顶小祠缓坡台阶
const peakSnow = mkBox(8.3, 0.72, 6.9, M.snow, [-3.9, 5.05, -4.6], 0.012);
diorama.add(peakSnow);

// 索道站平台雪面（左前：X -8..0.5, Z -1.6..8）
const stationDeckSnow = mkBox(8.6, 0.55, 9.6, M.snow, [-3.7, 2.22, 3.2], 0.012);
diorama.add(stationDeckSnow);
// 斜坡过渡雪坡（连接山顶与站台）
const midSlope = mkBox(8.1, 1.35, 2.8, M.snow, [-3.9, 3.35, -1.2], 0.012);
midSlope.rotation.x = 0.42;
diorama.add(midSlope);

// 索道侧剖面细节（X = -8 左侧壁与 Z = 8 左前壁）
// 岩层条纹（层理安山岩）
for (let i = 0; i < 4; i++) {
  const band = mkBox(0.16, 0.55 + (i % 2) * 0.2, BASE_SIZE - 0.12, i % 2 === 0 ? M.rockDark : toonMat(0x5b6f94), [-8.02, -2.5 + i * 1.15, 0], 0);
  diorama.add(band);
}
// 层层压实的积雪剖面（左壁与前左壁顶部白色/淡青蓝压实雪层）
const snowCutL1 = mkBox(0.22, 0.34, 9.5, M.snow, [-8.04, 2.34, 3.2], 0);
const snowCutL2 = mkBox(0.20, 0.24, 9.5, M.snowDeep, [-8.03, 2.04, 3.2], 0);
const snowCutL3 = mkBox(0.22, 0.52, 6.8, M.snow, [-8.04, 5.18, -4.6], 0);
const snowCutL4 = mkBox(0.20, 0.30, 6.8, M.snowDeep, [-8.03, 4.78, -4.6], 0);
diorama.add(snowCutL1, snowCutL2, snowCutL3, snowCutL4);

// 冻结的冰晶裂隙（在 X=-8 左侧切面上发光冰脉）
const iceCrackPoints = [
  [-8.06, 1.2, 4.6, 0.45, 0.14, 1.9, 0.25],
  [-8.06, 0.5, 3.2, 0.32, 0.12, 1.5, -0.35],
  [-8.06, -0.3, 1.8, 0.38, 0.14, 2.1, 0.18],
  [-8.06, 2.8, -3.5, 0.42, 0.15, 2.4, -0.28],
  [-8.06, 1.4, -5.2, 0.35, 0.13, 1.7, 0.42],
];
iceCrackPoints.forEach(([x, y, z, h, w, d, rotX]) => {
  const crack = mkBox(w, h, d, M.ice, [x, y, z], 0);
  crack.rotation.x = rotX;
  diorama.add(crack);
});

// 悬垂着冰锥的岩缝（左前切面 X=-8, Z=1.2..3.6）
const rockFissure = mkBox(0.32, 0.72, 2.6, M.rockVolcanic, [-8.01, 0.85, 2.4], 0);
diorama.add(rockFissure);
for (let i = 0; i < 9; i++) {
  const icH = 0.28 + (i % 3) * 0.16;
  const ic = new THREE.Mesh(new THREE.ConeGeometry(0.055, icH, 5), M.ice);
  ic.rotation.x = Math.PI;
  ic.position.set(-8.08, 1.15 - icH * 0.5, 1.3 + i * 0.27);
  diorama.add(ic);
}

// 半埋的松树根系（沿左侧山坡剖面裸露的树根）
for (let i = 0; i < 6; i++) {
  const root = mkCyl(0.08, 0.03, 1.4 + (i % 3) * 0.45, 6, M.woodDark, [-8.06, 3.9 - i * 0.22, -2.5 - i * 0.85], 0.02);
  root.rotation.x = 0.45 + (i % 2) * 0.35;
  root.rotation.z = 0.12;

function createSignTex(text, vertical = true, bg = '#f5f5f2', fg = '#1a1f2e', border = '#24304a') {
  const c = document.createElement('canvas');
  c.width = vertical ? 128 : 256;
  c.height = vertical ? 320 : 128;
  const ctx = c.getContext('2d');

// ----- 4.1 露天汤池水面（色块化 posterized 平涂倒影：暖金、群青、绯红碎块随波变形碎裂重组） -----
const waterUniforms = { uTime: { value: 0 } };
const waterMat = new THREE.ShaderMaterial({
  transparent: true,
  uniforms: waterUniforms,
  vertexShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vWorldPos;
    void main() {
      vUv = uv;
      vec3 p = position;
      float w1 = sin(p.x * 2.8 + uTime * 1.6) * 0.022;
      float w2 = cos(p.y * 3.4 - uTime * 1.25) * 0.018;
      p.z += w1 + w2;
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vWorldPos;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                 mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
    }
    void main() {
      vec2 uv = vUv;
      // 波形扭曲制造色块碎裂与重组感
      float n1 = noise(uv * 6.5 + vec2(uTime * 0.35, -uTime * 0.28));
      float n2 = noise(uv * 11.5 + vec2(-uTime * 0.42, uTime * 0.30));
      vec2 distUv = uv + (vec2(n1, n2) - 0.5) * 0.14;
      // 基底乳青温泉水色与群青夜空色块
      vec3 cMilky = vec3(0.45, 0.78, 0.84);
      vec3 cUltra = vec3(0.14, 0.24, 0.58);
      vec3 cGold  = vec3(1.00, 0.78, 0.36);
      vec3 cCrim  = vec3(0.92, 0.28, 0.26);
      vec3 cFoam  = vec3(0.86, 0.97, 1.00);

      // 色块化平涂（锐利阶跃边缘）
      float skyMask = step(0.46, n1 * 0.65 + distUv.y * 0.45);
      vec3 col = mix(cMilky, cUltra, skyMask * 0.72);

      // 来自北侧旅馆窗口的暖金碎块倒影
      float goldBand = exp(-pow((distUv.y - 0.22) * 3.8, 2.0)) * (0.45 + 0.75 * n2);
      float goldPatch = step(0.50, goldBand + sin(distUv.x * 16.0 + uTime * 1.4) * 0.12);
      col = mix(col, cGold, goldPatch * 0.92);

      // 来自灯笼与朱红廊柱的绯红碎块倒影
      float redSpot1 = smoothstep(0.32, 0.05, length(distUv - vec2(0.28, 0.32))) + n1 * 0.35;
      float redSpot2 = smoothstep(0.30, 0.05, length(distUv - vec2(0.74, 0.36))) + n2 * 0.35;
      float crimPatch = step(0.74, max(redSpot1, redSpot2));
      col = mix(col, cCrim, crimPatch * 0.88);

      // 细碎白色涟漪高光色块
      float ripple = step(0.84, noise(uv * 16.0 + vec2(uTime * 0.5, uTime * 0.35)));
      col = mix(col, cFoam, ripple * 0.65);

      gl_FragColor = vec4(col, 0.80);
    }
  `
});

const wetStoneMat = new THREE.ShaderMaterial({

  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    varying vec2 vUv;
    void main() {
      vec3 base = vec3(0.22, 0.28, 0.46);

      float gMask = step(0.45, sin(vUv.x * 6.0) * cos(vUv.y * 5.0) + 0.55);
      float rMask = step(0.76, sin(vUv.x * 11.0 + 1.2) * 0.5 + 0.5);
      vec3 col = mix(base, gold, gMask * 0.55);

diorama.add(eavePoints);
const eaveGust = { active: false, t: 0, dur: 2.2, next: 5.5, particles: [] };
for (let i = 0; i < EAVE_PARTICLES; i++) {
  eaveGust.particles.push({ sx: 0, sy: 0, sz: 0, vx: 0, vy: 0, vz: 0 });
}

// 4) 地炉炭火偶尔迸出的一点火星
for (let i = 0; i < 6; i++) {
  const sp = new THREE.Mesh(
    new THREE.BoxGeometry(0.032, 0.032, 0.032),
    new THREE.MeshBasicMaterial({ color: 0xffb347 })
  );
  sp.visible = false;
  diorama.add(sp);
  animSparks.push({ mesh: sp, life: 0, maxLife: 0.7, vx: 0, vy: 0, vz: 0, wait: Math.random() * 4 });
}

// ==================== 主动画循环 ====================
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // 星空与水波/倒影着色器时间
  starMat.uniforms.uTime.value = elapsed;
  waterUniforms.uTime.value = elapsed;

  // 1) 池底气泡缓缓升起
  for (const b of animBubbles) {
    b.mesh.position.y += b.speed * dt;
    b.mesh.position.x = b.baseX + Math.sin(elapsed * 2.4 + b.phase) * 0.05;
    b.mesh.position.z = b.baseZ + Math.cos(elapsed * 2.1 + b.phase) * 0.05;
    if (b.mesh.position.y > -0.02) b.mesh.position.y = -1.75;
  }

  // 2) 池底红白锦鲤缓缓游动与摆尾
  for (const k of animKoi) {
    const a = elapsed * k.speed + k.phase;
    const nx = k.cx + Math.cos(a) * k.radius;
    const nz = k.cz + Math.sin(a) * (k.radius * 0.82);
    const dx = -Math.sin(a) * k.speed * k.radius;
    const dz = Math.cos(a) * k.speed * (k.radius * 0.82);
    k.group.position.set(nx, k.depthY + Math.sin(elapsed * 1.4 + k.phase) * 0.05, nz);
    k.group.rotation.y = Math.atan2(dx, dz);
    k.tail.rotation.y = Math.sin(elapsed * 7.5 + k.phase) * 0.36;
  }

  // 3) 汤池浮盘与小木桶随水波轻晃
  floatTrayGroup.position.y = 0.045 + Math.sin(elapsed * 1.8) * 0.018;
  floatTrayGroup.rotation.z = Math.sin(elapsed * 1.35) * 0.05;
  floatTrayGroup.rotation.x = Math.cos(elapsed * 1.1) * 0.04;
  woodBucket.position.y = 0.055 + Math.cos(elapsed * 1.65 + 1.1) * 0.02;
  woodBucket.rotation.z = Math.cos(elapsed * 1.4) * 0.06;

  // 4) 蒸汽缓缓升腾、飘散、旋转
  for (const st of animSteam) {
    st.life += dt * st.speed;
    if (st.life >= 1) {
      st.life = 0;
      st.ox = (Math.random() - 0.5) * st.spread;
      st.oz = (Math.random() - 0.5) * st.spread;
    }
    const p = st.life;
    st.sprite.position.set(
      st.origin.x + st.ox + p * st.driftX + Math.sin(elapsed * 0.9 + st.ox * 3) * 0.14,
      st.origin.y + p * st.maxH,
      st.origin.z + st.oz + Math.cos(elapsed * 0.8 + st.oz * 3) * 0.10
    );
    const sc = st.minScale + (st.maxScale - st.minScale) * p;
    st.sprite.scale.set(sc, sc, 1);
    st.sprite.material.rotation += st.rotSpeed * dt;
    st.sprite.material.opacity = Math.sin(p * Math.PI) * 0.44;
  }

  // 5) 细小雪花缓缓飘落，落到汤池水面区域(X: 2.6..7.8, Z: 2.6..7.8, Y<=0.18)瞬间融化重置
  const spArr = snowGeo.attributes.position.array;
  for (let i = 0; i < SNOW_COUNT; i++) {
    const v = snowVel[i];
    spArr[i * 3] += (v.vx + Math.sin(elapsed * 0.85 + v.phase) * 0.16) * dt;
    spArr[i * 3 + 1] -= v.vy * dt;
    spArr[i * 3 + 2] += (v.vz + Math.cos(elapsed * 0.75 + v.phase) * 0.12) * dt;
    const x = spArr[i * 3], y = spArr[i * 3 + 1], z = spArr[i * 3 + 2];
    const inPool = x > 2.55 && x < 7.9 && z > 2.55 && z < 7.9 && y <= 0.22;
    if (inPool || y < -3.6) resetSnowFlake(i, false);
  }
  snowGeo.attributes.position.needsUpdate = true;

  // 6) 偶发阵风把雪粉从屋檐吹落
  if (!eaveGust.active) {
    eaveGust.next -= dt;
    if (eaveGust.next <= 0) {
      eaveGust.active = true;
      eaveGust.t = 0;
      const fromInn = Math.random() > 0.45;
      for (let i = 0; i < EAVE_PARTICLES; i++) {
        const p = eaveGust.particles[i];
        p.sx = fromInn ? (1.2 + Math.random() * 5.8) : (-6.4 + Math.random() * 3.8);
        p.sy = fromInn ? 6.0 : 5.1;
        p.sz = fromInn ? (-0.7 + (Math.random() - 0.5) * 0.3) : (3.85 + (Math.random() - 0.5) * 0.25);
        p.vx = 0.65 + Math.random() * 0.85;
        p.vy = -0.35 - Math.random() * 0.45;
        p.vz = 0.35 + Math.random() * 0.65;
      }
    }
  } else {
    eaveGust.t += dt;
    const u = eaveGust.t / eaveGust.dur;
    const arr = eaveGeo.attributes.position.array;
    for (let i = 0; i < EAVE_PARTICLES; i++) {
      const p = eaveGust.particles[i];
      arr[i * 3] = p.sx + p.vx * eaveGust.t;
      arr[i * 3 + 1] = p.sy + p.vy * eaveGust.t - 0.42 * eaveGust.t * eaveGust.t;
      arr[i * 3 + 2] = p.sz + p.vz * eaveGust.t;
    }
    eaveGeo.attributes.position.needsUpdate = true;
    eavePoints.material.opacity = Math.sin(Math.min(u, 1) * Math.PI) * 0.85;
    if (u >= 1) {
      eaveGust.active = false;
      eavePoints.material.opacity = 0;
      eaveGust.next = 6.5 + Math.random() * 7.5;
    }
  }

  // 7) 红灯笼、暖帘、干柿子串与围巾随微风轻摆
  const windPulse = 0.72 + 0.28 * Math.sin(elapsed * 0.55);
  for (const s of animSway) {
    s.obj.rotation.x = Math.sin(elapsed * s.speed + s.phase) * s.ampX * windPulse;
    s.obj.rotation.z = Math.cos(elapsed * s.speed * 0.85 + s.phase) * s.ampZ * windPulse;
  }

  // 8) 两只索道方形缆车沿钢缆缓慢往返 + 轻晃
  const pA = 0.5 - 0.44 * Math.cos(elapsed * 0.14);
  const pB = 1.0 - pA;
  gondolaA.root.position.lerpVectors(cableAStart, cableAEnd, pA);
  gondolaB.root.position.lerpVectors(cableBStart, cableBEnd, pB);
  gondolaA.swing.rotation.z = Math.sin(elapsed * 1.4) * 0.045;
  gondolaA.swing.rotation.x = Math.cos(elapsed * 1.1) * 0.035;
  gondolaB.swing.rotation.z = Math.sin(elapsed * 1.4 + 2.0) * 0.045;
  gondolaB.swing.rotation.x = Math.cos(elapsed * 1.1 + 2.0) * 0.035;

  // 9) 窗口与灯笼暖光极轻微呼吸式闪烁
  for (const fl of flickerLights) {
    const wave = Math.sin(elapsed * 3.2 + fl.phase) * 0.055 + Math.sin(elapsed * 7.8 + fl.phase * 1.7) * 0.025;
    fl.light.intensity = fl.base * (1 + wave);
  }

  // 10) 地炉炭火偶尔迸出火星
  for (const sp of animSparks) {
    if (sp.wait > 0) {
      sp.wait -= dt;
      if (sp.wait <= 0) {
        sp.life = 0;
        sp.mesh.visible = true;
        sp.mesh.position.set(3.6 + (Math.random() - 0.5) * 0.28, 1.05, -3.2 + (Math.random() - 0.5) * 0.28);
        sp.vx = (Math.random() - 0.5) * 0.35;
        sp.vy = 0.65 + Math.random() * 0.45;
        sp.vz = (Math.random() - 0.5) * 0.35;
      }
    } else {
      sp.life += dt;
      sp.mesh.position.x += sp.vx * dt;
      sp.mesh.position.y += sp.vy * dt;
      sp.mesh.position.z += sp.vz * dt;
      sp.vy -= 0.45 * dt;
      const s = Math.max(0.01, 1 - sp.life / sp.maxLife);
      sp.mesh.scale.setScalar(s);
      if (sp.life >= sp.maxLife) {
        sp.mesh.visible = false;
        sp.wait = 1.8 + Math.random() * 4.5;
      }
    }
  }

  // 11) 地炉旁三花猫偶尔抖耳朵与甩尾巴
  const earWindow = elapsed % 5.4;
  catEarL.rotation.z = earWindow < 0.28 ? Math.sin(earWindow * 36) * 0.32 : 0;
  catEarR.rotation.z = earWindow > 0.12 && earWindow < 0.40 ? Math.sin(earWindow * 32) * 0.28 : 0;
  const tailWindow = (elapsed + 2.3) % 6.8;
  catTailPivot.rotation.y = tailWindow < 1.1 ? Math.sin(tailWindow * 6.5) * 0.42 : Math.sin(elapsed * 0.8) * 0.06;

  // 12) 天际偶尔划过一颗流星
  if (!meteorState.active) {
    meteorState.next -= dt;
    if (meteorState.next <= 0) {
      meteorState.active = true;
      meteorState.t = 0;
      meteorState.start.set(-35 + Math.random() * 55, 36 + Math.random() * 18, -82);
      meteorState.dir.set(34, -14, 4);
    }
  } else {
    meteorState.t += dt;
    const u = meteorState.t / meteorState.dur;
    meteorLine.position.copy(meteorState.start).addScaledVector(meteorState.dir, u);
    meteorMat.opacity = Math.sin(Math.min(u, 1) * Math.PI) * 0.92;
    if (u >= 1) {
      meteorState.active = false;
      meteorMat.opacity = 0;
      meteorState.next = 9.0 + Math.random() * 11.0;
    }
  }

  // 13) 远谷夜雾缓慢流动
  for (const vm of valleyMists) {
    vm.angle += vm.speed * dt;
    vm.sprite.position.set(
      Math.cos(vm.angle) * vm.dist,
      vm.baseY + Math.sin(elapsed * 0.4 + vm.angle) * 0.45,
      Math.sin(vm.angle) * vm.dist
    );
  }

  // 14) 极偶发事件：远景山腰林间小狐狸剪影小跑而过，留下一行小脚印后消失
  if (!foxState.active) {
    foxState.nextTrigger -= dt;
    if (foxState.nextTrigger <= 0) {
      foxState.active = true;
      foxState.t = 0;
      foxState.printTimer = 0;
      foxGroup.visible = true;
    }
  } else {
    foxState.t += dt;
    const u = foxState.t / foxState.dur;
    const pos = new THREE.Vector3().lerpVectors(foxState.start, foxState.end, Math.min(u, 1));
    pos.z += Math.sin(u * Math.PI * 2.0) * 0.55;
    foxGroup.position.set(pos.x, pos.y + Math.abs(Math.sin(elapsed * 11.5)) * 0.08, pos.z);
    foxGroup.rotation.y = Math.atan2(foxState.end.x - foxState.start.x, foxState.end.z - foxState.start.z);
    // 四肢轻快小跑摆动
    foxLegs[0].rotation.x = Math.sin(elapsed * 14) * 0.55;
    foxLegs[1].rotation.x = -Math.sin(elapsed * 14) * 0.55;
    foxLegs[2].rotation.x = -Math.sin(elapsed * 14) * 0.55;
    foxLegs[3].rotation.x = Math.sin(elapsed * 14) * 0.55;
    foxTail.rotation.y = Math.sin(elapsed * 10) * 0.25;
    // 在雪地上留下一行小脚印
    foxState.printTimer += dt;
    if (foxState.printTimer >= 0.36) {
      foxState.printTimer = 0;
      const fp = foxPrints[foxState.nextPrintIdx % foxPrints.length];
      foxState.nextPrintIdx++;
      fp.mesh.position.set(pos.x, 5.43, pos.z + ((foxState.nextPrintIdx % 2) - 0.5) * 0.12);
      fp.age = 0;
    }
    if (u >= 1) {
      foxState.active = false;
      foxGroup.visible = false;
      foxState.nextTrigger = 18.0 + Math.random() * 14.0;
    }
  }
  // 小狐狸脚印留存一段时间后随降雪渐渐淡去
  for (const fp of foxPrints) {
    if (fp.age < 12.0) {
      fp.age += dt;
      fp.mesh.material.opacity = Math.max(0, 0.72 * (1 - fp.age / 12.0));
    } else {
      fp.mesh.material.opacity = 0;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

// ==================== 响应式 ====================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
