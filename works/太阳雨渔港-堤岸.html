<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dceeed">
<title>太阳雨中的小渔港堤岸</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#dceeed}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas aria-label="太阳雨中的小渔港微缩模型，可拖动旋转、滚轮缩放"></canvas>
<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const canvas=document.querySelector('canvas');
const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
scene.background=new T.Color('#dceeed');
scene.fog=new T.Fog('#dceeed',55,105);
const view=15.7;
const camera=new T.OrthographicCamera(-view*innerWidth/innerHeight,view*innerWidth/innerHeight,view,-view,.1,160);
camera.position.set(27,25,34);
const controls=new OrbitControls(camera,canvas);
controls.target.set(0,1,0);
controls.enableDamping=true;controls.dampingFactor=.065;
controls.minZoom=.65;controls.maxZoom=3.8;
controls.minPolarAngle=.18;controls.maxPolarAngle=Math.PI*.47;
controls.enablePan=true;controls.screenSpacePanning=true;
controls.rotateSpeed=.65;controls.zoomSpeed=.8;
const world=new T.Group();scene.add(world);
let seed=9018;
function R(a=0,b=1){seed=(Math.imul(1664525,seed)+1013904223)>>>0;return a+(seed/4294967296)*(b-a)}
const V=(x,y,z)=>new T.Vector3(x,y,z),PI=Math.PI;
const col={paper:'#f6f4e9',concrete:'#c9d1c7',edge:'#8caaa4',ink:'#3b6065',dark:'#304c50',sea:'#65c1bd',deep:'#247c85',rope:'#bb7551',yellow:'#efc64f',orange:'#d8784e',blue:'#659daa',green:'#72a785',rust:'#9c7258',wood:'#ad9573',brass:'#d3b87b'};
const mats=new Map();
const gradient=new T.DataTexture(new Uint8Array([125,125,125,255,184,184,184,255,224,224,224,255,255,255,255,255]),4,1,T.RGBAFormat);
gradient.minFilter=T.NearestFilter;gradient.magFilter=T.NearestFilter;gradient.needsUpdate=true;
function mat(c,extra={}){
  const key=c+JSON.stringify(extra);if(mats.has(key))return mats.get(key);
  const m=new T.MeshToonMaterial({color:c,gradientMap:gradient,...extra});mats.set(key,m);return m;
}
function translucent(c,opacity=.3){return new T.MeshBasicMaterial({color:c,transparent:true,opacity,side:T.DoubleSide,depthWrite:false})}
const inkMat=new T.LineBasicMaterial({color:col.ink,transparent:true,opacity:.43});
const edgeCache=new WeakMap();
function edges(mesh,threshold=28){let g=edgeCache.get(mesh.geometry);if(!g){g=new T.EdgesGeometry(mesh.geometry,threshold);edgeCache.set(mesh.geometry,g)}mesh.add(new T.LineSegments(g,inkMat));return mesh}
function mesh(geo,m,p,x=0,y=0,z=0,outline=false){const o=new T.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;if(outline)edges(o);p.add(o);return o}
const boxCache=new Map();
function box(p,x,y,z,w,h,d,c,outline=true){const k=[w,h,d].join('/');let g=boxCache.get(k);if(!g){g=new T.BoxGeometry(w,h,d);boxCache.set(k,g)}return mesh(g,typeof c==='string'?mat(c):c,p,x,y,z,outline)}
function cyl(p,x,y,z,r,h,c,rt=r,n=12,outline=true){return mesh(new T.CylinderGeometry(rt,r,h,n),typeof c==='string'?mat(c):c,p,x,y,z,outline)}
function ball(p,x,y,z,r,c,sx=1,sy=1,sz=1){const o=mesh(new T.IcosahedronGeometry(r,1),typeof c==='string'?mat(c):c,p,x,y,z);o.scale.set(sx,sy,sz);return o}
function group(p,x=0,y=0,z=0){const g=new T.Group();g.position.set(x,y,z);p.add(g);return g}
function rod(p,a,b,r,c,n=7){const d=b.clone().sub(a);const o=cyl(p,...a.clone().add(b).multiplyScalar(.5).toArray(),r,d.length(),c,r,n,false);o.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());return o}
function path(p,pts,r,c,segments=22){const curve=new T.CatmullRomCurve3(pts.map(a=>Array.isArray(a)?V(...a):a));return mesh(new T.TubeGeometry(curve,segments,r,5,false),typeof c==='string'?mat(c):c,p)}
function stroke(p,pts,c=col.ink,opacity=.7){const g=new T.BufferGeometry().setFromPoints(pts.map(a=>Array.isArray(a)?V(...a):a));const l=new T.Line(g,new T.LineBasicMaterial({color:c,transparent:opacity<1,opacity}));p.add(l);return l}
function ring(p,x,y,z,r,t,c,vertical=true){const o=mesh(new T.TorusGeometry(r,t,7,24),typeof c==='string'?mat(c):c,p,x,y,z);if(!vertical)o.rotation.x=PI/2;return o}
function flat(p,x,y,z,w,h,c){const o=mesh(new T.PlaneGeometry(w,h),typeof c==='string'?mat(c):c,p,x,y,z);o.rotation.x=-PI/2;o.castShadow=false;return o}
function texture(w,h,draw){const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);const t=new T.CanvasTexture(cv);t.colorSpace=T.SRGBColorSpace;t.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),8);return t}
function printed(p,x,y,z,w,h,lines,bg='#eee9d8',fg='#4b706f',size=30){
  const tex=texture(512,256,(c,W,H)=>{c.fillStyle=bg;c.fillRect(0,0,W,H);c.strokeStyle=fg;c.globalAlpha=.2;c.lineWidth=6;c.strokeRect(9,9,W-18,H-18);c.globalAlpha=1;c.fillStyle=fg;c.textAlign='center';c.textBaseline='middle';lines.forEach((t,i)=>{c.font=`${i===0?'bold ':''}${size}px "Yu Gothic","Microsoft YaHei",sans-serif`;c.fillText(t,W/2,H/(lines.length+1)*(i+1));});});
  const o=mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tex}),p,x,y,z);o.castShadow=false;return o;
}
const hemi=new T.HemisphereLight('#f9ffff','#8ca8a0',2.8);scene.add(hemi);
const sun=new T.DirectionalLight('#fff2cf',3.05);sun.position.set(-12,25,13);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-18,right:18,top:20,bottom:-18,near:1,far:65});sun.shadow.normalBias=.035;sun.shadow.bias=-.00018;sun.shadow.radius=3;scene.add(sun);
const fill=new T.DirectionalLight('#d5ffff',.7);fill.position.set(14,12,-15);scene.add(fill);
const ground=flat(scene,0,-2.22,0,200,200,mat('#d7e8e2'));ground.receiveShadow=true;

// A square, 20 by 20 block. The water remains a real transparent cutaway volume.
box(world,0,-1.98,0,20,.38,20,'#839f98');
box(world,0,-1.76,0,19.98,.13,19.98,'#b9c3ab');
const seaVolume=new T.Mesh(new T.BoxGeometry(13.98,2.1,13.98),new T.MeshPhysicalMaterial({color:'#4db7ad',roughness:.32,transparent:true,opacity:.24,side:T.DoubleSide,depthWrite:false}));
seaVolume.position.set(3,-.69,-3);world.add(seaVolume);
box(world,-7, -.31,-3,6,2.8,14,col.edge);
box(world,0,-.31,7,20,2.8,6,col.edge);
box(world,-7,1.11,-3,6,.18,14,col.concrete);
box(world,0,1.11,7,20,.18,6,col.concrete);
// fine concrete joints
for(let x=-9.98;x<10;x+=2)stroke(world,[[x,1.205,4.03],[x,1.205,9.98]],'#97aaa3',.36);
for(let z=4;z<10;z+=1.8)stroke(world,[[-9.98,1.205,z],[9.98,1.205,z]],'#97aaa3',.36);
for(let z=-9.98;z<4;z+=1.8)stroke(world,[[-9.98,1.205,z],[-4.03,1.205,z]],'#97aaa3',.36);
// quay masonry, individual blocks and saltwater stains
for(let row=0;row<4;row++){
  const y=.72-row*.63;
  for(let i=0;i<10;i++){
    const x=-3.3+i*1.36+(row%2)*.15;
    box(world,x,y,3.99,1.3,.59,.18,[col.edge,'#96ada5','#8fa49c','#7b9d94'][row],false);
  }
  for(let i=0;i<10;i++)box(world,-3.99,y,-9.3+i*1.35,.18,.59,1.29,['#acbab0','#96ada5','#8fa49c','#7b9d94'][row],false);
}
for(let i=0;i<140;i++){
  const side=R()>.5;let x=side?R(-3.8,9.8):-3.88,z=side?3.88:R(-9.8,3.7),y=R(-1.5,.9);
  const s=R(.025,.09);ball(world,x,y,z,s,['#d4d0bb','#c4bd9e','#839a8b'][i%3],1,.65,.65);
}
for(const y of [.37,.05,-.44]){
  box(world,3,y,3.87,13.8,.025,.015,'#6c9890',false);
  box(world,-3.87,y,-3,.015,.028,13.8,'#6c9890',false);
}
// shoreline edge, safety markings are textured diagonals, not individual floating tiles
const warningTex=texture(512,96,(c,W,H)=>{c.fillStyle='#efc64f';c.fillRect(0,0,W,H);c.fillStyle='#4b5751';for(let i=-100;i<W+100;i+=84){c.beginPath();c.moveTo(i,0);c.lineTo(i+42,0);c.lineTo(i+100,H);c.lineTo(i+58,H);c.fill()}c.fillStyle='#d4cba9';for(let i=0;i<150;i++){c.globalAlpha=.2;c.fillRect(R(0,W),R(0,H),R(1,10),R(1,3))}});
warningTex.wrapS=T.RepeatWrapping;warningTex.repeat.x=5;
const warning=new T.MeshToonMaterial({map:warningTex,gradientMap:gradient});
box(world,3.1,1.3,4.18,13.65,.22,.28,warning);
box(world,-4.18,1.3,-3,.28,.22,13.5,warning);
// quay bollards, bolts, and coils
function bollard(x,z){const g=group(world,x,1.22,z);cyl(g,0,.035,0,.28,.07,col.dark);cyl(g,0,.26,0,.13,.46,col.dark);const h=cyl(g,0,.44,0,.13,.6,col.dark);h.rotation.z=PI/2;for(const xx of [-.17,.17])for(const zz of [-.17,.17])cyl(g,xx,.085,zz,.025,.03,col.brass,undefined,6,false);return g}
function coil(p,x,y,z,r=.26){for(let j=0;j<4;j++){const o=ring(p,x,y+j*.034,z,r-j*.012,.024,col.rope,false);o.scale.z=.8}}
for(const x of [-2.8,.6,4.2,8.2]){bollard(x,4.65);coil(world,x,1.29,4.65,.21)}
for(const z of [-7.6,-3.7,.8]){bollard(-4.7,z);coil(world,-4.7,1.29,z,.2)}
// lower boarding steps, inset in the front edge
for(let i=0;i<5;i++)box(world,-1.75,1.05-i*.18,3.85-i*.38,2.3,.2,.46,i%2?'#acbfb7':'#bdccc1');
box(world,-1.75,.13,1.85,2.5,.2,1,'#9db5ab');
for(const x of [-2.94,-.55]){rod(world,V(x,.24,1.6),V(x,1.75,3.85),.035,col.edge);rod(world,V(x,1.75,3.85),V(x,1.75,4.7),.035,col.edge)}
// rusted iron ladder and rings face into the water
for(const x of [6.7,7.3])path(world,[[x,-1.25,3.75],[x,.9,3.75],[x,1.6,3.95],[x,1.4,4.2]],.038,col.rust);
for(let y=-1.1;y<1.4;y+=.28)rod(world,V(6.7,y,3.75),V(7.3,y,3.75),.03,col.rust);
for(const x of [-.2,3.3,8.7]){box(world,x,.65,3.77,.24,.24,.06,col.rust);ring(world,x,.55,3.7,.16,.035,col.dark)}

// water shader: a flat-shaded, softly moving patchwork with deliberately broken reflections
const waterUniforms={time:{value:0},rain:{value:1}};
const waterMat=new T.ShaderMaterial({uniforms:waterUniforms,transparent:true,depthWrite:false,side:T.DoubleSide,
vertexShader:`uniform float time; varying vec3 wp; varying vec2 uvw; void main(){vec3 p=position;p.z+=.026*sin(p.x*2.2+time*.85)+.018*sin(p.y*2.7-time*1.1);uvw=uv;vec4 w=modelMatrix*vec4(p,1.);wp=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
fragmentShader:`uniform float time;varying vec3 wp;varying vec2 uvw;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){vec2 p=wp.xz;float a=sin(p.x*1.9+time*.6+sin(p.y*2.1-time*.45))*.23;vec2 cell=floor(vec2(p.x*2.8+a,p.y*9.+sin(p.x*2.+time)*.6));float n=hash(cell);vec3 c=mix(vec3(.28,.65,.64),vec3(.43,.77,.71),.55+.2*sin(p.y*.6));
float mask=step(.71,n);c=mix(c,vec3(.63,.85,.78),mask*.45);float dark=step(.88,hash(cell+9.));c=mix(c,vec3(.19,.51,.55),dark*.23);
float sh=pow(max(0.,sin(p.x*4.8+p.y*8.+time*.9)*sin(p.y*11.-time*.7)),20.);c=mix(c,vec3(.98,.97,.76),sh*.65);gl_FragColor=vec4(c,.82);}`});
const water=mesh(new T.PlaneGeometry(13.9,13.9,70,70),waterMat,world,3,.39,-3);water.rotation.x=-PI/2;water.castShadow=false;water.receiveShadow=false;
const reflectionPieces=[];
for(let i=0;i<100;i++){
  const x=R(-3.7,9.7),z=R(-9.7,3.7),w=R(.1,.7),d=R(.035,.15);
  const m=flat(world,x,.425,z,w,d,translucent(['#fff6d6','#e4f7e9','#317786','#95d9c8'][i%4],R(.15,.43)));m.rotation.z=R(-.12,.12);reflectionPieces.push({m,x,z,ph:R(0,PI*2)});
}
// submerged seabed, pebbles and a real torus tire
for(let i=0;i<130;i++)ball(world,R(-3.7,9.7),R(-1.65,-1.53),R(-9.7,3.7),R(.04,.19),['#b7b59a','#a2ac94','#7f9f95','#d0c6a7'][i%4],1.4,.7,1);
const oldTire=ring(world,7.5,-1.36,1.1,.52,.16,'#345960',false);oldTire.rotation.z=.18;
for(let i=0;i<22;i++){const a=i*.25;const o=ring(world,7.4-Math.cos(a)*.7-i*.07,-1.45,1.2+Math.sin(a)*.4,.075,.019,col.rust,i%2===0);o.rotation.z=.3}
const seaweed=[];
for(let i=0;i<33;i++){
  const x=R(-3.5,9.4),z=R(-9.5,3.5),g=group(world,x,-1.65,z);
  for(let j=0;j<3;j++){const h=R(.35,.9),lean=R(-.2,.2);path(g,[[0,0,0],[lean,h*.4,.03],[lean*.5,h,.03]],.025,['#438f77','#5caa86','#2f8179'][j],8)}seaweed.push({g,ph:R(0,7)});
}
const fishes=[];
for(let i=0;i<14;i++){
  const g=group(world,R(-2,9),R(-1.3,-.15),R(-9,3));ball(g,0,0,0,.09,i%3?'#6da69b':'#d7c892',1.9,.65,.55);
  const tail=mesh(new T.ConeGeometry(.07,.13,3),mat('#97bcb0'),g,-.2,0,0);tail.rotation.z=-PI/2;ball(g,.13,.025,.045,.012,col.dark);
  fishes.push({g,base:g.position.clone(),ph:R(0,7)});
}

// wet concrete: irregular puddles with reflected poles, sky fragments and rain rings
const puddles=[];
function puddle(x,z,rx,rz){const shape=new T.Shape();for(let i=0;i<=40;i++){const a=i/40*PI*2,r=1+.09*Math.sin(a*5)+.05*Math.sin(a*9);const xx=Math.cos(a)*rx*r,zz=Math.sin(a)*rz*r;i?shape.lineTo(xx,zz):shape.moveTo(xx,zz)}const m=mesh(new T.ShapeGeometry(shape),new T.MeshPhysicalMaterial({color:'#a4c6bf',roughness:.16,metalness:.12,transparent:true,opacity:.5}),world,x,1.213,z);m.rotation.x=-PI/2;m.castShadow=false;puddles.push({x,z,rx,rz});return m}
puddle(2.1,7.2,1.65,.55);puddle(7.8,8.2,1.2,.46);puddle(-4.8,7.4,1.15,.38);puddle(-7.2,2.1,.9,.5);puddle(-5.2,-3.5,.6,.45);
flat(world,2,1.22,7.2,.06,.8,translucent('#456e76',.2));flat(world,7.7,1.22,8.25,.08,.6,translucent('#456e76',.18));
for(let i=0;i<130;i++){const x=R(-9.6,9.6),z=R(4.4,9.6);flat(world,x,1.211,z,R(.03,.22),R(.02,.08),translucent(i%4?'#7f9e97':'#f9f8e3',.13))}

// small props
function fishbox(p,x,y,z,blue=false){const g=group(p,x,y,z),c=blue?'#669cad':'#e1e7dc';box(g,0,.14,0,.7,.28,.48,c);box(g,0,.287,0,.6,.025,.38,'#93aea5',false);for(const zz of [-.247,.247]){box(g,0,.23,zz,.19,.055,.014,col.ink,false);for(let k=0;k<4;k++)box(g,-.25+k*.17,.12,zz,.1,.025,.014,blue?'#c2d9d4':'#8ca9a2',false)}return g}
function basket(p,x,y,z){const g=fishbox(p,x,y,z,true);for(let i=0;i<5;i++)for(let j=0;j<2;j++)box(g,-.27+i*.13,.05+j*.08,.25,.065,.035,.012,'#365b68',false);return g}
function bucket(p,x,y,z,c='#9cbdbe'){const g=group(p,x,y,z);cyl(g,0,.19,0,.15,.35,c,.19);cyl(g,0,.37,0,.165,.012,'#476e73',.165,16,false);path(g,[[-.17,.3,0],[-.16,.55,0],[.16,.55,0],[.17,.3,0]],.012,col.dark,10);return g}
function lifering(p,x,y,z,r=.25){ring(p,x,y,z,r,.065,col.paper);for(let j=0;j<4;j++){const a=j/4*PI*2;const o=box(p,x+Math.sin(a)*r,y+Math.cos(a)*r,z,.14,.12,.13,col.orange,false);o.rotation.z=-a}path(p,[[x-r-.03,y,z],[x-r,y-r-.12,z],[x+r,y-r-.12,z],[x+r+.03,y,z]],.014,col.rope)}
function fender(p,x,y,z){const o=ring(p,x,y,z,.19,.065,'#3d5555');path(p,[[x,y+.38,z-.02],[x-.03,y+.17,z],[x,y,z]],.017,col.rope,6);return o}
function kettle(p,x,y,z){cyl(p,x,y+.13,z,.1,.24,'#b8c3b4',.085);cyl(p,x,y+.265,z,.105,.025,col.dark);path(p,[[x-.08,y+.1,z],[x-.18,y+.12,z],[x-.18,y+.25,z],[x-.06,y+.26,z]],.018,col.dark,8)}
function mug(p,x,y,z){cyl(p,x,y+.065,z,.05,.12,col.paper,.055,10);ring(p,x+.065,y+.07,z,.034,.012,col.blue)}
function raincoat(p,x,y,z){const g=group(p,x,y,z);box(g,0,0,0,.27,.43,.06,'#e3bc46');const a=box(g,-.18,.07,0,.12,.3,.06,'#ebc750');a.rotation.z=-.4;const b=box(g,.18,.07,0,.12,.3,.06,'#ebc750');b.rotation.z=.4;ring(g,0,.28,0,.1,.025,'#e9c445');stroke(g,[[0,.16,.036],[0,-.21,.036]],'#8b995a',.8);return g}
function chart(p,x,y,z,w=.25,h=.2){const tex=texture(256,192,(c,W,H)=>{c.fillStyle='#ebe6ca';c.fillRect(0,0,W,H);c.strokeStyle='#6b9791';c.lineWidth=2;for(let i=0;i<8;i++){c.beginPath();c.moveTo(R(0,W),0);c.bezierCurveTo(R(0,W),R(0,H),R(0,W),R(0,H),R(0,W),H);c.stroke()}c.strokeStyle='#ca8164';c.strokeRect(40,50,160,80)});return mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tex}),p,x,y,z)}
function screen(p,x,y,z,w=.2,h=.15){box(p,x,y,z,w+.035,h+.035,.04,col.dark);const tex=texture(256,160,(c,W,H)=>{c.fillStyle='#254e51';c.fillRect(0,0,W,H);c.strokeStyle='#9ce4b4';c.lineWidth=2;for(let i=0;i<4;i++){c.beginPath();c.arc(W/2,H*.8,20+i*25,PI,2*PI);c.stroke()}c.strokeStyle='#ecd893';c.beginPath();c.moveTo(0,H*.8);for(let i=0;i<20;i++)c.lineTo(i*W/19,H*.65+Math.sin(i*.9)*18);c.stroke()});mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tex}),p,x,y,z+.023)}

// Fishing boats: pointed hollow hulls, open cockpits and individually fitted wheelhouses.
const boats=[];const mooring=[];
function boat(x,z,scale=1,yaw=0,tint='#638b98',name='しおさい'){
  const g=group(world,x,.38,z);g.scale.setScalar(scale);g.rotation.y=yaw;
  const shape=[[-.67,1.64],[.67,1.64],[.79,.8],[.78,-.75],[.56,-1.62],[0,-2.15],[-.56,-1.62],[-.78,-.75],[-.79,.8]];
  // tapered hull sides, with an actual interior rather than a solid capsule

const winch=group(world,6.8,1.22,6.35);box(winch,0,.1,0,.85,.2,.65,'#8a9278');for(const xx of [-.3,.3])box(winch,xx,.4,0,.09,.5,.5,col.rust);const drum=cyl(winch,0,.55,0,.23,.64,col.rust);drum.rotation.z=PI/2;for(let i=0;i<11;i++){const q=ring(winch,-.25+i*.05,.55,0,.25,.018,col.rope);q.rotation.y=PI/2}rod(winch,V(.4,.55,0),V(.4,.85,.1),.027,col.dark);rod(winch,V(.4,.85,.1),V(.6,.85,.1),.04,col.wood);

for(let i=0;i<2;i++){rod(world,V(-5.3-i*.2,1.3,2.9),V(-5.65-i*.2,3.45,2.65),.02,col.wood);const n=ring(world,-5.65-i*.2,3.45,2.65,.22,.016,col.edge);n.rotation.x=.1;for(let j=0;j<5;j++)stroke(world,[[-5.85-i*.2+j*.08,3.25,2.65],[-5.85-i*.2+j*.08,3.62,2.65]],'#9caf9d',.5)}

// interlocking tetrapods and animated foam clustered at two corners

function tree(p,x,y,z,s=1){const g=group(p,x,y,z);rod(g,V(0,0,0),V(.05,1.4*s,0),.055*s,col.wood);for(let i=0;i<5;i++){const a=i/5*PI*2;ball(g,Math.cos(a)*.35*s,1.4*s+R(-.15,.2),Math.sin(a)*.35*s,.5*s,['#7ca58a','#92b593','#acc39d'][i%3],1,.9,1)}return g}
for(const p of [[-1.6,.4,-.4,.8],[-.8,1.3,-1.2,.7],[.6,1.1,-1.2,.7],[1.8,.4,-.8,.65],[-1.9,.35,.8,.7],[1.8,.4,.6,.6]])tree(hill,...p);
function house(p,x,y,z,s=1,roof='#718f88'){
  const g=group(p,x,y,z);g.scale.setScalar(s);box(g,0,.6,0,1.4,1.2,1.15,'#dedcc1');
  const a=box(g,-.42,1.33,0,1.05,.09,1.48,roof);a.rotation.z=.45;const b=box(g,.42,1.33,0,1.05,.09,1.48,roof);b.rotation.z=-.45;
  for(let i=0;i<10;i++){const zz=-.68+i*.15;rod(g,V(-.88,1.1,zz),V(0,1.53,zz),.018,'#a8b7a0');rod(g,V(0,1.53,zz),V(.88,1.1,zz),.018,'#a8b7a0')}
  box(g,0,.45,.59,.34,.85,.03,col.wood);for(const xx of [-.47,.47]){box(g,xx,.82,.59,.3,.33,.025,'#a3beb0');box(g,xx,.82,.61,.014,.35,.02,col.wood,false)}return g;
}
house(hill,-.8,1.03,.55,.75);house(hill,.65,1.05,-.2,.65,'#8b9c8b');house(hill,1.25,.65,1.0,.55,'#8e9f98');
// distant breakwater is represented inside the model, not as scenery outside the base
box(world,2.4,.56,-9.68,5.4,.25,.22,'#adc9b8',false);

// Pale volumetric sun shafts through open warehouse roof and cabin glass.
const shafts=[];
function sunbeam(p,x,y,z,h,r,opacity=.045){const m=mesh(new T.CylinderGeometry(r*.35,r,h,6,1,true),new T.MeshBasicMaterial({color:'#fff0bf',transparent:true,opacity,side:T.DoubleSide,depthWrite:false,blending:T.AdditiveBlending}),p,x,y,z);m.rotation.z=-.3;m.castShadow=false;shafts.push({m,opacity});return m}
sunbeam(warehouse,-.9,1.6,.1,2.7,.46,.05);sunbeam(warehouse,.9,1.6,.25,2.7,.3,.055);sunbeam(world,-3.9,5.5,-.5,9,.7,.026);sunbeam(world,4,5,-2,8,.6,.026);
const roomCaustic=flat(warehouse,0,2.87,-.7,2.8,1.3,translucent('#b8f0d4',.18));roomCaustic.rotation.x=PI/2;
// faint, high thin clouds, kept off the diorama itself to preserve model scale
const cloudTexture=texture(256,128,(c,W,H)=>{const a=c.createRadialGradient(W/2,H/2,0,W/2,H/2,W/2);a.addColorStop(0,'rgba(255,255,244,.8)');a.addColorStop(.55,'rgba(255,255,247,.3)');a.addColorStop(1,'rgba(255,255,247,0)');c.fillStyle=a;c.fillRect(0,0,W,H)});

// Golden sunshower streaks, bounded to the square footprint.
const rainCount=850,rainPositions=new Float32Array(rainCount*6),rainPhases=[];
for(let i=0;i<rainCount;i++)rainPhases.push({x:R(-9.9,9.9),z:R(-9.9,9.9),ph:R(0,14),speed:R(5.8,8.2),len:R(.13,.28)});
const rainGeo=new T.BufferGeometry();rainGeo.setAttribute('position',new T.BufferAttribute(rainPositions,3));
const rainMat=new T.LineBasicMaterial({color:'#fff1c4',transparent:true,opacity:.48,depthWrite:false});world.add(new T.LineSegments(rainGeo,rainMat));
const rippleCount=66,rippleGeo=new T.RingGeometry(.94,1,36),ripples=[];
for(let i=0;i<rippleCount;i++){
  let x,z,y;
  if(i<45){x=R(-3.7,9.6);z=R(-8.7,3.6);y=.455}else{const p=puddles[(i-45)%puddles.length];x=p.x+R(-p.rx*.7,p.rx*.7);z=p.z+R(-p.rz*.5,p.rz*.5);y=1.227}
  const m=mesh(rippleGeo,translucent(i<45?'#def9e3':'#d5e5d5',.4),world,x,y,z);m.rotation.x=-PI/2;m.castShadow=false;ripples.push({m,ph:R(0,3),speed:R(.4,.8)});
}
const drips=[];
for(let i=0;i<16;i++){
  const source=i<5?V(-1.5+i*.17,2.5,5.1):i<10?V(-5.9+(i-5)*.8,4.05,1.83):V(7.7+(i-10)*.05,5.6,7.55);
  const m=ball(world,...source.toArray(),.022,mat('#f4ffe5',{transparent:true,opacity:.8}),.7,1.8,.7);m.castShadow=false;drips.push({m,source,ph:R(0,4)});
}

// Gulls with articulated folded wings, gentle gliding and occasional perches.
const gulls=[];
function gull(i){const g=group(world);ball(g,0,0,0,.1,col.paper,.65,.6,1.4);ball(g,0,.065,-.12,.065,col.paper);rod(g,V(0,.06,-.17),V(0,.04,-.25),.018,col.yellow,5);
  const wings=[];for(const side of [-1,1]){const pivot=group(g,0,.02,0);const s=new T.Shape();s.moveTo(0,0);s.lineTo(side*.28,-.06);s.lineTo(side*.63,.08);s.lineTo(side*.37,.14);s.lineTo(0,.1);const w=mesh(new T.ShapeGeometry(s),mat(col.paper,{side:T.DoubleSide}),pivot);w.rotation.x=-PI/2;stroke(w,[[side*.4,.12,.002],[side*.63,.08,.002]],'#688c86',.9);wings.push({pivot,side})}
  gulls.push({g,wings,ph:R(0,7),radius:R(4,8),speed:R(.12,.19),i});}
for(let i=0;i<7;i++)gull(i);
// a faint rainbow appears only during rare brief lulls
const rainbow=group(world,3,2.2,-5.8);rainbow.visible=false;
for(let i=0;i<7;i++){const m=mesh(new T.TorusGeometry(3.1-i*.045,.024,5,80,PI),translucent(['#eec1b8','#ead1a5','#ece0ad','#b6d7ad','#b3d8cc','#b6d4dd','#c9c6dc'][i],0),rainbow);m.castShadow=false}
let nextRainbow=65,nextBeacon=41;
let t=0,last=performance.now(),rainbowStart=-100,beaconStart=-100;
function update(now){
  const dt=Math.min((now-last)/1000,.045);last=now;t+=dt;
  waterUniforms.time.value=t;
  const lull=rainbowStart>0?Math.max(0,1-Math.abs(t-rainbowStart-4)/4):0;
  rainMat.opacity=.43-lull*.2;
  for(let i=0;i<rainCount;i++){
    const d=rainPhases[i],y=14-((t*d.speed+d.ph)%14),k=i*6;
    const x=d.x+((14-y)*.055),bottom=d.x> -4&&d.z<4?.43:1.23;
    const visible=y>bottom&&(d.x+((14-y)*.055))<9.95;
    rainPositions[k]=x;rainPositions[k+1]=visible?y:-3;rainPositions[k+2]=d.z;
    rainPositions[k+3]=x+.02;rainPositions[k+4]=visible?y-d.len:-3;rainPositions[k+5]=d.z+.008;
  }rainGeo.attributes.position.needsUpdate=true;
  for(const r of reflectionPieces){r.m.position.x=r.x+Math.sin(t*.6+r.ph)*.075;r.m.scale.x=.88+Math.sin(t*.8+r.ph)*.18;r.m.scale.y=.8+Math.sin(t*.65+r.ph)*.3;r.m.material.opacity=.2+Math.sin(t*.8+r.ph)*.1}
  for(const b of boats){b.g.position.y=b.base.y+Math.sin(t*.9+b.ph)*.037;b.g.rotation.z=Math.sin(t*.68+b.ph)*.014;b.g.rotation.x=Math.sin(t*.78+b.ph)*.012;b.caustic.material.opacity=.12+.06*Math.sin(t*.7+b.ph)}
  world.updateMatrixWorld(true);
  for(const m of mooring){const a=m.b.g.localToWorld(m.local.clone());m.curve.v0.copy(a);m.curve.v2.copy(m.anchor);m.curve.v1.copy(a).add(m.anchor).multiplyScalar(.5);m.curve.v1.y-=.23+.06*Math.sin(t*.9+m.b.ph);const p=m.l.geometry.attributes.position;for(let i=0;i<p.count;i++){const q=m.curve.getPoint(i/(p.count-1));p.setXYZ(i,q.x,q.y,q.z)}p.needsUpdate=true}
  for(const r of ripples){const a=(t*r.speed+r.ph)%1;r.m.scale.setScalar(.015+a*.17);r.m.material.opacity=(1-a)*.37}
  for(const s of seaweed)s.g.rotation.z=.1*Math.sin(t*.65+s.ph);
  for(const f of fishes){f.g.position.x=f.base.x+Math.sin(t*.31+f.ph)*.65;f.g.position.z=f.base.z+Math.cos(t*.28+f.ph)*.5;f.g.position.y=f.base.y+Math.sin(t*.5+f.ph)*.08;f.g.rotation.y=Math.atan2(-Math.sin(t*.28+f.ph)*.14,Math.cos(t*.31+f.ph)*.2)}
  for(const c of cloths){if(c.sock){c.sock.rotation.y=.1+Math.sin(t*.6)*.18;c.sock.rotation.z=Math.sin(t*1.8)*.08}else if(c.flag){const p=c.flag.geometry.attributes.position;for(let i=0;i<p.count;i++){const x=c.orig[i*3];p.setZ(i,c.orig[i*3+2]+Math.sin(x*9-t*2+c.ph)*.04*(x+.3))}p.needsUpdate=true}else{const p=c.l.geometry.attributes.position;for(let i=0;i<p.count;i++)p.setZ(i,c.orig[i*3+2]+Math.sin(t*.8+c.ph+i*.3)*.035);p.needsUpdate=true}}
  for(const f of foams){const a=(t*.17+f.ph)%1;f.o.scale.set(1+a*.6,.7, .3+a*.2);f.o.material.opacity=.15+(1-a)*.35;f.o.position.y=.44+Math.sin(t+f.ph)*.018}
  for(const d of drips){const a=(t*.38+d.ph)%1;d.m.visible=a<.23;d.m.position.y=d.source.y-a*a*18}
  for(const b of gulls){const a=t*b.speed+b.ph,cycle=(t+b.i*11)%86,perching=b.i<2&&cycle>64;
    if(perching){const perch=b.i===0?V(7.8,6.05,7.55):V(.3,2.9,.1);const mix=Math.min(1,(cycle-64)/4,(86-cycle)/3);b.g.position.set(Math.cos(a)*b.radius,6.9+Math.sin(a*2)*.6,Math.sin(a)*b.radius*.6-1);b.g.position.lerp(perch,Math.max(0,mix));b.g.rotation.y=a+.4;for(const w of b.wings)w.pivot.rotation.z=w.side*(.08+mix*1.25)}else{b.g.position.set(Math.cos(a)*b.radius,6.8+Math.sin(a*1.4+b.i)*.8,Math.sin(a)*b.radius*.62-1);if(b.i===6)b.g.position.y=1.6+Math.abs(Math.sin(a*.6))*2.3;b.g.rotation.y=-a-PI/2;b.g.rotation.z=Math.sin(a)*.13;for(const w of b.wings)w.pivot.rotation.z=w.side*(Math.sin(t*1.6+b.ph)*.12)}
  }
  for(const c of cloudLayers){c.o.position.x=c.x+Math.sin(t*.018+c.ph)*6;c.o.material.opacity=.2+Math.sin(t*.04+c.ph)*.04}
  const sunVariation=1+Math.sin(t*.065)*.045;sun.intensity=3.05*sunVariation;shafts.forEach(s=>s.m.material.opacity=s.opacity*(.85+.15*Math.sin(t*.17)));roomCaustic.material.opacity=.13+.05*Math.sin(t*.55);roomCaustic.position.x=Math.sin(t*.4)*.15;
  if(t>nextRainbow){rainbowStart=t;nextRainbow=t+105+R(0,55)}const rAge=t-rainbowStart;rainbow.visible=rAge<9&&rAge>=0;rainbow.children.forEach(o=>o.material.opacity=.12*Math.max(0,Math.sin(rAge/9*PI)));
  if(t>nextBeacon){beaconStart=t;nextBeacon=t+89+R(0,80)}const bAge=t-beaconStart;beaconGlow.material.opacity=bAge<1.8?Math.max(0,Math.sin(bAge/1.8*PI))*.32:0;
  controls.update();renderer.render(scene,camera);requestAnimationFrame(update);
}
function resize(){const a=innerWidth/innerHeight;camera.left=-view*a;camera.right=view*a;camera.top=view;camera.bottom=-view;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))}addEventListener('resize',resize);
// No buttons, overlays, text UI, people, audio or automatic camera movement.
controls.update();requestAnimationFrame(update);
</script>
