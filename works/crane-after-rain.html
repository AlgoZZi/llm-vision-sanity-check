  const num=n=>Math.round(n*10)/10;
  const pt=(x,y)=>`${num(x)} ${num(y)}`;
  const path=(d,fill='none',stroke='none',w=1,o=1)=>`<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" opacity="${o}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const fleck=(x,y,rx,ry,c,o)=>`<ellipse cx="${num(x)}" cy="${num(y)}" rx="${num(rx)}" ry="${num(ry)}" fill="${c}" opacity="${o}"/>`;
  let markup='';
  const shoreLine=x=>x<800? 334+Math.min(46,x*.107)+7*Math.sin(x*.022):363+10*Math.sin(x*.015)+(.028*(1600-x));
  const reed=(x,y,h,c,thick=1.6,lean=0)=>{
    const dx=range(-.43,.43)*h+lean;
    return path(`M${pt(x,y)} Q${pt(x+dx*.28,y-h*.64)} ${pt(x+dx,y-h)}`,'none',c,thick,.87)+
      path(`M${pt(x+dx,y-h)} Q${pt(x+dx*1.1+3,y-h-9)} ${pt(x+dx*1.1+1,y-h-12)} Q${pt(x+dx*1.02-4,y-h-4)} ${pt(x+dx,y-h)}`,c,'none',1,.69);
  };
  for(let i=0;i<135;i++){
    let x=rand()<.6?range(-65,535):range(1075,1660),y=shoreLine(x)+range(-17,11),h=range(3,34),w=range(12,42),dx=range(-17,17);
    markup+=path(`M${pt(x-w,y)} Q${pt(x-w*.7,y-h*.7)} ${pt(x+dx-w*.3,y-h*.66)} Q${pt(x+dx,y-h*1.4)} ${pt(x+dx+w*.23,y-h*.81)} Q${pt(x+w*.8,y-h*.65)} ${pt(x+w,y+2)}Z`,pick(['#718c81','#759287','#869c8a','#a1ac93']),'none',1,range(.13,.39));
    if(i%2===0)markup+=path(`M${pt(x-10,y+1)} Q${pt(x+dx,y+5)} ${pt(x+dx+12,y+h*.8)} L${pt(x-14,y+h*.4)}Z`,'url(#wash)','none',1,.31);
    if(i%5===0)for(let j=0;j<5;j++)markup+=reed(x+range(-10,10),y+2,range(5,23),'#84998a',.85);
  }
  el('shore').innerHTML=markup;
  markup='';
  for(let i=0;i<340;i++){
    const y=range(343,904),x=range(-100,1610),f=(y-300)/600,w=range(9,63)*(f+.34),dy=range(-1.5,1.5);
    markup+=path(`M${pt(x,y)} q${pt(w*.52,dy)} ${pt(w,dy*.55)}`,'none',pick(['#eae9d7','#f5efdc','#e0e9dd','#516e6a','#718e83']),range(.4,1.9)*(f+.36),range(.13,.61));
  }
  el('riversheen').innerHTML=markup;
  // Shallows: soft stones under the surface, reflections, and small ripple rings.
  markup='';
  for(let i=0;i<63;i++){
    const x=range(-42,720),y=range(652,940),w=range(7,31),h=range(2,8);
    markup+=path(`M${pt(x-w,y)} Q${pt(x-w*.6,y-h)} ${pt(x-2,y-h*1.1)} T${pt(x+w,y-1)} Q${pt(x+w*.15,y+h*.8)} ${pt(x-w,y)}Z`,pick(['#849a8a','#536f6a','#98a793','#677e6f']),'none',1,range(.2,.49));
    if(i%3===0)markup+=path(`M${pt(x-w*.76,y-1)} Q${pt(x,y-h*1.22)} ${pt(x+w*.38,y-h*.6)}`,'none','#c0c6ae',1,.48);
  }
  [[200,720,27],[338,788,39],[506,834,30],[127,855,43],[1471,423,28],[1322,391,20],[568,388,14],[643,864,16]].forEach(([x,y,r])=>{
    for(let j=0;j<3;j++){const a=r*(.42+j*.33);markup+=`<ellipse cx="${x}" cy="${y}" rx="${a}" ry="${a*.135}" fill="none" stroke="${j===1?'#516e65':'#e6e6d1'}" stroke-width="1.15" opacity="${.54-j*.11}" stroke-dasharray="${a*1.19} ${a*.4} ${a*1.6} ${a*1.6}"/>`;}
  });
  el('banks').innerHTML=markup;
  // Individual flagstones. The staggered courses follow the bridge plane.
  const slabColors=['#819186','#94a299','#697f76','#8d9d90','#71877d','#9baa9d','#73857e','#a2ac9e','#81968b','#647b73'];
  markup='';
  const rows=[-5,30,75,131,192,249,302,354];
  for(let j=0;j<rows.length-1;j++){
    const y=rows[j],yy=rows[j+1];
    for(let x=-215+(j%2)*-68;x<1840;){
      const w=range(76,164), a=range(1,5),b=range(1,6),c=range(4,11);
      const shape=`M${pt(x+4,y+5+a)} L${pt(x+19,y+2)} Q${pt(x+w*.54,y+b)} ${pt(x+w-10,y+3+a)} L${pt(x+w-3,y+11)} L${pt(x+w-3-c*.6,yy-9)} L${pt(x+w-14,yy-3-b*.45)} Q${pt(x+w*.42,yy-4)} ${pt(x+11,yy-b)} L${pt(x+1,yy-9)}Z`;
      markup+=path(shape,pick(slabColors),'#415951',range(.75,1.6),.94);
      markup+=path(`M${pt(x+5,y+7+a)} L${pt(x+19,y+3)} Q${pt(x+w*.47,y+b+.5)} ${pt(x+w-11,y+4+a)}`,'none',pick(['#d4dbca','#b5c6b6','#c6cbb5']),range(.8,2.2),range(.36,.71));
      const off=range(8,w*.45), t=range(.18,.66), cy=y+(yy-y)*t;
      if(rand()<.83)markup+=path(`M${pt(x+off,cy)} q${pt(w*.19,-5)} ${pt(w*.39,1)} t${pt(w*.18,0)} q${pt(-w*.18,7)} ${pt(-w*.32,7)}t${pt(-w*.25,-2)}Z`,pick(['#bcc9b9','#536c61','#b3bbb0','#809993']),'none',1,range(.18,.41));
      if(rand()<.42)markup+=path(`M${pt(x+w-9,yy-8)} l${pt(-12,-6)} ${pt(2,-5)} ${pt(-9,-3)}`,'none','#405951',.9,.6);
      for(let k=0;k<7;k++)markup+=fleck(x+range(10,w-12),range(y+8,yy-8),range(.38,2.5),range(.4,1.35),pick(['#dce5cc','#4d675e','#c4cdb5','#697c66']),range(.2,.53));
      x+=w;
    }
  }
  el('paving').innerHTML=markup;
  markup='';
  const puddle=(x,y,w,h)=>{
    let d=`M${pt(x,y)}q${pt(w*.19,-h*.84)} ${pt(w*.38,-h*.54)}t${pt(w*.29,-h*.25)}q${pt(w*.31,-h*.2)} ${pt(w*.33,h*.63)}q${pt(-w*.17,h*.82)} ${pt(-w*.39,h*.65)}t${pt(-w*.38,h*.34)}q${pt(-w*.23,0)} ${pt(-w*.23,-h*.83)}Z`;
    return path(d,pick(['#c5d1c5','#b3c7bd','#b5c6bb','#e2e0ca']),'#d0dac9',.75,range(.27,.57))+
      path(`M${pt(x+w*.12,y-h*.09)}q${pt(w*.21,-h*.42)} ${pt(w*.41,-h*.36)}m${pt(w*.07,0)}l${pt(w*.12,-h*.2)}m${pt(w*.08,h*.57)}l${pt(w*.12,-h*.14)}`,'none','#eeecda',1.15,range(.24,.62));
  };
  for(let i=0;i<43;i++)markup+=puddle(range(-90,1780),range(17,343),range(17,95),range(2,13));
  markup+=puddle(645,270,122,14)+puddle(767,278,170,11)+puddle(950,277,133,13)+puddle(984,306,70,9);
  el('puddles').innerHTML=markup;
  markup='';
  for(let x=-195;x<1850;x+=90){
    markup+=path(`M${x} 360h86l-4 16-80 2Z`,pick(['#65776c','#637b71','#4e6a61','#829186']),'#425953',1,.86);
    markup+=path(`M${x+3} 362h63`,'none','#b5bc9e',1.1,.55);
  }
  el('fascia').innerHTML=markup;
  // Rain-darkened parapets. Uprights remain vertical in screen space.
  const rail=(target,base,start,end,step,ht,near)=>{
    const yy=x=>base+x*.158;
    const plane=(x,z)=>pt(x,yy(x)-z);
    const points=p=>p.map(([x,z])=>plane(x,z)).join('L');
    const poly=(p,c,s='#4d665e',w=1.15,o=1)=>path('M'+points(p)+'Z',c,s,w,o);
    let a='';
    for(let x=start;x<end;x+=step){
      const l=x+14,r=x+step-11, top=ht*.65;
      a+=poly([[l,2],[r,2],[r,13],[l,13]],'url(#face)');
      a+=poly([[l-14,10],[r-14,10],[r,4],[l,4]],'url(#cap)');
      a+=poly([[l,10],[r,10],[r,top-8],[l,top-8]],'url(#face)');
      a+=poly([[l+8,14],[r-11,14],[r-7,top-15],[l+8,top-17]],near?'#657e71':'#789184','#4e6a60',1,.65);
      a+=poly([[l-13,top],[r-14,top],[r+2,top-7],[l+3,top-7]],'url(#cap)');
      a+=poly([[l+3,top-7],[r+2,top-7],[r+1,top-12],[l+3,top-12]],'#687f73');
      a+=path('M'+points([[l+4,top-7],[r-4,top-7]]),'none','#ebecd3',1.4,.6);
      for(let j=0;j<20;j++){
        const m=range(l+3,r-7),v=range(13,top-12),f=range(1,15);
        a+=path('M'+points([[m,v],[m+f,v+range(-1.3,1.3)]]),'none',pick(['#c7d2bf','#364f48','#acb68b','#94a797']),range(.5,1.7),range(.2,.62));
      }
      for(let j=0;j<6;j++){
        const m=range(l+3,r-7),v=range(top-13,top-12);
        a+=path(`M${plane(m,v)} q-1 ${num(range(2,7))} 2 ${num(range(9,17))}`,'none',pick(['#384f48','#bbc7ad']),1,range(.25,.55));
      }
    }
    for(let x=start;x<=end;x+=step){
      const w=near?36:30, v=near?21:18;
      a+=poly([[x-v,12],[x+w-v,12],[x+w,4],[x,4]],'url(#cap)');
      a+=poly([[x-4,8],[x+w+4,8],[x+w+4,-1],[x-4,-1]],'url(#face)');
      a+=poly([[x-v,ht-11],[x,ht-18],[x,6],[x-v,13]],'#536e63');
      a+=poly([[x,6],[x+w,6],[x+w-2,ht-13],[x,ht-16]],'url(#face)');
      a+=poly([[x-3,ht-15],[x+w+4,ht-15],[x+w+4,ht-5],[x-3,ht-5]],'#7e9486');
      a+=poly([[x-v-4,ht+4],[x+w-v+5,ht+4],[x+w+4,ht-5],[x-3,ht-5]],'url(#cap)');
      a+=poly([[x-v-4,ht+4],[x-3,ht-5],[x-3,ht-15],[x-v-4,ht-6]],'#5b756a');
      a+=path('M'+points([[x-2,ht-5],[x+12,ht-5],[x+w+2,ht-5]]),'none','#e0e7ce',1.6,.77);
      a+=path('M'+points([[x+2,ht-19],[x+3,ht*.53],[x+1,ht*.44],[x+3,17]]),'none','#c1cdba',1.25,.67);
      a+=path('M'+points([[x+w-7,15],[x+w-10,20],[x+w-17,22],[x+w-14,28]]),'none','#425f55',1.1,.66);
      for(let j=0;j<16;j++){
        const fx=x+range(3,w-4),fz=range(10,ht-20);
        a+=fleck(fx,yy(fx)-fz,range(.4,2.2),range(.4,1.2),pick(['#b1c1ac','#3e5b51','#91a77f','#a9b78c']),range(.2,.71));
      }
      for(let j=0;j<9;j++){
        const fx=x+range(-12,w+8),fz=range(4,12);
        a+=fleck(fx,yy(fx)-fz,range(.8,3.3),range(.65,1.5),pick(['#9b9f65','#526d52','#8a976e']),range(.33,.76));
      }
    }
    el(target).innerHTML=a;
  };
  rail('farRail',379,-98,1751,177,65,false);
  rail('nearRail',679,-122,1630,224,84,true);
  // Close reeds, drops, and scraps of reflected stem keep the shallows legible.
  markup='';
  [[-5,820,1.04],[54,886,1.56],[256,875,.71],[358,923,1.48],[717,910,.78],[1538,468,.65],[1610,500,1.05]].forEach(([x,y,f])=>{
    for(let i=0;i<17;i++){
      let xx=x+range(-39,42)*f,yy=y+range(-8,12)*f,h=range(16,86)*f, dx=range(-40,56)*f;
      const c=pick(['#435e53','#59745e','#6f8063','#808c69','#9a9d72']);
      const wt=range(1.4,5.8)*f;
      markup+=path(`M${pt(xx,yy)} Q${pt(xx+dx*.4-wt,yy-h*.81)} ${pt(xx+dx,yy-h)} Q${pt(xx+dx*.53+wt,yy-h*.62)} ${pt(xx+wt,yy+2)}Z`,c,'none',1,.84);
      if(i%3===0){markup+=reed(xx,yy,h*1.25,'#6d7051',1.3*f,dx*.24);markup+=fleck(xx+dx*.33,yy-h*.5,1.55*f,2.3*f,'#e6ebcc',.72);}
      markup+=path(`M${pt(xx-5*f,yy+3)} q${pt(6*f,2*f)} ${pt(19*f,2*f)}`,'none','#dae1c5',.85,.48);
    }
  });
  el('waterfront').innerHTML=markup;
})();
</script>
