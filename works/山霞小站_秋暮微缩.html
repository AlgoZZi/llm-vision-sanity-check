<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>山霞小站 · 秋暮</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { background: linear-gradient(#9694b8, #dfaeaa 52%, #efc394); }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    canvas:focus { outline: none; }
  </style>
</head>
<body>
<canvas id="diorama" tabindex="0" aria-label="山霞小站与山吹旧书店。拖动旋转，滚轮或双指缩放，右键拖动平移。键盘方向键旋转，加减键缩放，Home 回到初始视角。"></canvas>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

const canvas = document.querySelector('#diorama');
const renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = T.SRGBColorSpace;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.autoClear = false;

const TAU = Math.PI * 2;
const v = (x, y, z) => new T.Vector3(x, y, z);
const UP = v(0, 1, 0);
const { clamp, lerp, smoothstep, euclideanModulo } = T.MathUtils;
const motion = matchMedia('(prefers-reduced-motion: reduce)').matches ? .32 : 1;
let seed = 0x81bda127;
const rand = (a = 0, b = 1) => {
  seed ^= seed << 13;
  seed ^= seed >>> 17;
  seed ^= seed << 5;
  return a + (b - a) * (seed >>> 0) / 4294967296;
};
const choose = items => items[Math.floor(rand(0, items.length))];
const time = { value: 0 };
const scene = new T.Scene();
const model = new T.Group();
scene.add(model);
const clockwork = [];
const camera = new T.OrthographicCamera(-20, 20, 16, -16, .1, 180);
const initialView = { yaw: .42, pitch: .57, zoom: 1, target: v(.10, 2.45, -.25) };
const goal = { ...initialView, target: initialView.target.clone() };
let yaw = goal.yaw, pitch = goal.pitch, zoom = goal.zoom;
const focus = goal.target.clone();

function resize() {
  const width = Math.max(1, innerWidth), height = Math.max(1, innerHeight), aspect = width / height;
  const halfHeight = Math.max(14.85, 17.35 / aspect);
  camera.left = -halfHeight * aspect;
  camera.right = halfHeight * aspect;
  camera.top = halfHeight;
  camera.bottom = -halfHeight;
  camera.updateProjectionMatrix();
  skyUniforms.aspect.value = aspect;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.85, Math.sqrt(2800000 / (width * height))));
  renderer.setSize(width, height, false);
}

function updateCamera(blend) {
  yaw = lerp(yaw, goal.yaw, blend);
  pitch = lerp(pitch, goal.pitch, blend);
  zoom = lerp(zoom, goal.zoom, blend);
  focus.lerp(goal.target, blend);
  const horizontal = 59 * Math.cos(pitch);
  camera.position.set(focus.x + horizontal * Math.sin(yaw), focus.y + 59 * Math.sin(pitch), focus.z + horizontal * Math.cos(yaw));
  camera.lookAt(focus);
  if (camera.zoom !== zoom) {
    camera.zoom = zoom;
    camera.updateProjectionMatrix();
  }
}

function rotate(dx, dy) {
  goal.yaw -= dx * .0052;
  goal.pitch = clamp(goal.pitch + dy * .0047, .11, 1.37);
}
function magnify(factor) { goal.zoom = clamp(goal.zoom * factor, .60, 4.6); }
function pan(dx, dy) {
  const unitsPerPixel = (camera.top - camera.bottom) / Math.max(1, innerHeight) / goal.zoom;
  camera.updateMatrixWorld();
  goal.target.addScaledVector(v(0, 0, 0).setFromMatrixColumn(camera.matrixWorld, 0), -dx * unitsPerPixel);
  goal.target.addScaledVector(v(0, 0, 0).setFromMatrixColumn(camera.matrixWorld, 1), dy * unitsPerPixel);
  goal.target.clamp(v(-13, -2.5, -13), v(13, 13, 13));
}
const pointers = new Map();
canvas.addEventListener('contextmenu', event => event.preventDefault());
canvas.addEventListener('pointerdown', event => {
  canvas.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY, pan: event.button !== 0 || event.shiftKey });
});
canvas.addEventListener('pointermove', event => {
  const previous = pointers.get(event.pointerId);
  if (!previous) return;
  const next = { ...previous, x: event.clientX, y: event.clientY };
  const second = [...pointers.entries()].find(([id]) => id !== event.pointerId)?.[1];
  if (second) {
    const before = Math.hypot(previous.x - second.x, previous.y - second.y);
    const after = Math.hypot(next.x - second.x, next.y - second.y);
    if (before > 8 && after > 8) magnify(after / before);
    pan((next.x - previous.x) * .5, (next.y - previous.y) * .5);
  } else if (previous.pan) {
    pan(next.x - previous.x, next.y - previous.y);
  } else {
    rotate(next.x - previous.x, next.y - previous.y);
  }
  pointers.set(event.pointerId, next);
});
for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  canvas.addEventListener(event, ({ pointerId }) => pointers.delete(pointerId));
}
canvas.addEventListener('wheel', event => {
  event.preventDefault();
  const amount = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1);
  magnify(Math.exp(-clamp(amount, -220, 220) * .0013));
}, { passive: false });
canvas.addEventListener('keydown', event => {
  const keys = {
    ArrowLeft: () => rotate(28, 0), ArrowRight: () => rotate(-28, 0),
    ArrowUp: () => rotate(0, 26), ArrowDown: () => rotate(0, -26),
    '+': () => magnify(1.15), '=': () => magnify(1.15), '-': () => magnify(1 / 1.15),
    Home: () => {
      goal.yaw = yaw + Math.atan2(Math.sin(initialView.yaw - yaw), Math.cos(initialView.yaw - yaw));
      goal.pitch = initialView.pitch;
      goal.zoom = initialView.zoom;
      goal.target.copy(initialView.target);
    }
  };
  if (Object.hasOwn(keys, event.key)) {
    event.preventDefault();
    keys[event.key]();
  }
});

const sky = new T.Scene(), screenCamera = new T.Camera();
const skyUniforms = { time, aspect: { value: 1 } };
const skyMaterial = new T.ShaderMaterial({
  uniforms: skyUniforms, depthTest: false, depthWrite: false, toneMapped: false,
  vertexShader: `varying vec2 uvScreen;
    void main() { uvScreen = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `
    varying vec2 uvScreen;
    uniform float time, aspect;
    float hash(vec2 p) { return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p) {
      vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);
    }
    float fbm(vec2 p) {
      return noise(p)*.58 + noise(p*2.07+5.)*.27 + noise(p*4.19+13.)*.11 + noise(p*8.03)*.04;
    }
    void main() {
      vec2 p=uvScreen;
      vec3 amber=vec3(.987,.783,.589), peach=vec3(.932,.694,.673), violet=vec3(.572,.605,.758);
      vec3 col=mix(amber,peach,smoothstep(.04,.68,p.y));
      col=mix(col,violet,smoothstep(.39,1.08,p.y));
      vec2 fromSun=(p-vec2(.153,.697))*vec2(aspect,1.);
      float sunDist=length(fromSun);
      col=mix(col,vec3(1.,.823,.58),.41*exp(-sunDist*sunDist*9.));
      col=mix(col,vec3(1.,.894,.675),.82*(1.-smoothstep(.026,.029,sunDist)));
      vec2 cloud=vec2(p.x*aspect*2.5+time*.0017,p.y*25.+p.x*1.7);
      float n=fbm(cloud+vec2(noise(cloud*.3)*.7,noise(cloud*.64+2.)*.47));
      float belt=smoothstep(.36,.51,p.y)*(1.-smoothstep(.84,1.,p.y));
      float body=smoothstep(.53,.64,n)*belt;
      float lining=(smoothstep(.495,.54,n)-smoothstep(.55,.64,n))*belt;
      col=mix(col,vec3(.790,.634,.679),body*.38);
      col=mix(col,vec3(1.,.822,.66),lining*.50);
      float streak=smoothstep(.61,.78,fbm(vec2(p.x*aspect*3.6-time*.001,p.y*43.)));
      col=mix(col,vec3(1.,.883,.74),streak*smoothstep(.26,.37,p.y)*(1.-smoothstep(.47,.71,p.y))*.42);
      float farRidge=.293+fbm(vec2(p.x*aspect*2.8,4.3))*.114;
      float nearRidge=.234+fbm(vec2(p.x*aspect*3.6,8.1))*.112;
      float hills=(1.-smoothstep(farRidge-.003,farRidge+.004,p.y))*smoothstep(.12,.38,p.y);
      float nearer=(1.-smoothstep(nearRidge-.003,nearRidge+.003,p.y))*smoothstep(.14,.37,p.y);
      col=mix(col,vec3(.688,.595,.697),hills*.41);
      col=mix(col,vec3(.584,.517,.656),nearer*.23);
      col=mix(col,vec3(1.,.815,.656),exp(-pow((p.y-.25-fbm(vec2(p.x*3.+time*.007,9.5))*.052)*26.,2.))*.09);
      float grain=(hash(mod(gl_FragCoord.xy,vec2(937.,961.)))-.5)*.017;
      col*=1.-.13*pow(length((p-.5)*vec2(.86,.62)),1.7);
      gl_FragColor=vec4(col+grain,1.);
    }`
});
const backdrop = new T.Mesh(new T.PlaneGeometry(2, 2), skyMaterial);
backdrop.frustumCulled = false;
sky.add(backdrop);

const hemisphere = new T.HemisphereLight('#aabce8', '#8b554d', 1.85);
const sun = new T.DirectionalLight('#ffcc8c', 3.05);
sun.position.set(-28, 19, 22);
sun.target.position.set(0, 1, -1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -19, right: 19, top: 19, bottom: -19, near: .8, far: 85 });
sun.shadow.bias = -.00018;
sun.shadow.normalBias = .03;
const skyFill = new T.DirectionalLight('#9cacf0', .66);
skyFill.position.set(14, 13, -16);
scene.add(hemisphere, sun, sun.target, skyFill);

const ramp = new T.DataTexture(new Uint8Array([79, 124, 174, 220, 255]), 5, 1, T.RedFormat);
ramp.minFilter = ramp.magFilter = T.NearestFilter;
ramp.generateMipmaps = false;
ramp.needsUpdate = true;
const paintCache = new Map();
function paint(color) {
  if (!paintCache.has(color)) paintCache.set(color, new T.MeshToonMaterial({ color, gradientMap: ramp }));
  return paintCache.get(color);
}
const stone = ['#6e7180', '#83838a', '#98928d', '#a69b8a', '#767d84'].map(paint);
const earth = ['#493d49', '#56434d', '#644b4e', '#795552', '#90705b'].map(paint);
const timber = ['#584047', '#6c483d', '#815341', '#91664c', '#a77854'].map(paint);
const moss = ['#53675b', '#6e8164', '#86916b', '#8f9061'].map(paint);
const paper = paint('#dfc69e'), pale = paint('#eadaae'), soot = paint('#362f3e');
const tileDark = paint('#344452'), plaster = paint('#d0ae86'), mint = paint('#8bac96');
const jade = paint('#597c74'), rust = paint('#8c5443'), steel = paint('#a6a1aa');
const crimson = paint('#b84037'), terracotta = paint('#af6047'), gold = paint('#baa067');
const ink = new T.LineBasicMaterial({ color: '#382d42', opacity: .61, transparent: true, depthWrite: false });
const litPaper = new T.MeshStandardMaterial({ color: '#ffe0a3', emissive: '#ffb05b', emissiveIntensity: .68, roughness: .65 });
const gleam = new T.MeshStandardMaterial({ color: '#b7b1ac', roughness: .31, metalness: .33 });
const geo = {
  box: new T.BoxGeometry(1, 1, 1), cyl: new T.CylinderGeometry(1, 1, 1, 12),
  ball: new T.SphereGeometry(1, 14, 9), gem: new T.IcosahedronGeometry(1, 0),
  rock: new T.IcosahedronGeometry(1, 1), plane: new T.PlaneGeometry(1, 1)
};
const fixed = new Map(), outlines = [], forms = new Map();
const scratch = new T.Object3D();
function collections(g, m, casts, receives) {
  const key = `${g.id}/${m.id}/${casts}/${receives}`;
  if (!fixed.has(key)) fixed.set(key, { g, m, casts, receives, transforms: [] });
  return fixed.get(key).transforms;
}
function matrix(x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0) {
  scratch.position.set(x, y, z);
  scratch.scale.set(sx, sy, sz);
  scratch.rotation.set(rx, ry, rz);
  scratch.updateMatrix();
  return scratch.matrix.clone();
}
function place(g, m, x, y, z, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0, casts = true) {
  const transform = matrix(x, y, z, sx, sy, sz, rx, ry, rz);
  collections(g, m, casts, true).push(transform);
  return transform;
}
const boxEdgePositions = new T.EdgesGeometry(geo.box).getAttribute('position');
function cube(x, y, z, w, h, d, mat, options = {}) {
  const { rx = 0, ry = 0, rz = 0, edge = false, shadow = true } = options;
  const transform = place(geo.box, mat, x, y, z, w, h, d, rx, ry, rz, shadow);
  if (edge) {
    const p = v(0, 0, 0);
    for (let i = 0; i < boxEdgePositions.count; i++) {
      p.fromBufferAttribute(boxEdgePositions, i).applyMatrix4(transform);
      outlines.push(p.x, p.y, p.z);
    }
  }
}
const orb = (x, y, z, sx, sy, sz, mat, rough = false, shadow = true) => place(rough ? geo.rock : geo.ball, mat, x, y, z, sx, sy, sz, 0, 0, 0, shadow);
const disk = (x, y, z, r, h, mat, rx = 0, rz = 0) => place(geo.cyl, mat, x, y, z, r, h, r, rx, 0, rz);
function taperGeometry(topRatio, sides) {
  const key = `cone/${topRatio}/${sides}`;
  if (!forms.has(key)) forms.set(key, new T.CylinderGeometry(topRatio, 1, 1, sides));
  return forms.get(key);
}
const taper = (x, y, z, r, topRatio, h, mat, sides = 12, rx = 0, ry = 0, rz = 0) => place(taperGeometry(topRatio, sides), mat, x, y, z, r, h, r, rx, ry, rz);
function ringGeometry(r, thickness, segments) {
  const key = `ring/${r}/${thickness}/${segments}`;
  if (!forms.has(key)) forms.set(key, new T.TorusGeometry(r, thickness, 6, segments));
  return forms.get(key);
}
const ring = (x, y, z, r, thickness, mat, rx = 0, ry = 0, segments = 24) => place(ringGeometry(r, thickness, segments), mat, x, y, z, 1, 1, 1, rx, ry);
function stick(a, b, radius, mat, width = 0) {
  const start = v(...a), end = v(...b), direction = end.clone().sub(start);
  scratch.position.copy(start).lerp(end, .5);
  scratch.scale.set(radius, direction.length(), width || radius);
  scratch.quaternion.setFromUnitVectors(UP, direction.normalize());
  scratch.updateMatrix();
  collections(width ? geo.box : geo.cyl, mat, true, true).push(scratch.matrix.clone());
}
function direct(g, m, x = 0, y = 0, z = 0, parent = model, cast = true) {
  const node = new T.Mesh(g, m);
  node.position.set(x, y, z);
  node.castShadow = cast;
  node.receiveShadow = true;
  parent.add(node);
  return node;
}
function group(x, y, z, parent = model) {
  const g = new T.Group();
  g.position.set(x, y, z);
  parent.add(g);
  return g;
}
function shaped(points) { return new T.ShapeGeometry(new T.Shape(points.map(([x, y]) => new T.Vector2(x, y)))); }
function tube(points, radius, mat, parent = model, cast = true, segments = 18) {
  const path = new T.CatmullRomCurve3(points.map(p => v(...p)));
  return direct(new T.TubeGeometry(path, segments, radius, 5, false), mat, 0, 0, 0, parent, cast);
}
function texture(width, height, draw) {
  const source = document.createElement('canvas');
  source.width = width;
  source.height = height;
  draw(source.getContext('2d'), width, height);
  const tex = new T.CanvasTexture(source);
  tex.colorSpace = T.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function graphic(map, w, h, x, y, z, { ry = 0, rx = 0, emissive = 0, parent = model } = {}) {
  const material = new T.MeshStandardMaterial({ map, roughness: .88, side: T.DoubleSide });
  if (emissive) {
    material.emissive.set('#ffc37e');
    material.emissiveMap = map;
    material.emissiveIntensity = emissive;
  }
  const node = direct(geo.plane, material, x, y, z, parent, false);
  node.scale.set(w, h, 1);
  node.rotation.set(rx, ry, 0);
  return node;
}
function sign(title, subtitle, w, h, x, y, z, opts = {}) {
  const { bg = '#ebd8ab', fg = '#503c3d', vertical = false, border = true } = opts;
  const tex = texture(vertical ? 180 : 768, vertical ? 640 : 256, (ctx, tw, th) => {
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, tw, th);
    for (let i = 0; i < 220; i++) {
      ctx.fillStyle = i % 3 ? 'rgba(91,55,40,.075)' : 'rgba(255,236,186,.14)';
      ctx.fillRect(rand(0, tw), rand(0, th), rand(1, 11), rand(1, 4));
    }
    if (border) {
      ctx.strokeStyle = fg;
      ctx.globalAlpha = .48;
      ctx.lineWidth = 3;
      ctx.strokeRect(11, 11, tw - 22, th - 22);
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = fg;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const font = '"Yu Mincho", "MS Mincho", SimSun, serif';
    if (vertical) {
      const chars = [...title];
      ctx.font = `bold ${Math.min(tw * .65, th / (chars.length + .45))}px ${font}`;
      chars.forEach((char, i) => ctx.fillText(char, tw / 2, th * (i + .72) / (chars.length + .44)));
    } else {
      ctx.font = `bold ${subtitle ? 105 : 136}px ${font}`;
      ctx.fillText(title, tw / 2, th * (subtitle ? .42 : .51), tw * .9);
      if (subtitle) {
        ctx.font = '600 34px "Yu Gothic", "Microsoft YaHei", sans-serif';
        ctx.fillText(subtitle, tw / 2, th * .78, tw * .88);
      }
    }
  });
  return graphic(tex, w, h, x, y, z, opts);
}
const radianceMap = texture(128, 128, (ctx, w, h) => {
  const halo = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  halo.addColorStop(0, 'rgba(255,231,176,.92)');
  halo.addColorStop(.2, 'rgba(255,190,98,.36)');
  halo.addColorStop(.56, 'rgba(255,161,68,.10)');
  halo.addColorStop(1, 'rgba(255,158,59,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, w, h);
});
function halo(x, y, z, size, opacity = .65, color = '#ffd99d', parent = model) {
  const m = new T.SpriteMaterial({ map: radianceMap, color, transparent: true, depthWrite: false,
    blending: T.AdditiveBlending, opacity, toneMapped: false });
  const sprite = new T.Sprite(m);
  sprite.position.set(x, y, z);
  sprite.scale.setScalar(size);
  parent.add(sprite);
  return sprite;
}
const lamps = [];
function practical(x, y, z, lightSize, power, reach) {
  const light = new T.PointLight('#ffbf73', power, reach);
  light.position.set(x, y, z);
  model.add(light);
  const aura = halo(x, y, z, lightSize, .62);
  lamps.push({ light, aura, power, phase: rand(0, 8) });
}

// 每批共用几何和材质，场景中的活动零件仍使用自己的枢轴。
function assembleInstances() {
  for (const { g, m, casts, receives, transforms } of fixed.values()) {
    const batch = new T.InstancedMesh(g, m, transforms.length);
    transforms.forEach((transform, i) => batch.setMatrixAt(i, transform));
    batch.instanceMatrix.needsUpdate = true;
    batch.castShadow = casts;
    batch.receiveShadow = receives;
    batch.computeBoundingSphere();
    model.add(batch);
  }
  fixed.clear();
  const edges = new T.BufferGeometry();
  edges.setAttribute('position', new T.Float32BufferAttribute(outlines, 3));
  model.add(new T.LineSegments(edges, ink));
}

// 方形地台的底板完整，右前角露出溪流的两个切面。
const W = 12, bankX = 8.40, sourceZ = 4.40;
const railZ = x => 7.75 + .69 * Math.sin((x + 3.5) * .133);
const grade = z => .98 + (4.45 - z) * .267;
const stairX = z => -1.60 - 4.18 * smoothstep(-z, 2.4, 9.9);
function terrainY(x, z) {
  const hill = Math.max(0, -z - 4.6) * .43 + Math.max(0, -z - 10.2) * .16;
  const face = 1 - smoothstep(z, 3.02, 3.44);
  let y = .12 + (2.20 + hill) * face;
  y += (.18 * Math.sin(x * .47 + z * .31) + .13 * Math.cos(z * .89)) * smoothstep(-z, 4.7, 8.0);
  if (x < -3.13 && z < 3.3) y -= .49 * smoothstep(-x, 3.13, 6.5) * (1 - smoothstep(-z, .7, 6.2));
  if (x > -.18 && x < 8.17 && z >= -4.55 && z <= 3.05) y = 2.29;
  const corridor = 1 - smoothstep(Math.abs(x - stairX(z)), 1.02, 1.83);
  if (z >= -10.7 && z <= 4.72) y = lerp(y, Math.max(.12, grade(z) - .18), corridor);
  return y;
}
const barkDark = paint('#604547');
const slab = paint('#5b414a');
cube(0, -3.15, 0, 24.3, .23, 24.3, soot, { edge: true });
cube(0, -2.99, 0, 24.12, .09, 24.12, paint('#ac8060'));
cube((-W + bankX) / 2, -1.45, 0, W + bankX, 3.03, 24, slab);
cube((bankX + W) / 2, -1.45, (-W + sourceZ) / 2, W - bankX, 3.03, W + sourceZ, slab);
cube((bankX + W) / 2, -2.50, (sourceZ + W) / 2, W - bankX, .97, W - sourceZ, earth[2]);

const floorShadow = texture(256, 256, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w * .5, h * .5, w * .17, w * .5, h * .5, w * .5);
  g.addColorStop(0, 'rgba(62,41,61,.74)');
  g.addColorStop(.55, 'rgba(76,49,65,.40)');
  g.addColorStop(1, 'rgba(76,49,65,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
});
const plinthShadow = direct(geo.plane, new T.MeshBasicMaterial({ map: floorShadow, transparent: true, depthWrite: false }), .7, -3.30, .9, scene, false);
plinthShadow.scale.set(41, 35, 1);

function vehicleFrame(ox, oy, oz, angle) {
  const c = Math.cos(angle), s = Math.sin(angle);
  const at = (x, y, z) => [ox + x * c + z * s, oy + y, oz - x * s + z * c];
  return {
    at,
    box: (x, y, z, w, h, d, m, opts = {}) => cube(...at(x, y, z), w, h, d, m, { ...opts, ry: angle }),
    ball: (x, y, z, w, h, d, m) => place(geo.ball, m, ...at(x, y, z), w, h, d, 0, angle),
    hoop: (x, y, z, r, size, m) => ring(...at(x, y, z), r, size, m, 0, angle, 28),
    line: (a, b, r, m) => stick(at(...a), at(...b), r, m)
  };
}

  if (Math.abs(x - stairX(z)) < 1.30 && z > -10.89 && z < 4.55) y = Math.max(y, grade(Math.round((z - 4.27) / .451) * .451 + 4.27) + .052);
  if (x > .15 && x < 8.0 && z > 1.55 && z < 3.08) y = Math.max(y, 2.355);
  if (x > bankX && z > sourceZ) y = Math.abs(z - railZ(x)) < 1.21 ? .427 : .100;
  const catwalk = x > -12.08 && x < -4.18 && z > 2.91 && z < 6.455;
  if (catwalk) y = Math.max(y, roofHeight(3.57, .48, Math.abs(z - 4.68) / 1.775, (x + 8.13) / 3.95) + .054);
  return Math.max(y, roofY(x, z));
}
for (let i = 0; i < 1050; i++) {
  const tree = choose(forest), x = clamp(tree.x + rand(-3.65, 3.65), -11.95, 11.94), z = clamp(tree.z + rand(-3.07, 4.63), -11.95, 11.94);
  if (x > bankX && z > sourceZ) continue;
  const h = restingHeight(x, z), size = rand(.064, .164);
  const material = choose(tree.kind ? leaves.slice(4, 7) : leaves.slice(0, 4));
  place(leafGeo[tree.kind], material, x, h + .012, z, size, size, size, -Math.PI / 2, 0, rand(0, TAU), false);
}
const blade = shaped([[-.048, 0], [-.022, .15], [.069, .33], [.035, .14], [.041, 0]]);
const foliageMats = ['#7a835d', '#64775f', '#a39a69', '#a89467'].map(color => new T.MeshToonMaterial({ color, gradientMap: ramp, side: T.DoubleSide }));
for (let i = 0; i < 430; i++) {
  const x = rand(-11.92, 11.87), z = rand(-11.89, 11.91);
  if ((z > 3.15 && z < 9.85) || (x > bankX && z > sourceZ) || (x > -.15 && x < 8.8 && z > -4.98 && z < 3.13) ||
      (Math.abs(x - stairX(z)) < 1.45 && z > -10.9 && z < 4.6)) continue;
  const y = terrainY(x, z) - .006;
  for (let j = 0; j < 2 + i % 3; j++) {
    const s = rand(.47, 1.23);
    place(blade, choose(foliageMats), x + rand(-.11, .11), y, z + rand(-.11, .11), s, s, s, rand(-.34, .34), rand(0, TAU), rand(-.21, .24), false);
  }
  if (i % 7 === 0) orb(x, y + .035, z, rand(.10, .27), rand(.06, .16), rand(.11, .26), choose(stone), true, false);
}

// 日落方向的三股架空线与停在瓷瓶附近的小鸟。
function pole(x, z, height) {
  const y = terrainY(x, z);
  taper(x, y + height / 2, z, .133, .60, height, timber[1], 11);
  cube(x, y + .272, z, .246, .545, .248, stone[0], { edge: true });
  cube(x, y + height - .253, z, 1.94, .112, .121, timber[0], { edge: true });
  stick([x, y + height - .624, z], [x - .67, y + height - .250, z], .041, timber[0], .051);
  stick([x, y + height - .624, z], [x + .67, y + height - .250, z], .041, timber[0], .051);
  for (const dx of [-.74, 0, .74]) {
    stick([x + dx, y + height - .250, z], [x + dx, y + height + .097, z], .022, steel);
    for (let i = 0; i < 3; i++) disk(x + dx, y + height - .071 + i * .069, z, .060, .035, pale);
  }
  for (let i = 0; i < 7; i++) cube(x, y + 1.02 + i * .43, z + .12, .317, .028, .058, rust);
  return [x, y + height + .088, z];
}
const leftPole = pole(-11.04, 2.52, 7.04), rightPole = pole(8.66, 3.88, 9.81);
const cable = [];
for (const off of [-.74, 0, .74]) {
  const a = v(leftPole[0] + off, leftPole[1], leftPole[2]);
  const b = v(rightPole[0] + off, rightPole[1], rightPole[2]);
  const sag = a.clone().lerp(b, .51);
  sag.y -= 1.22 + off * .16;
  sag.z += .037 + off * .1;
  const curve = new T.CatmullRomCurve3([a, sag, b]);
  cable.push(curve);
  direct(new T.TubeGeometry(curve, 47, .014, 4, false), soot, 0, 0, 0, model, false);
}
tube([[8.66, rightPole[1] - .39, 3.88], [8.056, 8.30, 1.12], [7.799, 7.81, -.59], [7.779, 7.78, -.83]], .012, soot, model, false, 28);
for (let i = 0; i < 4; i++) {
  const p = cable[i % 3].getPoint(.27 + i * .105), bird = group(p.x, p.y + .085, p.z);
  const feathers = paint('#4e4651'), breast = paint(i % 2 ? '#6b5a60' : '#70646a');
  direct(geo.ball, feathers, 0, .044, 0, bird, false).scale.set(.101, .106, .138);
  direct(geo.ball, breast, 0, .037, .066, bird, false).scale.set(.071, .073, .083);
  direct(geo.ball, feathers, 0, .137, .075, bird, false).scale.set(.069, .073, .070);
  const beak = direct(taperGeometry(.05, 6), gold, 0, .132, .160, bird, false);
  beak.scale.set(.031, .061, .032);
  beak.rotation.x = Math.PI / 2;
  const tail = direct(geo.box, feathers, 0, .005, -.141, bird, false);
  tail.scale.set(.063, .028, .146); tail.rotation.x = -.25;
  for (const s of [-1, 1]) {
    direct(geo.ball, soot, s * .054, .160, .112, bird, false).scale.set(.011, .011, .011);
    direct(geo.cyl, rust, s * .033, -.064, .014, bird, false).scale.set(.008, .065, .008);
  }
  bird.rotation.y = -.5 + i * .51;
  clockwork.push(t => {
    bird.rotation.z = Math.sin(t * .74 + i * 1.1) * .041 * motion;
    bird.rotation.x = Math.sin(t * .46 + i * .76) * .031 * motion;
    tail.rotation.x = -.25 + Math.sin(t * .78 + i) * .10 * motion;
  });
}

// 飘落的叶片接触瓦片、枕木和溪流后短暂停留或顺水滑行。
for (const kind of [0, 1]) {
  const sources = forest.filter(tree => tree.kind === kind), count = kind ? 18 : 28;
  const inst = new T.InstancedMesh(leafGeo[kind], leaves[kind ? 5 : 2], count);
  inst.frustumCulled = false;
  inst.instanceMatrix.setUsage(T.DynamicDrawUsage);
  model.add(inst);
  const particles = Array.from({ length: count }, (_, i) => ({
    start: -rand(0, 24) + i / count, duration: rand(12.8, 22.1), source: choose(sources),
    phase: rand(0, TAU), dx: rand(-2.8, 2.8), dz: rand(.4, 6.6), size: rand(.12, .218)
  }));
  clockwork.push(t => {
    for (let i = 0; i < count; i++) {
      const p = particles[i];
      let age = t - p.start;
      if (age > p.duration + 3.5) {
        p.start = t + rand(.08, 2.3);
        p.source = choose(sources);
        age = t - p.start;
      }
      const q = clamp(age / p.duration, 0, 1), drift = Math.max(0, age - p.duration);
      const wave = Math.sin(q * 8.1 + p.phase) * .51;
      const x = clamp(p.source.x + Math.sin(p.phase) * p.source.radius * .67 + p.dx * q + wave, -11.91, 11.87);
      let z = clamp(p.source.z + Math.cos(p.phase) * p.source.radius * .49 + p.dz * q + Math.cos(q * 5.1 + p.phase) * .36, -11.95, 11.91);
      const downstream = x > bankX && z > sourceZ && Math.abs(z - railZ(x)) > 1.24;
      if (downstream) z = Math.min(11.93, z + drift * .24);
      const floor = restingHeight(x, z) + .014;
      const src = Math.max(floor + .48, p.source.y);
      const h = lerp(src, floor, q) + Math.sin(q * Math.PI) * Math.sin(q * 8 + p.phase) * .36;
      const settle = smoothstep(q, .91, 1);
      scratch.position.set(x, Math.max(floor, h), z);
      scratch.rotation.set(lerp(p.phase + q * 9.4, -Math.PI / 2, settle), (1 - settle) * Math.sin(q * 11 + p.phase) * 1.5, p.phase + q * 7.2 + drift * .093);
      const life = smoothstep(age, 0, .62) * (1 - smoothstep(drift, 1.8, 3.42));
      scratch.scale.setScalar(Math.max(.0001, p.size * life));
      scratch.updateMatrix();
      inst.setMatrixAt(i, scratch.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
  });
}

// 以柔边光束与受光尘埃表现纸页和木窗之间的金色斜阳。
const shaftMaterial = new T.ShaderMaterial({
  uniforms: { time }, side: T.DoubleSide, transparent: true, depthWrite: false, blending: T.AdditiveBlending, toneMapped: false,
  vertexShader: `varying vec2 shaftUv;void main(){shaftUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `varying vec2 shaftUv;uniform float time;
    void main() {
      float spread=mix(.90,.34,shaftUv.y);
      float inside=max(0.,1.-abs(2.*shaftUv.x-1.)/spread);
      float veil=pow(inside,1.85)*sin(shaftUv.y*3.1415926);
      float filament=.84+.16*sin(shaftUv.x*41.+time*.29);
      gl_FragColor=vec4(1.,.69,.36,veil*filament*.21);
    }`
});
const shaftSpecs = [
  { start: [-.31, 5.28, 2.92], end: [4.95, 2.58, -2.96], width: 1.09 },
  { start: [1.22, 5.23, 2.79], end: [5.32, 2.75, -1.64], width: .63 },
  { start: [-11.21, 3.54, 6.13], end: [-6.64, 1.00, 3.73], width: .83 },
  { start: [-2.15, 6.84, 2.06], end: [4.12, 5.68, .24], width: .43 }
];
for (const spec of shaftSpecs) {
  const a = v(...spec.start), b = v(...spec.end), mid = a.clone().lerp(b, .5), dir = a.clone().sub(b);
  const mount = group(mid.x, mid.y, mid.z);
  const beam = direct(new T.PlaneGeometry(spec.width, dir.length()), shaftMaterial, 0, 0, 0, mount, false);
  mount.quaternion.setFromUnitVectors(UP, dir.normalize());
  const inverse = mount.quaternion.clone().invert();
  const view = v(0, 0, 0);
  beam.renderOrder = 6;
  clockwork.push(() => {
    view.copy(camera.position).sub(focus).applyQuaternion(inverse);
    beam.rotation.y = Math.atan2(view.x, view.z);
  });
}
const motes = Array.from({ length: 143 }, (_, i) => ({ ray: shaftSpecs[i % shaftSpecs.length], u: rand(), x: rand(-.72, .72), y: rand(-.22, .38), z: rand(-.52, .52), phase: rand(0, TAU), size: rand(.20, 1) }));
const motePosition = new T.BufferAttribute(new Float32Array(motes.length * 3), 3).setUsage(T.DynamicDrawUsage);
const moteGeometry = new T.BufferGeometry();
moteGeometry.setAttribute('position', motePosition);
moteGeometry.setAttribute('grain', new T.Float32BufferAttribute(motes.map(m => m.size), 1));
const moteUniforms = { time, px: { value: 1 } };
const moteMaterial = new T.ShaderMaterial({
  uniforms: moteUniforms, transparent: true, depthWrite: false, blending: T.AdditiveBlending, toneMapped: false,
  vertexShader: `attribute float grain;varying float brightness;uniform float time,px;
    void main(){brightness=(.23+grain*.49)*(.78+.22*sin(time*1.1+grain*37.));gl_PointSize=(1.2+2.7*grain)*px;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `varying float brightness;
    void main(){float fade=1.-smoothstep(.05,.5,length(gl_PointCoord-.5));gl_FragColor=vec4(1.,.79,.47,fade*brightness);}`
});
const dust = new T.Points(moteGeometry, moteMaterial);
dust.frustumCulled = false;
dust.renderOrder = 7;
model.add(dust);
clockwork.push(t => {
  moteUniforms.px.value = Math.max(1, renderer.getPixelRatio()) * clamp(Math.sqrt(zoom), .80, 1.43);
  motes.forEach((m, i) => {
    const u = (m.u + t * .019) % 1, drift = Math.sin(t * .24 + m.phase) * .179;
    const [ax, ay, az] = m.ray.start, [bx, by, bz] = m.ray.end;
    motePosition.setXYZ(i, lerp(bx, ax, u) + m.x + drift, lerp(by, ay, u) + m.y + .06 * Math.sin(t * .5 + m.phase), lerp(bz, az, u) + m.z);
  });
  motePosition.needsUpdate = true;
});
const fogMaterial = new T.ShaderMaterial({
  uniforms: { time }, transparent: true, depthWrite: false, side: T.DoubleSide, toneMapped: false,
  vertexShader: `varying vec2 mistUv;void main(){mistUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `varying vec2 mistUv;uniform float time;
    void main(){vec2 uv=mistUv*2.-1.;
      uv.y+=.15*sin(uv.x*5.1+time*.087)+.07*cos(uv.x*11.-time*.12);
      float mask=pow(max(0.,1.-uv.x*uv.x),2.5)*exp(-uv.y*uv.y*9.)*(1.-smoothstep(.62,1.0,abs(uv.y)));
      gl_FragColor=vec4(.801,.758,.813,mask*.148);
    }`
});
for (let i = 0; i < 3; i++) {
  const mist = direct(new T.PlaneGeometry(7.2, 1.4), fogMaterial, -7.7 + i * 7.4, 5.34 + .24 * i, -10.63 + .24 * i, model, false);
  mist.renderOrder = 5;
  clockwork.push(t => { mist.position.x = -7.7 + i * 7.4 + .59 * Math.sin(t * .064 + i * .89); });
}

// 林后的小电车偶尔穿行，经过时才响起极轻的合成车铃。
const railRearZ = -11.31, railRearY = 5.69;
cube(0, railRearY - .091, railRearZ, 23.84, .17, .87, stone[0]);
for (let i = 0; i < 55; i++) cube(-11.78 + i * .436, railRearY + .024, railRearZ, .146, .055, .70, timber[0]);
for (const side of [-1, 1]) cube(0, railRearY + .076, railRearZ + side * .238, 23.83, .050, .042, gleam);
const tinyTrain = group(0, railRearY + .093, railRearZ);
const trainShell = paint('#bdaf8a'), trainStripe = paint('#597b73');
const trainCars = [];
for (let i = 0; i < 3; i++) {
  const car = group(-i * 1.86, 0, 0, tinyTrain);
  trainCars.push(car);
  direct(geo.box, trainShell, 0, .369, 0, car).scale.set(1.719, .534, .529);
  direct(geo.box, trainStripe, 0, .235, 0, car).scale.set(1.724, .184, .548);
  direct(geo.box, tileDark, 0, .668, 0, car).scale.set(1.754, .117, .569);
  direct(geo.box, soot, 0, .110, 0, car).scale.set(1.57, .08, .456);
  for (const z of [-.268, .268]) {
    for (let j = 0; j < 4; j++) {
      direct(geo.box, litPaper, -.608 + j * .405, .477, z, car, false).scale.set(.267, .221, .018);
      direct(geo.box, trainShell, -.607 + j * .405, .478, z * 1.043, car, false).scale.set(.026, .213, .016);
    }
    for (const x of [-.555, .555]) direct(geo.ball, soot, x, .048, z * .74, car).scale.set(.099, .096, .042);
  }
  if (i === 0) {
    for (const z of [-.166, .166]) direct(geo.ball, litPaper, .866, .257, z, car, false).scale.set(.044, .060, .066);
    halo(.90, .281, 0, .87, .63, '#ffd78c', car);
  }
}
let audio, nextPass = -1;
canvas.addEventListener('pointerdown', () => {
  const Constructor = window.AudioContext ?? window.webkitAudioContext;
  if (Constructor && !audio) {
    try { audio = new Constructor(); } catch { return; }
  }
  if (audio?.state === 'suspended') audio.resume().catch(() => {});
}, { passive: true });
function distantBell() {
  if (audio?.state !== 'running' || motion < 1) return;
  for (let i = 0; i < 3; i++) {
    const start = audio.currentTime + i * .61, osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = 'sine';
    osc.frequency.value = i % 2 ? 698 : 554;
    gain.gain.setValueAtTime(.00001, start);
    gain.gain.exponentialRampToValueAtTime(.012, start + .075);
    gain.gain.exponentialRampToValueAtTime(.00001, start + .59);
    osc.connect(gain).connect(audio.destination);
    osc.start(start);
    osc.stop(start + .63);
  }
}
clockwork.push((t, elapsed) => {
  const pass = elapsed % 124, cycle = Math.floor(elapsed / 124);
  tinyTrain.visible = pass >= 42 && pass <= 63;
  if (!tinyTrain.visible) return;
  tinyTrain.position.x = -12 + (pass - 42) / 21 * 27.71;
  for (const car of trainCars) {
    const x = tinyTrain.position.x + car.position.x;
    car.visible = x > -11.08 && x < 11.08;
  }
  if (nextPass !== cycle) {
    nextPass = cycle;
    distantBell();
  }
});
clockwork.push((t, elapsed) => {
  const evening = smoothstep(elapsed, 0, 190);
  sun.intensity = lerp(3.05, 2.66, evening);
  hemisphere.intensity = lerp(1.85, 1.75, evening);
  for (const lamp of lamps) {
    const start = 1.4 + lamp.phase * .14;
    const rise = smoothstep(elapsed, start - .9, start + .95);
    const stutter = Math.exp(-Math.pow((elapsed - start) / .57, 2)) * Math.sin(elapsed * 39 + lamp.phase) * .13 * motion;
    lamp.light.intensity = lamp.power * (.64 + .36 * rise + stutter);
    lamp.aura.material.opacity = .45 + .17 * rise + stutter * .64;
  }
  litPaper.emissiveIntensity = .61 + .38 * smoothstep(elapsed, 0, 4.2) + .13 * evening;
});

assembleInstances();
resize();
updateCamera(1);
addEventListener('resize', resize, { passive: true });
let elapsed = 0, lastFrame = null;
renderer.setAnimationLoop(now => {
  if (document.hidden) { lastFrame = null; return; }
  const delta = lastFrame === null ? 0 : Math.min(.10, (now - lastFrame) / 1000);
  lastFrame = now;
  elapsed += delta;
  time.value = elapsed * motion;
  updateCamera(1 - Math.exp(-Math.max(delta, 1 / 240) * 14));
  for (const tick of clockwork) tick(time.value, elapsed);
  renderer.clear();
  renderer.render(sky, screenCamera);
  renderer.clearDepth();
  renderer.render(scene, camera);
});
</script>
</body>
