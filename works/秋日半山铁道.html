<script type="module">
// 山吹旧书店。全部模型、文字、纹理及动画均在此文件中程序化生成，无图片资源。
const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js')
  .catch(()=>import('https://unpkg.com/three@0.170.0/build/three.module.js'));
const {
  Scene,Color,FogExp2,PerspectiveCamera,WebGLRenderer,Vector2,Vector3,Quaternion,
  Group,Mesh,InstancedMesh,Object3D,BoxGeometry,CylinderGeometry,ConeGeometry,
  SphereGeometry,IcosahedronGeometry,PlaneGeometry,TorusGeometry,TubeGeometry,
  BufferGeometry,Float32BufferAttribute,CanvasTexture,DataTexture,ShaderMaterial,
  MeshToonMaterial,MeshBasicMaterial,MeshStandardMaterial,MeshLambertMaterial,
  LineBasicMaterial,Line,LineSegments,EdgesGeometry,Shape,ShapeGeometry,
  CatmullRomCurve3,AmbientLight,HemisphereLight,DirectionalLight,PointLight,
  DoubleSide,BackSide,NearestFilter,RGBAFormat,SRGBColorSpace,PCFSoftShadowMap,
  ACESFilmicToneMapping,AdditiveBlending,DynamicDrawUsage,Matrix4
}=THREE;
const scene=new Scene();
scene.fog=new FogExp2('#dbb0ae',0.012);
const renderer=new WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=PCFSoftShadowMap;
renderer.outputColorSpace=SRGBColorSpace;renderer.toneMapping=ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
renderer.setClearColor(0x000000,0);
renderer.domElement.setAttribute('aria-label','秋日黄昏的半山铁道与山吹旧书店三维微缩景观，可拖拽旋转、滚轮缩放，方向键旋转，正负号缩放');
renderer.domElement.tabIndex=0;document.body.appendChild(renderer.domElement);
const camera=new PerspectiveCamera(36,innerWidth/innerHeight,0.1,160);
const world=new Group();scene.add(world);
let seed=92317;
function rand(a=0,b=1){seed=(seed*1664525+1013904223)>>>0;return a+(b-a)*seed/4294967296;}
function choose(a){return a[Math.floor(rand(0,a.length))];}
const C={wood:'#705044',darkWood:'#493c40',woodLight:'#bc8861',edge:'#403846',
  indigo:'#3e4864',roof:'#41526a',roofLight:'#617083',stone:'#938c88',
  moss:'#677b58',gold:'#ffcd83',yellow:'#e9bd6b',red:'#c95643',cream:'#f0d8ac',
  paper:'#edd9b2',pink:'#e59a87',water:'#688c92'};
const gradient=new DataTexture(new Uint8Array([70,70,70,255,132,132,132,255,199,199,199,255,255,255,255,255]),4,1,RGBAFormat);
gradient.minFilter=NearestFilter;gradient.magFilter=NearestFilter;gradient.needsUpdate=true;
const mats=new Map();
function toon(color){if(!mats.has(color))mats.set(color,new MeshToonMaterial({color,gradientMap:gradient}));return mats.get(color);}
function basic(color,opacity=1){return new MeshBasicMaterial({color,transparent:opacity<1,opacity,depthWrite:opacity>=1});}
const edgeMat=new LineBasicMaterial({color:C.edge,transparent:true,opacity:0.31});
const glowMat=basic('#ffe3a1');
const geometries={box:new BoxGeometry(1,1,1),cyl:new CylinderGeometry(1,1,1,12),sphere:new SphereGeometry(1,10,7),ico:new IcosahedronGeometry(1,0)};
function mesh(geo,mat,x=0,y=0,z=0,parent=world){const m=new Mesh(geo,typeof mat==='string'?toon(mat):mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function box(w,h,d,x,y,z,color,parent=world,outline=false){const m=mesh(geometries.box,color,x,y,z,parent);m.scale.set(w,h,d);if(outline){const e=new LineSegments(new EdgesGeometry(geometries.box),edgeMat);m.add(e);}return m;}
function cyl(rt,rb,h,x,y,z,color,parent=world,n=12){return mesh(new CylinderGeometry(rt,rb,h,n),color,x,y,z,parent);}
function ball(r,x,y,z,color,parent=world){const m=mesh(geometries.sphere,color,x,y,z,parent);m.scale.setScalar(r);return m;}
function rock(s,x,y,z,color,parent=world){const m=mesh(geometries.ico,color,x,y,z,parent);m.scale.set(s*rand(.8,1.2),s*rand(.55,1),s*rand(.7,1.25));m.rotation.set(rand(0,2),rand(0,4),rand(0,2));return m;}
function rod(a,b,r,color,parent=world,n=8){const va=new Vector3(...a),vb=new Vector3(...b);const m=cyl(r,r,va.distanceTo(vb),...va.clone().add(vb).multiplyScalar(.5).toArray(),color,parent,n);m.quaternion.setFromUnitVectors(new Vector3(0,1,0),vb.sub(va).normalize());return m;}
function line(points,color='#514955',parent=world){const g=new BufferGeometry().setFromPoints(points.map(p=>new Vector3(...p)));const m=new Line(g,new LineBasicMaterial({color}));parent.add(m);return m;}
function curve(points,r,color,parent=world){const c=new CatmullRomCurve3(points.map(p=>new Vector3(...p)));return mesh(new TubeGeometry(c,32,r,6,false),color,0,0,0,parent);}
function group(x=0,y=0,z=0,parent=world){const g=new Group();g.position.set(x,y,z);parent.add(g);return g;}
function textureCanvas(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new CanvasTexture(c);t.colorSpace=SRGBColorSpace;t.anisotropy=4;return t;}
function placard(text,w,h,x,y,z,opt={},parent=world){
  const t=textureCanvas(opt.vertical?160:768,opt.vertical?768:256,(ctx,W,H)=>{
    ctx.fillStyle=opt.bg||'#ecdfbc';ctx.fillRect(0,0,W,H);
    if(opt.border!==false){ctx.strokeStyle=opt.ink||'#4c4b4e';ctx.lineWidth=5;ctx.strokeRect(10,10,W-20,H-20);}
    ctx.fillStyle=opt.ink||'#3f4149';ctx.textAlign='center';ctx.textBaseline='middle';
    if(opt.vertical){ctx.font=`500 ${Math.min(110,(H-60)/text.length*.85)}px "Yu Mincho","Noto Serif CJK JP",serif`;[...text].forEach((c,i)=>ctx.fillText(c,W/2,40+(i+.5)*(H-80)/text.length));}
    else{ctx.font=`${opt.bold?'bold':'500'} ${opt.fontSize||100}px "Yu Mincho","Microsoft YaHei",serif`;ctx.fillText(text,W/2,H/2,W-50);}
    for(let i=0;i<45;i++){ctx.fillStyle=`rgba(89,61,44,${rand(.015,.055)})`;ctx.fillRect(rand(0,W),rand(0,H),rand(1,20),rand(1,3));}
  });
  const mat=new MeshBasicMaterial({map:t,side:DoubleSide,color:opt.tint||'#ffffff'});
  const m=mesh(new PlaneGeometry(w,h),mat,x,y,z,parent);m.castShadow=false;if(opt.rotation)m.rotation.y=opt.rotation;return m;
}
function patch(w,d,x,y,z,col,parent=world){const p=mesh(new PlaneGeometry(w,d),basic(col,.65),x,y,z,parent);p.rotation.x=-Math.PI/2;p.receiveShadow=true;p.castShadow=false;return p;}
function batches(geo,colors,count,build,parent=world){const m=new InstancedMesh(geo,Array.isArray(colors)?toon(colors[0]):colors,count);const dummy=new Object3D();for(let i=0;i<count;i++){dummy.position.set(0,0,0);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);build(dummy,i);dummy.updateMatrix();m.setMatrixAt(i,dummy.matrix);if(Array.isArray(colors))m.setColorAt(i,new Color(choose(colors)));}m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}

  const points=[];for(let i=0;i<=80;i++){const x=-6.92+i*13.84/80;points.push([x,.32,trackZ(x)+d]);}

const wetColors=['#c7ac99','#d2a47d','#88929b','#aa8a81','#dfb484'];
for(let i=0;i<31;i++){const x=rand(-4.4,5.9),z=rand(.0,2.9);const m=mesh(new CircleGeometrySafe(rand(.08,.24),5),basic(choose(wetColors),.48),x,z>2?.684:.49,z);m.rotation.x=-Math.PI/2;m.scale.y=rand(.3,.7);m.castShadow=false;}

for(let x=-2.72;x<2.9;x+=.24){rod([x,2.27,-.88],[x,2.48,.17],.014,'#7c8996',shelter);rod([x,2.48,.17],[x,2.27,1.24],.014,'#7c8996',shelter);}

  ctx.strokeStyle='#4a4951';ctx.lineWidth=4;for(let i=0;i<12;i++){const a=i*Math.PI/6;ctx.beginPath();ctx.moveTo(128+96*Math.sin(a),128-96*Math.cos(a));ctx.lineTo(128+109*Math.sin(a),128-109*Math.cos(a));ctx.stroke();}
  ctx.lineCap='round';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(128,128);ctx.lineTo(80,108);ctx.stroke();ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(128,128);ctx.lineTo(155,46);ctx.stroke();
});

for(let i=0;i<15;i++){const x=rand(1.1,5.5),z=rand(-2.4,-.5),y=6.20-(z+2.54)*.44;const l=mesh(mapleGeo,toon(choose(leafColors.maple)),x,y,z);l.scale.setScalar(rand(.07,.12));l.rotation.set(-1.15,0,rand(0,6));}

// 木电线杆、瓷绝缘子、斜穿天空的细线与小鸟。
const poles=[[-5.35,.55,.75],[6.46,.54,1.53],[.02,1.49,-6.36]];
for(const [x,y,z]of poles){
 cyl(.055,.085,4.77,x,y+2.385,z,'#77614d',world,10);
 box(.95,.10,.10,x,y+4.30,z,'#7e6a53',world,true);
 box(.70,.08,.09,x,y+4.61,z,'#7e6a53');
 for(const off of [-.37,0,.37]){cyl(.045,.036,.13,x+off,y+4.42,z,'#dad6b8',world,8);cyl(.055,.055,.035,x+off,y+4.45,z,'#e4dcbe',world,8);}
 for(let i=0;i<4;i++)box(.11,.055,.10,x,y+1.1+i*.18,z+.03,'#9d9982');
}
const wireCurves=[];
for(const offset of [-.36,0,.36]){
 const pts=[[-5.35+offset,4.98,.75],[-2,4.57,1.0],[2.8,4.58,1.29],[6.46+offset,4.96,1.53]];
 const c=new CatmullRomCurve3(pts.map(p=>new Vector3(...p)));wireCurves.push(c);line(c.getPoints(72).map(v=>v.toArray()),'#514c55');
 const pts2=[[6.46+offset,5.0,1.53],[4.3,5.1,-1.3],[1.9,5.6,-4.1],[.02+offset,5.96,-6.36]];
 const c2=new CatmullRomCurve3(pts2.map(p=>new Vector3(...p)));line(c2.getPoints(60).map(v=>v.toArray()),'#5f5860');
}
const birds=[];
for(const t of [.18,.23,.66]){const p=wireCurves[1].getPoint(t);const b=group(p.x,p.y+.07,p.z);
 const bird=ball(.068,0,0,0,'#55565a',b);bird.scale.set(1,.85,.7);ball(.043,.055,.06,0,'#4c5155',b);
 const beak=mesh(new ConeGeometry(.018,.048,4),'#bf9b67',.100,.062,0,b);beak.rotation.z=-Math.PI/2;
 rod([0,-.015,0],[0,-.067,0],.007,'#6d675b',b);
 const tailBird=mesh(new ConeGeometry(.035,.11,4),'#525559',-.085,-.01,0,b);tailBird.rotation.z=Math.PI/2;
 birds.push({g:b,phase:rand(0,6)});
}

// 漫射云带与远景山谷。属于场景景深而非 UI。
const backdrop=group(0,0,0,scene);
function mountainRibbon(points,color){const shape=new Shape();shape.moveTo(points[0][0],-4);for(const p of points)shape.lineTo(p[0],p[1]);shape.lineTo(points.at(-1)[0],-4);shape.closePath();return mesh(new ShapeGeometry(shape),new MeshBasicMaterial({color,transparent:true,opacity:.34,side:DoubleSide,depthWrite:false}),0,0,-22,backdrop);}
const backMount=mountainRibbon([[-43,1],[-32,4],[-25,3],[-18,7],[-12,4],[-7,6],[-1,3],[6,5],[14,1],[23,4],[36,0]],'#9c94b0');backMount.position.y=-.6;
const backMount2=mountainRibbon([[-38,-.2],[-28,2],[-19,.7],[-12,3],[-7,1.8],[0,3.8],[8,1],[18,2.5],[28,-1]],'#ae9eae');backMount2.position.z=-18;backMount2.position.y=-1;
// 柔软的云沿保持较低透明度，不盖住模型的轮廓。
const cloudTex=textureCanvas(512,128,(ctx,w,h)=>{
 const grad=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);grad.addColorStop(0,'rgba(255,223,190,.32)');grad.addColorStop(.55,'rgba(255,215,181,.16)');grad.addColorStop(1,'rgba(255,216,190,0)');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
});
const clouds=[];
for(let i=0;i<7;i++){const m=mesh(new PlaneGeometry(rand(9,19),rand(.45,1.1)),new MeshBasicMaterial({map:cloudTex,transparent:true,depthWrite:false,color:i%2?'#ffdcbb':'#e6c1ba'}),rand(-25,20),rand(5,11),rand(-28,-20),backdrop);m.rotation.z=rand(-.025,.025);m.castShadow=false;clouds.push({m,x:m.position.x,phase:rand(0,6)});}
// 漂浮底座的软阴影。
const shadowTex=textureCanvas(256,256,(ctx,w,h)=>{const g=ctx.createRadialGradient(128,128,15,128,128,125);g.addColorStop(0,'rgba(72,53,77,.28)');g.addColorStop(.6,'rgba(72,53,77,.12)');g.addColorStop(1,'rgba(72,53,77,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);});
const groundShadow=mesh(new PlaneGeometry(24,24),new MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false}),0,-1.90,0,scene);groundShadow.rotation.x=-Math.PI/2;groundShadow.castShadow=false;

// 微小落叶，落地后停留，渠中叶片则随水流走。
const falling=[];
for(let i=0;i<35;i++){
 const type=i%4===0?'ginkgo':'maple';const m=mesh(type==='maple'?mapleGeo:ginkgoGeo,new MeshToonMaterial({color:choose(leafColors[type]),gradientMap:gradient,side:DoubleSide}),0,0,0);
 m.scale.setScalar(rand(.07,.12));m.castShadow=false;
 const t=choose(trees);falling.push({m,t,age:rand(0,25),life:rand(18,29),phase:rand(0,6),drift:rand(.1,.6),x:t.x+rand(-.8,.8),z:t.z+rand(-.5,.8),roof:false});
}
for(let i=0;i<5;i++){
 const m=mesh(mapleGeo,new MeshBasicMaterial({color:choose(leafColors.maple),side:DoubleSide}),rand(5.2,6.6),.215,rand(4.4,6.6));m.scale.setScalar(.09);m.rotation.x=-Math.PI/2;
 falling.push({m,water:true,phase:rand(0,10),x:m.position.x,z:m.position.z});
}
// 金色尘埃，使用一个点精灵绘制批次。
const dustCount=115,dustPositions=new Float32Array(dustCount*3),dustSeeds=[];
for(let i=0;i<dustCount;i++){const p={x:rand(-4.9,5.5),y:rand(.8,4.8),z:rand(-2.7,2.8),phase:rand(0,10)};dustSeeds.push(p);dustPositions.set([p.x,p.y,p.z],i*3);}
const dustGeometry=new BufferGeometry();dustGeometry.setAttribute('position',new Float32BufferAttribute(dustPositions,3));
const dustMaterial=new ShaderMaterial({transparent:true,depthWrite:false,blending:AdditiveBlending,uniforms:{uPixel:{value:Math.min(devicePixelRatio,1.7)}},
 vertexShader:`uniform float uPixel;varying float vAlpha;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;gl_PointSize=clamp(48./-mv.z,1.,3.)*uPixel;vAlpha=.5;}`,
 fragmentShader:`varying float vAlpha;void main(){float r=length(gl_PointCoord-.5);if(r>.5)discard;gl_FragColor=vec4(1.,.77,.42,(1.-r*2.)*vAlpha);}`});
const dust=new THREE.Points(dustGeometry,dustMaterial);world.add(dust);
// 斜阳光柱，几何薄幕从窗外延伸至店内，不使用厚重体积雾。
const rayMat=new ShaderMaterial({transparent:true,depthWrite:false,side:DoubleSide,blending:AdditiveBlending,
 uniforms:{uTime:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`varying vec2 vUv;uniform float uTime;void main(){float edge=pow(sin(vUv.x*3.14159265),3.);float fade=sin(vUv.y*3.14159265);float a=edge*fade*.055*(.94+.06*sin(uTime*.32));gl_FragColor=vec4(1.,.73,.40,a);}`});
for(let i=0;i<4;i++){
 const m=mesh(new PlaneGeometry(.24+i*.09,3.4),rayMat,-.1+i*.84,1.53,-.37,shop);m.rotation.z=-.90;m.rotation.y=.20;m.castShadow=false;
}
for(let i=0;i<3;i++){const m=mesh(new PlaneGeometry(.24,2.4),rayMat,-4.7+i*1.6,1.78,2.55);m.rotation.z=-.92;m.castShadow=false;}
// 山谷缓缓移动的薄暮雾气。
const mist=[];
for(let i=0;i<3;i++){const m=mesh(new PlaneGeometry(9,1.1),new MeshBasicMaterial({map:cloudTex,transparent:true,opacity:.29,depthWrite:false,color:'#c5c0ce',side:DoubleSide}),-2+i*3.0,2.1+i*.18,-6.5-i*.2);m.castShadow=false;mist.push({m,x:m.position.x});}

// 偶发远景电车：没有近景人物，不破坏小站的宁静。
const train=group(-7,1.95,-6.45);train.visible=false;
for(let i=0;i<3;i++){
 const car=group(i*.85,0,0,train);
 box(.80,.38,.27,0,0,0,'#8c8b78',car,true);
 box(.80,.065,.29,0,.23,0,'#697a79',car);
 box(.80,.035,.012,0,-.10,.144,'#c6956c',car);
 for(let j=0;j<4;j++)box(.12,.14,.012,-.28+j*.185,.045,.145,basic('#ffe4a6'),car);
 for(const x of [-.24,.24])ball(.055,x,-.23,0,'#4d5960',car);
}
const trainGlow=new PointLight('#ffd99d',0,4);trainGlow.position.set(0,0,.2);train.add(trainGlow);
// 声音只在用户首次操作后初始化，遵守浏览器自动播放策略。
let audio=null,audioReady=false;
function unlockAudio(){if(audioReady)return;try{audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume().then(()=>{audioReady=true;}).catch(()=>{});}catch{}}
function distantBell(){if(!audioReady||!audio||audio.state!=='running')return;const t=audio.currentTime;for(let i=0;i<2;i++){
 const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=i?1046.5:783.99;gain.gain.setValueAtTime(0,t+i*.55);gain.gain.linearRampToValueAtTime(.006,t+i*.55+.05);gain.gain.exponentialRampToValueAtTime(.0001,t+i*.55+1.8);osc.connect(gain);gain.connect(audio.destination);osc.start(t+i*.55);osc.stop(t+i*.55+2);
}}

// 自包含轨道控制：鼠标 / 触屏旋转，双指缩放和平移，右键平移。
const controls={theta:.70,phi:1.05,radius:30,target:new Vector3(0,1.78,0),goalTheta:.70,goalPhi:1.05,goalRadius:30,goalTarget:new Vector3(0,1.78,0)};
const canvas=renderer.domElement,pointers=new Map();let gesture=null;
function adaptiveRadius(){return innerWidth/innerHeight<.8?43:innerWidth/innerHeight<1.15?35:30;}
controls.radius=controls.goalRadius=adaptiveRadius();
function metrics(){const ps=[...pointers.values()];if(ps.length>1){return {x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2,d:Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),n:ps.length};}return ps.length?{...ps[0],d:0,n:1}:null;}
function pan(dx,dy){const scale=controls.goalRadius*.0012;const right=new Vector3(Math.cos(controls.theta),0,-Math.sin(controls.theta));controls.goalTarget.addScaledVector(right,-dx*scale);controls.goalTarget.y+=dy*scale;controls.goalTarget.x=Math.max(-5,Math.min(5,controls.goalTarget.x));controls.goalTarget.y=Math.max(-.1,Math.min(5,controls.goalTarget.y));controls.goalTarget.z=Math.max(-5,Math.min(5,controls.goalTarget.z));}
canvas.addEventListener('pointerdown',e=>{canvas.focus({preventScroll:true});unlockAudio();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,button:e.button});canvas.setPointerCapture(e.pointerId);gesture=metrics();});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,button:old.button});const m=metrics();if(gesture&&m.n===gesture.n){const dx=m.x-gesture.x,dy=m.y-gesture.y;
 if(m.n>1){if(gesture.d>0)controls.goalRadius*=gesture.d/Math.max(1,m.d);pan(dx,dy);}
 else if(old.button===2||e.shiftKey)pan(dx,dy);
 else{controls.goalTheta-=dx*.006;controls.goalPhi-=dy*.004;}
 clampControls();}gesture=m;});
function release(e){pointers.delete(e.pointerId);gesture=metrics();}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();controls.goalRadius*=Math.exp(Math.max(-100,Math.min(100,e.deltaY))*.0014);clampControls();},{passive:false});
function clampControls(){controls.goalPhi=Math.max(.24,Math.min(1.49,controls.goalPhi));controls.goalRadius=Math.max(12,Math.min(58,controls.goalRadius));}
canvas.addEventListener('keydown',e=>{
 let handled=true;switch(e.key){case'ArrowLeft':controls.goalTheta+=.09;break;case'ArrowRight':controls.goalTheta-=.09;break;case'ArrowUp':controls.goalPhi-=.06;break;case'ArrowDown':controls.goalPhi+=.06;break;case'+':case'=':controls.goalRadius*=.9;break;case'-':controls.goalRadius*=1.1;break;case'Home':controls.goalTheta=.70;controls.goalPhi=1.05;controls.goalRadius=adaptiveRadius();controls.goalTarget.set(0,1.78,0);break;default:handled=false;}
 if(handled){e.preventDefault();clampControls();}
});
canvas.addEventListener('dblclick',()=>{controls.goalTheta=.70;controls.goalPhi=1.05;controls.goalRadius=adaptiveRadius();controls.goalTarget.set(0,1.78,0);});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);dustMaterial.uniforms.uPixel.value=Math.min(devicePixelRatio,1.7);});

// 用固定的可见时间推进动画；后台暂停，返回页面不会突然跳时。
let previous=performance.now(),time=0,trainCycle=-1,raf=0;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
function animate(now){
 if(document.hidden){raf=0;return;}
 const dt=Math.min((now-previous)/1000,.05);previous=now;time+=dt;
 const t=time,motion=reducedMotion.matches?.23:1;
 const damping=1-Math.exp(-dt*8);
 controls.theta+=(controls.goalTheta-controls.theta)*damping;controls.phi+=(controls.goalPhi-controls.phi)*damping;
 controls.radius+=(controls.goalRadius-controls.radius)*damping;controls.target.lerp(controls.goalTarget,damping);
 camera.position.set(controls.target.x+controls.radius*Math.sin(controls.phi)*Math.sin(controls.theta),controls.target.y+controls.radius*Math.cos(controls.phi),controls.target.z+controls.radius*Math.sin(controls.phi)*Math.cos(controls.theta));camera.lookAt(controls.target);
 waterUniforms.uTime.value=t;rayMat.uniforms.uTime.value=t;
 for(const tr of trees){tr.crown.rotation.z=Math.sin(t*.48+tr.phase)*.017*motion;tr.crown.rotation.x=Math.sin(t*.36+tr.phase)*.012*motion;}
 for(const n of noren){const pos=n.m.geometry.attributes.position;for(let i=0;i<pos.count;i++){const yy=n.base[i*3+1];const weight=(.315-yy)/.63;pos.setZ(i,Math.sin(t*1.35+n.phase+n.base[i*3]*5)*.05*weight*motion);}pos.needsUpdate=true;n.m.geometry.computeVertexNormals();n.g.rotation.x=Math.sin(t*.9+n.phase)*.04*motion;}
 shirtPivot.rotation.x=Math.sin(t*.93)*.10*motion;shirtPivot.rotation.z=Math.sin(t*.72)*.035*motion;
 const pp=page.geometry.attributes.position;for(let i=0;i<pp.count;i++){const xx=pageBase[i*3];pp.setZ(i,Math.sin(t*1.18+xx*8)*.035*(xx+.087)/.174*motion);}pp.needsUpdate=true;page.geometry.computeVertexNormals();
 for(const b of birds)b.g.rotation.z=Math.sin(t*.62+b.phase)*.045*motion;
 fanHead.rotation.y=Math.sin(t*.42)*.38;blades.rotation.z=t*8;
 tail.rotation.y=Math.sin(t*.7)*Math.pow(Math.max(0,Math.sin(t*.20)),7)*.27*motion;
 catEars[1].rotation.z=-.2+Math.pow(Math.max(0,Math.sin(t*.31)),20)*.18*motion;
 const breathe=1+Math.sin(t*1.1)*.012;body.scale.y=.72*breathe;
 for(const f of flicker){const startup=t<5?(Math.sin(t*13+f.phase)*.13+Math.sin(t*23)*.06):.008*Math.sin(t*1.6+f.phase);f.light.intensity=f.base*(.91+startup);}
 const signalMix=(Math.sin(t*.24)+1)*.5;signalLights[0].material.color.setRGB(.20+.32*(1-signalMix),.46+.48*(1-signalMix),.29+.34*(1-signalMix));signalLights[1].material.color.setRGB(.38+.60*signalMix,.29+.48*signalMix,.12+.24*signalMix);
 for(const f of fish){f.g.position.x=f.x+Math.sin(t*.33+f.phase)*.22;f.g.position.y=f.y+Math.sin(t*.47+f.phase)*.025;f.g.rotation.y=f.sideView?Math.sin(t*.33+f.phase)*.15:t*.16;}
 for(let i=0;i<splash.length;i++){const s=splash[i],u=(t*.75+s.phase)%1;s.m.position.set(5.13+Math.sin(s.phase)*s.r*u,.21+Math.sin(u*Math.PI)*.20,5.0+Math.cos(s.phase)*s.r*u);s.m.material.opacity=Math.sin(u*Math.PI)*.65;}
 for(let i=0;i<ripples.length;i++){const p=(t*.37+i*.25)%1;ripples[i].scale.setScalar(.5+p*2.8);ripples[i].material.opacity=(1-p)*.42;}
 for(const f of falling){
  if(f.water){f.m.position.z=4.38+((t*.10+f.phase)%2.20);f.m.position.x=f.x+Math.sin(t*.48+f.phase)*.065;f.m.position.y=.218+Math.sin(t*1.2+f.phase)*.009;f.m.rotation.z=t*.10+f.phase;continue;}
  f.age+=dt*motion;if(f.age>f.life){f.age=0;const tr=choose(trees);f.t=tr;f.x=tr.x+rand(-.8,.8);f.z=tr.z+rand(-.4,.6);}
  const fallDuration=f.life*.73,u=Math.min(f.age/fallDuration,1);
  let x=f.x+u*1.3+Math.sin(u*7+f.phase)*.23,z=f.z+u*1.5+Math.cos(u*6+f.phase)*.24;
  x=Math.max(-6.85,Math.min(6.85,x));z=Math.max(-6.80,Math.min(6.80,z));
  let floor=z<-1.7?(x<-.3?1.38:1.67):z>3.5?.22:z>2?.69:.55;
  if(x>1.0&&x<5.9&&z>-4.7&&z<-.35)floor=6.20-Math.abs(z+2.54)*.44;
  const y=Math.max(floor,f.t.y+(1-u)*.2-(f.t.y-floor)*u);
  f.m.position.set(x,y,z);if(u<1)f.m.rotation.set(t*.7+f.phase,t*.9+f.phase,t*.55);else f.m.rotation.set(-Math.PI/2,0,f.phase);
 }
 const dp=dust.geometry.attributes.position;
 for(let i=0;i<dustCount;i++){const d=dustSeeds[i];dp.setXYZ(i,d.x+Math.sin(t*.21+d.phase)*.09,.7+((d.y-.7+t*.045)%4.1),d.z+Math.cos(t*.18+d.phase)*.06);}dp.needsUpdate=true;
 for(const h of halos){h.quaternion.copy(camera.quaternion);const parentQuat=new Quaternion();h.parent.getWorldQuaternion(parentQuat);h.quaternion.premultiply(parentQuat.invert());}
 for(const c of clouds)c.m.position.x=c.x+Math.sin(t*.018+c.phase)*1.2;
 for(let i=0;i<mist.length;i++)mist[i].m.position.x=mist[i].x+Math.sin(t*.04+i)*.55;
 const cycle=Math.floor(t/67),local=t%67;train.visible=local>40&&local<58;
 if(train.visible){const u=(local-40)/18;train.position.x=-9+u*17;trainGlow.intensity=Math.sin(u*Math.PI)*.65;if(trainCycle!==cycle){trainCycle=cycle;distantBell();}}
 renderer.render(scene,camera);raf=requestAnimationFrame(animate);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;}else{previous=performance.now();if(!raf)raf=requestAnimationFrame(animate);}});
raf=requestAnimationFrame(animate);
</script>
