    if(pointers.size===1){if(previous.button===2||e.shiftKey){const speed=viewHeight/innerHeight/orbit.goalZoom;orbit.goalTarget.x-=dx*speed*Math.cos(orbit.azimuth);orbit.goalTarget.z+=dx*speed*Math.sin(orbit.azimuth);orbit.goalTarget.y+=dy*speed}else{orbit.goalAzimuth-=dx*.0045;orbit.goalElevation=clamp(orbit.goalElevation+dy*.004,.2,1.25)}}
    else if(pointers.size===2){const [a,b]=[...pointers.values()],dist=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};if(lastPinch)orbit.goalZoom=clamp(orbit.goalZoom*dist/lastPinch,.58,2.8);if(lastMid){const s=viewHeight/innerHeight/orbit.goalZoom;orbit.goalTarget.x-=(mid.x-lastMid.x)*s*Math.cos(orbit.azimuth);orbit.goalTarget.z+=(mid.x-lastMid.x)*s*Math.sin(orbit.azimuth);orbit.goalTarget.y+=(mid.y-lastMid.y)*s}lastPinch=dist;lastMid=mid}
  });
  function release(e){pointers.delete(e.pointerId);lastPinch=0;lastMid=null}
  canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
  canvas.addEventListener('wheel',e=>{e.preventDefault();orbit.goalZoom=clamp(orbit.goalZoom*Math.exp(-e.deltaY*.001),.58,2.8)},{passive:false});
  canvas.addEventListener('dblclick',()=>{orbit.goalAzimuth=.73;orbit.goalElevation=.58;orbit.goalZoom=1;orbit.goalTarget.set(0,2.4,0)});
  const clock=new THREE.Clock();let elapsed=0;
  const rippleSet=[];
  for(let i=0;i<5;i++){
    const ringMat=new THREE.MeshBasicMaterial({color:i%2?0xe5eee7:0xffdcad,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide});
    const ring=mesh(new THREE.TorusGeometry(1,.018,4,48),ringMat,root);ring.rotation.x=Math.PI/2;ring.position.set([2.1,3.7,5.1,6.4,1.1][i],1.2,[5.4,7.3,8.7,5.9,7.5][i]);ring.scale.setScalar(.2);rippleSet.push({ring,phase:i*.73});
  }
  const vaporRings=[];
  for(let i=0;i<3;i++){
    const ring=mesh(new THREE.TorusGeometry(.22,.013,4,20),new THREE.MeshBasicMaterial({color:0xd3ebe9,transparent:true,opacity:.2,depthWrite:false}),root);
    ring.rotation.x=Math.PI/2;ring.position.set(-.18,1.55+i*.38,5.15);vaporRings.push({ring,phase:i*1.7});
  }
  const poolLight=pointLight(4.1,.35,7.1,0x81cde1,1.35,8);poolLight.castShadow=false;
  const fireMotes=[];
  for(let i=0;i<8;i++){const mote=ball(0,0,0,.035,.035,.035,M.gold,root);mote.material=new THREE.MeshBasicMaterial({color:0xffb95e,transparent:true,opacity:0,depthWrite:false});fireMotes.push({mote,phase:i*1.21})}
  // 轻风每隔一阵把檐口雪粉横向卷过一小段。
  const gustBurst=[];
  for(let i=0;i<90;i++){
    const mote=ball(0,0,0,.04,.025,.04,M.snow,scene);mote.material=new THREE.MeshBasicMaterial({color:i%3?0xe7f3f8:0xffecd9,transparent:true,opacity:0,depthWrite:false});mote.castShadow=false;gustBurst.push({mote,phase:i/90,seed:rnd(0,6.2)});
  }
  animated.push((t,dt)=>{
    bath.waterMat.uniforms.time.value=t;
    rippleSet.forEach(({ring,phase})=>{const q=(t*.22+phase)%1;ring.scale.setScalar(.18+q*.7);ring.material.opacity=Math.sin(q*Math.PI)*.2});
    vaporRings.forEach(({ring,phase})=>{const q=(t*.12+phase)%1;ring.position.y=1.45+q*1.8;ring.scale.setScalar(.4+q*1.3);ring.material.opacity=Math.sin(q*Math.PI)*.15});
    poolLight.intensity=1.15+.2*Math.sin(t*1.1);
    const flame=groundHeight(7.65,4.5);fireMotes.forEach(({mote,phase})=>{const q=(t*.45+phase)%1;mote.position.set(7.65+Math.sin(phase*8+t)*.32,flame+.42+q*.95,4.5+Math.cos(phase*7+t*.8)*.26);mote.material.opacity=Math.sin(q*Math.PI)*.75;mote.scale.setScalar(.018+(1-q)*.025)});
    const windCycle=t%29,active=windCycle>23.5&&windCycle<26.2;
    for(const {mote,phase,seed} of gustBurst){if(!active){mote.material.opacity=0;continue}const q=clamp((windCycle-23.5)/2.7,0,1);mote.position.set(-10+q*21+Math.sin(t*4+seed)*.55,groundHeight(-8+q*18,3)+.5+phase*4+Math.sin(t*2+seed)*.22,3+Math.cos(seed*2+t)*.75);mote.material.opacity=(1-Math.abs(q-.5)*1.45)*.42;mote.scale.setScalar(.035+phase*.055)}
    bath.spout.rotation.z=Math.sin(t*.45)*.012;
  });
  const glassFront=new THREE.MeshPhysicalMaterial({color:0xa6d4ec,transparent:true,opacity:.06,roughness:.13,metalness:.15,depthWrite:false,side:THREE.DoubleSide});
  // 热泉池的正面剖面玻璃薄层，不遮住外露的石层和热水管。
  const poolFace=mesh(new THREE.PlaneGeometry(5.15,1.45),glassFront,root);poolFace.position.set(3.65,-.78,10.66);poolFace.castShadow=false;
  const waterCut=mesh(new THREE.PlaneGeometry(3.5,.63),new THREE.MeshBasicMaterial({color:0x9be0df,transparent:true,opacity:.17,depthWrite:false,side:THREE.DoubleSide}),root);waterCut.position.set(3.65,-.52,10.675);waterCut.castShadow=false;
  for(let i=0;i<12;i++){
    const pebble=ball(1.25+i*.43,-1.45+rnd(-.12,.12),10.71,rnd(.14,.28),rnd(.1,.19),.08,i%5===0?M.pink:M.white);pebble.rotation.z=rnd(-.4,.4);
  }
  for(let i=0;i<4;i++){
    const mineral=mesh(new THREE.ConeGeometry(.12+rnd(0,.08),.18+rnd(0,.18),5),M.pink,root);mineral.position.set(2.2+i*.38,-1.37,10.72);mineral.rotation.x=Math.PI/2;
  }
  const glassEdge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(5.18,1.48,.025)),new THREE.LineBasicMaterial({color:0xafe5e8,transparent:true,opacity:.35}));root.add(glassEdge);glassEdge.position.set(3.65,-.78,10.67);
  // 天際偶發流星採用獨立位置動畫，保持几何体不在每帧重建。
  let meteorX=0,meteorY=0,meteorZ=-45;
  const meteorMat=new THREE.LineBasicMaterial({color:0xffe6c0,transparent:true,opacity:0,depthWrite:false});
  const meteor=new THREE.Line(new THREE.BufferGeometry().setFromPoints([v(0,0,0),v(-2.8,-1.05,0)]),meteorMat);scene.add(meteor);meteor.frustumCulled=false;
  let meteorStart=-100,meteorNext=34;
  animated.push(t=>{
    if(t>meteorNext){meteorStart=t;meteorNext=t+rnd(34,62);meteorX=rnd(-23,23);meteorY=rnd(19,28);meteorZ=-40-rnd(0,20)}
    const u=(t-meteorStart)/1.7;
    if(u>=0&&u<=1){meteor.position.set(meteorX+u*8,meteorY+u*3,meteorZ);meteor.material.opacity=Math.sin(u*Math.PI)*.9}
    else meteor.material.opacity=0;
  });

  function frame(){
    requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;const damp=1-Math.exp(-dt*9);
    orbit.azimuth=lerp(orbit.azimuth,orbit.goalAzimuth,damp);orbit.elevation=lerp(orbit.elevation,orbit.goalElevation,damp);orbit.zoom=lerp(orbit.zoom,orbit.goalZoom,damp);orbit.target.lerp(orbit.goalTarget,damp);
    camera.position.set(orbit.target.x+Math.sin(orbit.azimuth)*Math.cos(orbit.elevation)*orbit.radius,orbit.target.y+Math.sin(orbit.elevation)*orbit.radius,orbit.target.z+Math.cos(orbit.azimuth)*Math.cos(orbit.elevation)*orbit.radius);camera.lookAt(orbit.target);camera.zoom=orbit.zoom;camera.updateProjectionMatrix();
    starMat.uniforms.time.value=elapsed;
    warmMaterials.forEach((m,i)=>{const base=m===M.fire?2.2:m===M.gold?1.5:m===M.lantern?.85:.9;m.emissiveIntensity=base*(1+.035*Math.sin(elapsed*1.8+i*2)+.015*Math.sin(elapsed*5.3+i))});
    glowSprites.forEach(({s,base,phase})=>{s.material.opacity=base*(1+.055*Math.sin(elapsed*1.6+phase))});
    for(const fn of animated)fn(elapsed,dt);
    renderer.render(scene,camera);
  }
  frame();
  window.addEventListener('pagehide',()=>{renderer.dispose()},{once:true});
}
main().catch(error=>{console.error('温泉微缩景观启动失败：',error);const c=document.getElementById('world'),ctx=c.getContext('2d');if(ctx){c.width=innerWidth;c.height=innerHeight;const g=ctx.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#101d37');g.addColorStop(1,'#63738e');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height)}});
</script>
