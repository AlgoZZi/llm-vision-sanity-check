<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
<title id="title">爸爸，月光森林骑行手记</title>
<desc id="desc">深秋雨后的黑暗森林中，一只系着珊瑚红围巾的长颈鹿骑车穿过月光小径，双脚与踏板同步运动，车轮向前转动，树林和落叶分层后移。校验码777E0AEE。</desc>
