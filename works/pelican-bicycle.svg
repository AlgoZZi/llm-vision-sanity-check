<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A right-facing side view of a pelican on a teal bicycle. The long bill, throat pouch, extended wing and bent legs are visible. Both webbed feet rest on opposite pedals. The bicycle has a complete frame, spoked wheels, fork, handlebar, chain and crank.</desc>
