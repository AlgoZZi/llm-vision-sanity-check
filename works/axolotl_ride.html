  #menu{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:5;

  .btn{border:none;border-radius:999px;padding:8px 16px;font-size:16px;cursor:pointer;
    background:#eef1f6;color:#333;font-family:inherit;transition:transform .15s,background .25s,color .25s,box-shadow .25s}

  .btn:active{transform:scale(.95)}

  #hud{position:fixed;left:16px;bottom:12px;z-index:5;color:#fff;font-size:14px;

  .blinkLight{animation:blink 1.1s infinite}
  @keyframes warn{0%,50%{opacity:1}51%,100%{opacity:.25}}

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const OL = '#3b3346';
const GY = 540, PX = 330, SC = 0.8, SPEED = 340;
const SPAN_L = -90, SPAN_R = 96;              // 鹈鹕底盘在世界坐标里的左右范围（相对 PX）

/* ---------- 工具 ---------- */
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = Math.random;
const rand = (a, b) => a + R() * (b - a);
const f1 = n => Math.round(n * 10) / 10;
const pick = (r, a) => a[Math.floor(r() * a.length)];

// 一个周期 1200 的图层复制 4 份，平移时无缝衔接
function tile(str) {
  let s = '';
  for (const dx of [-1200, 0, 1200, 2400]) s += `<g transform="translate(${dx} 0)">${str}</g>`;
  return s;
}
// 若干圆拼成的团块（先画描边层，再画填充层）
function blob(list, fill, stroke, sw) {
  let a = '', b = '';
  for (const [x, y, r] of list) {
    if (stroke) a += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r + sw / 2)}" fill="${stroke}"/>`;
    b += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${fill}"/>`;
  }
  return a + b;
}
// 周期为 1200 的起伏山丘
function hillPath(base, amps, seed, fill) {
  const r = rng(seed), ks = [1, 2, 3, 4, 6, 8];
  const comps = amps.map((a, i) => [a, ks[i], r() * 6.2832]);
  const yAt = x => { let y = base; for (const [a, k, p] of comps) y += a * Math.sin(k * x * 6.2832 / 1200 + p); return y; };
  let d = 'M0 620';
  for (let x = 0; x <= 1200; x += 15) d += ` L${x} ${f1(yAt(x))}`;
  d += ' L1200 620 Z';
  return { svg: `<path d="${d}" fill="${fill}"/>`, yAt };
}
function cloud(x, y, s, fill, op) {
  return `<g opacity="${op}">${blob([[x, y, 20 * s], [x + 24 * s, y - 12 * s, 26 * s], [x + 52 * s, y - 4 * s, 22 * s], [x + 74 * s, y + 4 * s, 16 * s]], fill)}` +
    `<ellipse cx="${f1(x + 36 * s)}" cy="${f1(y + 10 * s)}" rx="${f1(56 * s)}" ry="${f1(12 * s)}" fill="${fill}"/></g>`;
}
function clouds(seed, fill, op, n) {
  const r = rng(seed); let s = '';
  for (let i = 0; i < n; i++) s += cloud(i * 1200 / n + r() * 120, 60 + r() * 110, 0.7 + r() * 0.7, fill, op);
  return s;
}
function flower(x, y, col, k = 1) {
  let s = `<line x1="${f1(x)}" y1="${f1(y)}" x2="${f1(x)}" y2="${f1(y + 11 * k)}" stroke="#3f9a3a" stroke-width="${f1(2 * k)}"/>`;
  for (let i = 0; i < 5; i++) {
    const a = i * 1.2566;
    s += `<circle cx="${f1(x + Math.cos(a) * 3.6 * k)}" cy="${f1(y + Math.sin(a) * 3.6 * k)}" r="${f1(2.8 * k)}" fill="${col}"/>`;
  }
  return s + `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(2.2 * k)}" fill="#ffd23f"/>`;
}
function leaf(x, y, rot, col, k = 1) {
  return `<path transform="translate(${f1(x)} ${f1(y)}) rotate(${Math.round(rot)}) scale(${k})" d="M0 -7 Q7 0 0 7 Q-7 0 0 -7 Z" fill="${col}" stroke="#8a3d1e" stroke-width="1"/>`;
}

/* ---------- 障碍物（局部坐标：左下角为原点，向上为负） ---------- */
const OBS = {
  rock: { w: 70, h: 46, svg:
    `<path d="M4 0 Q-2 -24 16 -38 Q34 -50 54 -40 Q72 -28 68 0 Z" fill="#9ea6b0" stroke="${OL}" stroke-width="3" stroke-linejoin="round"/>` +
    `<path d="M18 -30 Q30 -40 44 -37" stroke="#dfe4e9" stroke-width="4" fill="none" stroke-linecap="round"/>` +
    `<path d="M42 -14 l9 -7 M24 -10 l-5 -6" stroke="#6f7882" stroke-width="2.5" stroke-linecap="round"/>` +
    `<ellipse cx="30" cy="-43" rx="10" ry="4" fill="#7cc35a"/>` },
  fence: { w: 92, h: 62, svg:
    `<path d="M6 0 V-50 L13 -62 L20 -50 V0 Z M39 0 V-50 L46 -62 L53 -50 V0 Z M72 0 V-50 L79 -62 L86 -50 V0 Z" fill="#d39556" stroke="${OL}" stroke-width="3" stroke-linejoin="round"/>` +
    `<rect x="0" y="-44" width="92" height="9" rx="3" fill="#bb7f44" stroke="${OL}" stroke-width="3"/>` +
    `<rect x="0" y="-22" width="92" height="9" rx="3" fill="#bb7f44" stroke="${OL}" stroke-width="3"/>` +
    `<circle cx="13" cy="-39.5" r="1.8" fill="${OL}"/><circle cx="46" cy="-39.5" r="1.8" fill="${OL}"/><circle cx="79" cy="-39.5" r="1.8" fill="${OL}"/>` +
    `<circle cx="13" cy="-17.5" r="1.8" fill="${OL}"/><circle cx="46" cy="-17.5" r="1.8" fill="${OL}"/><circle cx="79" cy="-17.5" r="1.8" fill="${OL}"/>` },
  stump: { w: 64, h: 42, svg:
    `<path d="M4 0 Q10 -4 8 -34 L54 -34 Q52 -4 58 0 Z" fill="#9c6a3d" stroke="${OL}" stroke-width="3" stroke-linejoin="round"/>` +
    `<path d="M18 -26 V-6 M32 -28 V-4 M44 -24 V-8" stroke="#7d5230" stroke-width="2"/>` +
    `<ellipse cx="31" cy="-34" rx="23" ry="8" fill="#e8bd84" stroke="${OL}" stroke-width="3"/>` +
    `<ellipse cx="31" cy="-34" rx="14" ry="4.6" fill="none" stroke="#c08e55" stroke-width="2"/>` +
    `<ellipse cx="31" cy="-34" rx="6" ry="2" fill="none" stroke="#c08e55" stroke-width="2"/>` +
    `<path d="M50 -20 q8 -6 10 -14" stroke="#69c35a" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="60" cy="-36" r="4" fill="#69c35a"/>` },
  cactus: { w: 54, h: 97, svg:
    `<path d="M21 -44 H11 Q5 -44 5 -52 V-64 M33 -56 H43 Q49 -56 49 -62 V-76" fill="none" stroke="${OL}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<path d="M21 -44 H11 Q5 -44 5 -52 V-64 M33 -56 H43 Q49 -56 49 -62 V-76" fill="none" stroke="#5cb562" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<rect x="18" y="-90" width="18" height="90" rx="9" fill="#5cb562" stroke="${OL}" stroke-width="3"/>` +
    `<path d="M27 -84 V-6" stroke="#3f8f47" stroke-width="2.5" stroke-linecap="round"/>` +
    `<circle cx="27" cy="-92" r="5" fill="#ff6fa3" stroke="${OL}" stroke-width="2"/>` },
  sandstone: { w: 82, h: 56, svg:
    `<path d="M2 0 L6 -48 Q8 -56 18 -56 L64 -54 Q76 -54 78 -44 L80 0 Z" fill="#e0a75e" stroke="${OL}" stroke-width="3" stroke-linejoin="round"/>` +
    `<path d="M8 -36 Q40 -32 76 -38 M6 -18 Q40 -14 78 -20" stroke="#c48845" stroke-width="2" fill="none"/>` +
    `<path d="M50 -54 l-6 12 l6 8" stroke="#a86f35" stroke-width="2" fill="none"/>` +
    `<path d="M14 -48 Q24 -52 34 -50" stroke="#f3c88a" stroke-width="3" fill="none" stroke-linecap="round"/>` },
  pillar: { w: 72, h: 52, svg:
    `<rect x="2" y="-40" width="60" height="40" rx="6" fill="#ecd09b" stroke="${OL}" stroke-width="3"/>` +
    `<path d="M6 -30 H58 M6 -20 H58 M6 -10 H58" stroke="#cfae74" stroke-width="2"/>` +
    `<ellipse cx="62" cy="-20" rx="8" ry="20" fill="#f3dcae" stroke="${OL}" stroke-width="3"/>` +

    s += `<rect x="${f1(x)}" y="${f1(t)}" width="${f1(w + 0.6)}" height="${f1(h + 150)}" fill="${fill}"/>`;
    const q = r();
    if (q < 0.25) s += `<line x1="${f1(x + w / 2)}" y1="${f1(t)}" x2="${f1(x + w / 2)}" y2="${f1(t - 22)}" stroke="${fill}" stroke-width="3"/><circle cx="${f1(x + w / 2)}" cy="${f1(t - 23)}" r="2.5" fill="#ff5a4a"/>`;
    else if (q < 0.42) s += `<rect x="${f1(x + w * 0.2)}" y="${f1(t - 16)}" width="${f1(w * 0.3)}" height="16" fill="${fill}"/>`;
    else if (q < 0.55) s += `<path d="M${f1(x)} ${f1(t)} L${f1(x + w / 2)} ${f1(t - 20)} L${f1(x + w)} ${f1(t)} Z" fill="${fill}"/>`;

function drawLimb(pool, a, b, col, endCol) {
  const pts = [], seen = new Set();
  const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 3));
  for (let i = 0; i <= n; i++) {
    const x = Math.floor((a[0] + (b[0] - a[0]) * i / n) / PXS) * PXS;
    const y = Math.floor((a[1] + (b[1] - a[1]) * i / n) / PXS) * PXS;
    const k = x + ',' + y;
    if (!seen.has(k)) { seen.add(k); pts.push([x, y]); }
  }
  const last = pts[pts.length - 1];
  pts.push([last[0] + PXS, last[1]]);
  for (let i = 0; i < pool.length; i++) {
    const r = pool[i];
    if (i < pts.length) {
      r.setAttribute('x', pts[i][0]); r.setAttribute('y', pts[i][1]);
      r.setAttribute('fill', i >= pts.length - 2 ? endCol : col);
      r.style.display = '';
    } else r.style.display = 'none';
  }
}

// 根据障碍的高度和宽度算出跳多高、跳多久，保证越过
function planJump(o) {
  const H = Math.min(178, Math.max(118, o.h * 1.55 + 50));
  const need = (SPAN_R - SPAN_L + o.w) / SPEED * 1.22;
  const T = Math.max(1.0, need / Math.sqrt(1 - o.h / H));
  return { H, T };
}

function startJump(o) {
  const { H, T: dur } = planJump(o);
  let pose = Math.floor(R() * 3);
  if (pose === lastPose) pose = (pose + 1 + Math.floor(R() * 2)) % 3;
  lastPose = pose;
  jump = { t: 0, T: dur, H, pose };
  game.jumps++;
  const by = GY - 210, bx = PX + 30;
  if (pose === 0) { popup('叮铃铃~', bx, by, '#e0a800'); popup('嘎~!', PX + 205, GY - 150, '#ff7a1a'); }
  else if (pose === 1) popup('冲呀!', PX + 120, GY - 250, '#e8433a');
  else { popup('哇哦~!', PX + 20, GY - 280, '#8a4dff'); popup('嘎!', PX + 205, GY - 150, '#ff7a1a'); }
}

/* ---------- 每帧姿态 ---------- */
function computePose() {
  const P = {
    wingN: 5 * Math.sin(T * 3), wingF: 5 * Math.sin(T * 3 + 0.8), jaw: 0, head: 2.5 * Math.sin(T * 2.2),
    bikeLift: 0, bikeRot: 0, rotC: [0, -90], bell: 0, eye: blinkOn > 0 ? 'blink' : 'open',
    flare: 0, wind: false, sdx: 0, sdy: 0, handN: null, handF: null, footN: null, footF: null
  };
  if (!jump) return P;
  const u = Math.min(1, jump.t / jump.T), s = Math.sin(Math.PI * u);
  if (jump.pose === 0) {                         // 欢呼：翘前轮、举双手、猛扇翅膀
    P.wingN = 10 + 42 * s * (0.55 + 0.45 * Math.sin(T * 24));
    P.wingF = 10 + 42 * s * (0.55 + 0.45 * Math.sin(T * 24 + 0.6));
    P.jaw = 28 * s; P.head = -12 * s;
    P.bikeRot = -18 * s; P.rotC = [-56, 0];
    P.bell = 22 * Math.sin(T * 45) * s;
    P.eye = 'happy'; P.flare = s > 0.15 ? 1 : 0;
    P.handN = [SH_N[0] + 12 + 5 * Math.sin(T * 16), SH_N[1] - 34];
    P.handF = [SH_F[0] - 10 - 5 * Math.sin(T * 16 + 1), SH_F[1] - 32];
  } else if (jump.pose === 1) {                  // 超人：前倾滑翔、双手前伸、腿向后蹬
    P.wingN = 8 + 50 * s + 3 * Math.sin(T * 7);
    P.wingF = 8 + 46 * s + 3 * Math.sin(T * 7 + 0.5);
    P.jaw = 10 * s; P.head = -6 * s;
    P.bikeRot = 9 * s; P.rotC = [56, 0];
    if (s > 0.25) {
      P.sdx = 8; P.sdy = 8; P.wind = true;
      P.handN = [SH_N[0] + 40, SH_N[1] - 6]; P.handF = [SH_F[0] + 42, SH_F[1] - 2];
      P.footN = [HIP_N[0] - 46, HIP_N[1] + 22]; P.footF = [HIP_F[0] - 42, HIP_F[1] + 28];
    }
  } else {                                       // 后空翻：自行车离开鹈鹕背翻一圈
    const k = Math.min(1, Math.max(0, (u - 0.1) / 0.72));
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    P.bikeLift = -72 * s; P.bikeRot = -360 * e; P.rotC = [0, -100];
    P.jaw = 30 * s; P.head = -22 * s;
    P.wingN = 12 + 30 * s * (0.5 + 0.5 * Math.sin(T * 20));
    P.wingF = 12 + 30 * s * (0.5 + 0.5 * Math.sin(T * 20 + 0.7));
    P.eye = s > 0.3 ? 'happy' : P.eye; P.flare = 1;
  }
  return P;
}

function renderPlayer(P) {
  // 跳跃位置 + 起跳拉伸 / 落地压扁
  let sx = 1, sy = 1;
  if (jump) {
    const u = jump.t / jump.T;
    if (u < 0.15) { sy = 1 + 0.07 * (1 - u / 0.15); sx = 1 / sy; }
  } else if (landT < 0.8) {
    const k = 0.13 * Math.exp(-6 * landT) * Math.cos(landT * 22);
    sy = 1 - k; sx = 1 + k * 0.6;
  }
  E.player.setAttribute('transform', `translate(${PX} ${(GY - jumpY).toFixed(1)}) scale(${SC})`);
  E.squash.setAttribute('transform', `scale(${sx.toFixed(3)} ${sy.toFixed(3)})`);
  const bob = jump ? 0 : Math.sin(T * 14) * 1.6;
  E.pBody.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
  E.pWingN.setAttribute('transform', `translate(-18 -100) rotate(${P.wingN.toFixed(1)})`);
  E.pWingF.setAttribute('transform', `translate(-4 -112) rotate(${P.wingF.toFixed(1)})`);
  E.pHead.setAttribute('transform', `translate(140 -168) rotate(${P.head.toFixed(1)})`);
  E.pJaw.setAttribute('transform', `rotate(${P.jaw.toFixed(1)} 14 8)`);
  E.bike.setAttribute('transform', `translate(-10 ${(-142 + P.bikeLift).toFixed(1)}) rotate(${P.bikeRot.toFixed(1)} ${P.rotC[0]} ${P.rotC[1]})`);
  E.bell.setAttribute('transform', `rotate(${P.bell.toFixed(1)} 49 -112)`);

  const pd = (pwA * 57.2958).toFixed(1);
  for (const w of pSpins) w.setAttribute('transform', `rotate(${pd})`);
  const bd = (bwA * 57.2958).toFixed(1);
  E.bwR.setAttribute('transform', `rotate(${bd})`); E.bwF.setAttribute('transform', `rotate(${bd})`);

  // 曲柄与脚蹬
  const pN = [15 * Math.cos(crank), -36 + 15 * Math.sin(crank)];
  const pF = [-pN[0], -72 - pN[1]];
  E.crankN.setAttribute('x2', pN[0].toFixed(1)); E.crankN.setAttribute('y2', pN[1].toFixed(1));
  E.crankF.setAttribute('x2', pF[0].toFixed(1)); E.crankF.setAttribute('y2', pF[1].toFixed(1));
  E.pedalN.setAttribute('x', (pN[0] - 6).toFixed(1)); E.pedalN.setAttribute('y', (pN[1] - 2.5).toFixed(1));
  E.pedalF.setAttribute('x', (pF[0] - 6).toFixed(1)); E.pedalF.setAttribute('y', (pF[1] - 2.5).toFixed(1));

  // 美西螈：整体位置、眼睛、腮须
  const ox = AXO_X + P.sdx, oy = AXO_Y + P.sdy;
  const tr = `translate(${ox} ${oy})`;
  E.axoBack.setAttribute('transform', tr); E.axoFront.setAttribute('transform', tr); E.axoLimbs.setAttribute('transform', tr);
  renderAxo(P.eye);
  const wig = (Math.floor(T * 5) % 2) * -PXS;
  if (P.wind) {
    E.gillL.setAttribute('transform', `translate(${-PXS} ${wig})`);
    E.gillR.setAttribute('transform', `translate(${-PXS} ${-PXS - wig})`);
  } else if (P.flare) {
    const fw = (Math.floor(T * 12) % 2) * -PXS;
    E.gillL.setAttribute('transform', `translate(${-PXS} ${-PXS + fw})`);
    E.gillR.setAttribute('transform', `translate(${PXS} ${-PXS - PXS - fw})`);
  } else {
    E.gillL.setAttribute('transform', `translate(0 ${wig})`);
    E.gillR.setAttribute('transform', `translate(0 ${-PXS - wig})`);
  }
  // 四肢（转换到精灵局部坐标）
  const loc = p => [p[0] - ox, p[1] - oy];
  const grip = loc(GRIP);
  drawLimb(limbs.armN, SH_N, P.handN || grip, '#f27aa9', '#ffb3d3');
  drawLimb(limbs.armF, SH_F, P.handF || [grip[0] - 2, grip[1] + 2], '#d9588d', '#f08cb6');
  drawLimb(limbs.legN, HIP_N, P.footN || loc([pN[0] - 3, pN[1] - 4]), '#f27aa9', '#ffb3d3');
  drawLimb(limbs.legF, HIP_F, P.footF || loc([pF[0] - 3, pF[1] - 4]), '#d9588d', '#f08cb6');

  // 地面影子
  const k = Math.min(1, jumpY / 420);
  E.shadow.setAttribute('rx', (95 * (1 - k * 0.6)).toFixed(1));
  E.shadow.setAttribute('opacity', (0.22 * (1 - k * 0.7)).toFixed(3));
}

/* ---------- 主循环 ---------- */
function step(dt) {
  T += dt;
  game.dist += SPEED * dt;
  const D = game.dist;
  setX(E.clouds, D * 0.05 + T * 10);
  setX(E.far, D * 0.15);
  setX(E.mid, D * 0.45);
  setX(E.road, D);

  // 障碍：生成、移动、跳跃判定
  sinceSpawn += SPEED * dt;
  if (sinceSpawn >= nextGap) { spawnObstacle(); sinceSpawn = 0; nextGap = rand(820, 1500); }
  const pc = PX + (SPAN_L + SPAN_R) / 2;
  for (const o of obs) {
    o.x -= SPEED * dt;
    o.el.setAttribute('transform', `translate(${o.x.toFixed(1)} ${GY})`);
    if (!o.planned && !jump) {
      const { T: dur } = planJump(o);
      if (o.x + o.w / 2 - pc <= SPEED * dur / 2) { o.planned = true; startJump(o); }
    }
  }

  // 跳跃
  if (jump) {
    jump.t += dt;
    const u = jump.t / jump.T;
    if (u >= 1) { jump = null; jumpY = 0; landT = 0; dust(SEASONS[season].dust); }
    else jumpY = 4 * jump.H * u * (1 - u);
  } else landT += dt;

  // 碰撞统计（应始终为 0）与越过计数
  for (const o of obs) {
    if (!o.hit && o.x < PX + SPAN_R && o.x + o.w > PX + SPAN_L && jumpY < o.h) { o.hit = true; game.hits++; }
    if (!o.passed && o.x + o.w < PX + SPAN_L) { o.passed = true; game.cleared++; E.cnt.textContent = game.cleared; }
  }
  obs = obs.filter(o => { if (o.x + o.w < -160) { o.el.remove(); return false; } return true; });

  // 轮子、曲柄、眨眼
  pwA += dt * SPEED / (22 * SC);
  bwA += dt * SPEED / (40 * SC) * (jump ? 1.6 : 1);
  crank += dt * (jump ? 13 : 6.5);
  blinkT -= dt; blinkOn -= dt;
  if (blinkT <= 0) { blinkOn = 0.14; blinkT = rand(2, 5); }

  updateParticles(dt, T);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused) step(dt);
  renderPlayer(computePose());
  updateFx(paused ? 0 : dt);
  requestAnimationFrame(frame);
}

/* ---------- 菜单与键盘 ---------- */
let switching = false;
function switchSeason(name) {
  if (name === season || switching) return;
  switching = true;
  const fade = $('fade');
  fade.style.opacity = 1;
  setTimeout(() => { applySeason(name); fade.style.opacity = 0; switching = false; }, 360);
}
document.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => switchSeason(b.dataset.s)));
function togglePause() {
  paused = !paused;
  const b = $('pauseBtn');
  b.textContent = paused ? '▶ 继续' : '⏸ 暂停';
  b.classList.toggle('active', paused);
}
$('pauseBtn').addEventListener('click', togglePause);
window.addEventListener('keydown', e => {
  const map = { '1': 'spring', '2': 'summer', '3': 'autumn', '4': 'winter' };
  if (map[e.key]) switchSeason(map[e.key]);
  else if (e.code === 'Space') { e.preventDefault(); togglePause(); }
});

applySeason('spring');
requestAnimationFrame(frame);
})();
</script>
