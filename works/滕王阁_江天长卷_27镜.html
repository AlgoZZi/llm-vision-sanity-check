 if(Math.floor(now/100)!==Math.floor((now-dt*1000)/100)||!playing)updateUI();
}
document.addEventListener('visibilitychange',()=>{last=performance.now();fpsBegin=last;fpsFrames=0;});

reflectScene();renderer.render(scene,camera);$('loading').style.opacity='0';setTimeout(()=>$('loading').style.display='none',850);last=performance.now();requestAnimationFrame(frame);
