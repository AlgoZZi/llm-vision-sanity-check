<!doctype html>
<html lang="zh-CN" data-theme="dark" data-provider="google">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a12" />
    <meta
      name="description"
      content="LLM Vision 幻境展馆 —— 沉浸式数字美术馆，收藏 Anthropic、OpenAI 与 Google 多代模型创作的 3D 影像、动态插画与交互场景。"
    />
    <title>幻境展馆 · LLM Vision 模型作品展示</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=obsidian-1" />
    <script src="./app.js?v=obsidian-1" defer></script>
  </head>
  <body>
    <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="ic-prism" viewBox="0 0 24 24">
        <polygon
          points="12,3 21,19 3,19"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />
        <polygon points="12,8.5 16.5,16.8 7.5,16.8" fill="currentColor" opacity="0.22" />
        <circle cx="12" cy="14.2" r="1.4" fill="currentColor" />
      </symbol>
      <symbol id="ic-sidebar" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6" />
        <line x1="9" y1="4.5" x2="9" y2="19.5" stroke="currentColor" stroke-width="1.6" />
      </symbol>
      <symbol id="ic-grid" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="7" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6" />
        <rect x="13.5" y="3.5" width="7" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6" />
        <rect x="3.5" y="13.5" width="7" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6" />
        <rect x="13.5" y="13.5" width="7" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6" />
      </symbol>
      <symbol id="ic-prev" viewBox="0 0 24 24">
        <path d="M14.5 6.5 9 12l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="ic-next" viewBox="0 0 24 24">
        <path d="M9.5 6.5 15 12l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="ic-shuffle" viewBox="0 0 24 24">
        <path d="M16 4h4v4M4 18l5.5-5.5M20 4l-6.5 6.5M16 20h4v-4M4 6l16 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="ic-refresh" viewBox="0 0 24 24">
        <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3L20 9.4M20 4.5v5h-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="ic-cinema" viewBox="0 0 24 24">
        <path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9m6 0h3.5A1.5 1.5 0 0 1 20 5.5V9m0 6v3.5a1.5 1.5 0 0 1-1.5 1.5H15m-6 0H5.5A1.5 1.5 0 0 1 4 18.5V15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
      <symbol id="ic-exit-cinema" viewBox="0 0 24 24">
        <path d="M9 4v3.5A1.5 1.5 0 0 1 7.5 9H4m16 0h-3.5A1.5 1.5 0 0 1 15 7.5V4m0 16v-3.5a1.5 1.5 0 0 1 1.5-1.5H20M4 15h3.5A1.5 1.5 0 0 1 9 16.5V20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
      <symbol id="ic-external" viewBox="0 0 24 24">
        <path d="M14 4h6v6m0-6L10 14M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="ic-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="m16 16 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
      <symbol id="ic-close" viewBox="0 0 24 24">
        <path d="m6.5 6.5 11 11m0-11-11 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="ic-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
      <symbol id="ic-moon" viewBox="0 0 24 24">
        <path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
      </symbol>
      <symbol id="ic-chevron" viewBox="0 0 16 16">
        <path d="m6 4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="ic-spark" viewBox="0 0 24 24">
        <path d="M12 3l2.1 6.2L20.5 12l-6.4 2.8L12 21l-2.1-6.2L3.5 12l6.4-2.8L12 3Z" fill="currentColor" />
      </symbol>
      <symbol id="ic-cube" viewBox="0 0 24 24">
        <path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Zm0 0v9m0 0 8-4.5M12 12 4 7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      </symbol>
      <symbol id="ic-vector" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5" />
        <circle cx="9.2" cy="9.2" r="1.5" fill="currentColor" />
        <path d="m5.5 17.5 4.5-5 3.5 3.8 2.2-2.3 2.8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="ic-code" viewBox="0 0 24 24">
        <path d="m8.5 8-4 4 4 4m7-8 4 4-4 4m-2.5-10-2 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="ic-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M12 11v5.2m0-8.2h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
    </svg>

    <!-- Dynamic Ambient Aura -->
    <div class="ambient-backdrop" aria-hidden="true">
      <div class="aura-orb aura-orb-primary"></div>
      <div class="aura-orb aura-orb-secondary"></div>
      <div class="ambient-grid"></div>
    </div>

    <div id="app-shell" class="app-shell">
      <!-- Top Command Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button
            id="toggle-sidebar"
            class="icon-btn"
            type="button"
            title="收起/展开作品目录 (B)"
            aria-label="收起或展开作品目录"
            aria-expanded="true"
          >
            <svg class="ic"><use href="#ic-sidebar" /></svg>
          </button>

          <a href="#" id="brand-home" class="brand" aria-label="返回展馆首页">
            <span class="brand-mark">
              <svg class="ic"><use href="#ic-prism" /></svg>
            </span>
            <span class="brand-copy">
              <span class="brand-title">LLM VISION</span>
              <span class="brand-sub">幻境展馆</span>
            </span>
          </a>

          <span id="library-count-pill" class="count-pill">33 件馆藏</span>
        </div>

        <div class="topbar-center" aria-label="当前模型位置">
          <div class="breadcrumb">
            <span id="crumb-provider" class="crumb-provider">
              <span class="provider-dot" aria-hidden="true"></span>
              <span id="crumb-provider-text">Google</span>
            </span>
            <svg class="ic ic-xs crumb-sep" aria-hidden="true"><use href="#ic-chevron" /></svg>
            <span id="crumb-model" class="crumb-model">Gemini 4 Neon High Fast</span>
            <span id="crumb-note" class="crumb-note" hidden>Gemini Ultra 账号</span>
          </div>
        </div>

        <div class="topbar-actions">
          <button
            id="open-gallery-btn"
            class="action-btn"
            type="button"
            title="画廊总览矩阵 (G)"
          >
            <svg class="ic"><use href="#ic-grid" /></svg>
            <span class="btn-label">总览</span>
          </button>

          <div class="segmented-group" role="group" aria-label="切换作品">
            <button id="prev-work-btn" class="icon-btn" type="button" title="上一件作品 (←)" aria-label="上一件作品">
              <svg class="ic"><use href="#ic-prev" /></svg>
            </button>
            <button id="next-work-btn" class="icon-btn" type="button" title="下一件作品 (→)" aria-label="下一件作品">
              <svg class="ic"><use href="#ic-next" /></svg>
            </button>
          </div>

          <button id="random-work-btn" class="icon-btn" type="button" title="随机漫游 (R)" aria-label="随机切换作品">
            <svg class="ic"><use href="#ic-shuffle" /></svg>
          </button>

          <button id="reload-work-btn" class="icon-btn" type="button" title="重新加载当前作品" aria-label="重新加载当前作品">
            <svg class="ic"><use href="#ic-refresh" /></svg>
          </button>

          <button id="cinema-mode-btn" class="icon-btn" type="button" title="剧场沉浸模式 (F)" aria-label="切换剧场沉浸模式">
            <svg class="ic"><use href="#ic-cinema" /></svg>
          </button>

          <button id="theme-toggle-btn" class="icon-btn" type="button" title="切换暗夜 / 晴空主题" aria-label="切换浅色或深色主题">
            <svg class="ic ic-theme-sun"><use href="#ic-sun" /></svg>
            <svg class="ic ic-theme-moon"><use href="#ic-moon" /></svg>
          </button>

          <a
            id="open-original"
            class="primary-btn"
            target="_blank"
            rel="noopener noreferrer"
            title="在新标签页全屏打开原作品"
          >
            <svg class="ic"><use href="#ic-external" /></svg>
            <span class="btn-label">新窗口</span>
          </a>
        </div>
      </header>

      <!-- Workspace -->
      <div class="workspace">
        <!-- Mobile Backdrop -->
        <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

        <!-- Left Navigation Rail -->
        <aside id="sidebar" class="sidebar" aria-label="馆藏作品目录">
          <div class="sidebar-controls">
            <label class="search-box" aria-label="搜索作品或模型">
              <svg class="ic search-icon" aria-hidden="true"><use href="#ic-search" /></svg>
              <input
                id="search-input"
                type="search"
                placeholder="搜索作品、模型、Ultra…"
                autocomplete="off"
                spellcheck="false"
              />
              <kbd class="search-kbd" aria-hidden="true">/</kbd>
              <button id="search-clear" class="search-clear" type="button" aria-label="清空搜索" hidden>
                <svg class="ic"><use href="#ic-close" /></svg>
              </button>
            </label>

            <div id="provider-filters" class="filter-pills" role="tablist" aria-label="按厂商筛选"></div>
          </div>

          <nav id="work-list" class="work-list" aria-label="按厂商与模型浏览作品"></nav>

          <div id="sidebar-empty" class="sidebar-empty" hidden>
            <p>未找到匹配的作品</p>
            <button id="reset-filters-btn" class="ghost-btn" type="button">重置筛选</button>
          </div>

          <div class="sidebar-footer">
            <span class="shortcut-hint"><code>←</code> <code>→</code> 切换</span>
            <span class="shortcut-hint"><code>F</code> 剧场</span>
            <span class="shortcut-hint"><code>G</code> 总览</span>
          </div>
        </aside>

        <!-- Main Showcase Stage -->
        <main class="viewer" aria-labelledby="work-title">
          <section class="work-header">
            <div class="work-meta-main">
              <div class="work-title-row">
                <h1 id="work-title">加载中…</h1>
                <span id="work-index-badge" class="index-badge">01 / 33</span>
              </div>
              <p id="work-description" class="work-description"></p>
            </div>

            <div id="work-badges" class="work-badges" aria-label="作品属性标签"></div>
          </section>

          <section id="preview-stage" class="preview-stage" aria-busy="true">
            <div id="preview-content" class="preview-content"></div>

            <!-- Floating Cinema Bar (visible in cinema mode) -->
            <div class="cinema-floating-bar" aria-label="剧场模式控制条">
              <span id="cinema-work-title" class="cinema-title"></span>
              <div class="cinema-actions">
                <button id="cinema-prev-btn" class="cinema-btn" type="button" title="上一件 (←)" aria-label="上一件作品">
                  <svg class="ic"><use href="#ic-prev" /></svg>
                </button>
                <button id="cinema-next-btn" class="cinema-btn" type="button" title="下一件 (→)" aria-label="下一件作品">
                  <svg class="ic"><use href="#ic-next" /></svg>
                </button>
                <a id="cinema-open-btn" class="cinema-btn" target="_blank" rel="noopener noreferrer" title="新窗口打开">
                  <svg class="ic"><use href="#ic-external" /></svg>
                </a>
                <button id="cinema-exit-btn" class="cinema-btn cinema-btn-exit" type="button" title="退出剧场模式 (Esc / F)">
                  <svg class="ic"><use href="#ic-exit-cinema" /></svg>
                  <span>退出剧场</span>
                </button>
              </div>
            </div>

            <!-- Glass Loading Overlay -->
            <div id="preview-message" class="preview-message" role="status">
              <div class="loader-card">
                <div class="orbital-loader" aria-hidden="true">
                  <span class="ring ring-outer"></span>
                  <span class="ring ring-inner"></span>
                  <span class="core-dot"></span>
                </div>
                <div class="loader-text">
                  <strong id="loader-title">正在开启展厅…</strong>
                  <span id="loader-sub">正在载入作品资源与渲染管线</span>
                </div>
              </div>
            </div>
          </section>

          <footer class="stage-footer">
            <div class="stage-hint">
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-info" /></svg>
              <span id="work-hint"></span>
            </div>
            <div class="stage-file-meta">
              <span id="status-file" class="status-file"></span>
            </div>
          </footer>
        </main>
      </div>
    </div>

    <!-- Gallery Overview Modal -->
    <div id="gallery-modal" class="gallery-modal" role="dialog" aria-modal="true" aria-labelledby="gallery-modal-title" hidden>
      <div class="gallery-modal-backdrop" data-close-gallery></div>
      <div class="gallery-modal-panel">
        <header class="gallery-modal-header">
          <div class="gallery-modal-heading">
            <span class="brand-mark brand-mark-sm" aria-hidden="true">
              <svg class="ic"><use href="#ic-prism" /></svg>
            </span>
            <div>
              <h2 id="gallery-modal-title">馆藏作品总览</h2>
              <p id="gallery-modal-subtitle">按厂商、模型与介质探索全部 AI 视觉作品</p>
            </div>
          </div>

          <div class="gallery-modal-tools">
            <label class="search-box modal-search-box" aria-label="在总览中筛选作品">
              <svg class="ic search-icon" aria-hidden="true"><use href="#ic-search" /></svg>
              <input id="modal-search-input" type="search" placeholder="筛选作品名称、模型、备注…" autocomplete="off" />
            </label>
            <button id="close-gallery-btn" class="icon-btn" type="button" aria-label="关闭总览" data-close-gallery>
              <svg class="ic"><use href="#ic-close" /></svg>
            </button>
          </div>
        </header>

        <div id="modal-filter-bar" class="modal-filter-bar" role="tablist" aria-label="总览厂商筛选"></div>
        <div class="gallery-grid-scroll">
          <div id="gallery-grid" class="gallery-grid"></div>
        </div>
      </div>
    </div>

    <noscript>
      <p class="noscript-message">请启用 JavaScript 以浏览和交互体验馆藏作品。</p>
    </noscript>
  </body>
</html>
