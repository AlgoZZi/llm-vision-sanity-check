<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9cc7e8" />
    <meta name="description" content="一个带有 Windows 7 气息的小作品库，收藏不同模型生成的插画、动画与交互作品。" />
    <title>模型作品展示 · LLM Vision</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-folder" viewBox="0 0 24 24">
        <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H10l2 2h7.5A1.5 1.5 0 0 1 21 8.5V10H3Z" fill="#e6b84c" stroke="#a27f26" />
        <path d="M3 9h18l-1.2 10H4.2Z" fill="#ffe49a" stroke="#b88c30" stroke-linejoin="round" />
        <path d="M4.5 11h15" stroke="#fff6d5" />
      </symbol>
      <symbol id="icon-picture" viewBox="0 0 24 24">
        <path d="M3.5 4.5h17v15h-17z" fill="#fff" stroke="#7794aa" />
        <path d="M5.5 6.5h13v11h-13z" fill="#bfe3f4" />
        <circle cx="15.5" cy="9.5" r="1.5" fill="#fff8c8" />
        <path d="m5.5 16 4-5 3.5 4 2-2.5 3.5 5h-13Z" fill="#8bb67b" />
      </symbol>
      <symbol id="icon-html" viewBox="0 0 24 24">
        <path d="M5 2.5h9l5 5v14H5Z" fill="#fff" stroke="#8298aa" stroke-linejoin="round" />
        <path d="M14 2.5v5h5" fill="#dceaf4" stroke="#8298aa" />
        <path d="m9 11-3 3 3 3m6-6 3 3-3 3m-2-7-2 8" fill="none" stroke="#4184ab" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-chevron" viewBox="0 0 16 16">
        <path d="m6 4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-external" viewBox="0 0 20 20">
        <path d="M11 3h6v6m0-6-8 8M8 5H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-info" viewBox="0 0 20 20">
        <circle cx="10" cy="10" r="7" fill="#e7f3fc" stroke="#648fab" />
        <path d="M10 9v5m0-8v.2" stroke="#36729d" stroke-width="1.7" stroke-linecap="round" />
      </symbol>
    </svg>

    <div class="desktop">
      <div class="explorer-window">
        <header class="titlebar">
          <div class="window-title">
            <svg class="icon window-icon" aria-hidden="true"><use href="#icon-picture" /></svg>
            <h1>模型作品展示</h1>
          </div>
          <span class="titlebar-note">LLM Vision Sanity Check</span>
        </header>

        <div class="window-body">
          <div class="toolbar">
            <div class="address-bar" aria-label="当前位置">
              <svg class="icon address-icon" aria-hidden="true"><use href="#icon-folder" /></svg>
              <span class="address-root">作品库</span>
              <svg class="chevron" aria-hidden="true"><use href="#icon-chevron" /></svg>
              <span id="address-model">Claude Sonnet 5.5</span>
            </div>
            <a id="open-original" class="aero-button" target="_blank" rel="noopener noreferrer">
              <svg class="icon" aria-hidden="true"><use href="#icon-external" /></svg>
              <span>新窗口打开</span>
            </a>
          </div>

          <div class="workspace">
            <aside class="sidebar" aria-label="作品列表">
              <div class="library-heading">
                <svg class="icon" aria-hidden="true"><use href="#icon-folder" /></svg>
                <span>作品库</span>
                <span class="library-count">18 个作品</span>
              </div>
              <nav id="work-list" class="work-list" aria-label="按模型浏览作品"></nav>
              <div class="sidebar-footnote">插画 · 动画 · 交互</div>
            </aside>

            <main class="viewer" aria-labelledby="work-title">
              <div class="preview-heading">
                <div class="preview-description">
                  <h2 id="work-title">鹈鹕骑车 · 3D</h2>
                  <p id="work-description">一只骑着自行车的鹈鹕，在三维场景中前行。</p>
                </div>
                <span id="work-format" class="format-label">HTML</span>
              </div>

              <div id="preview-stage" class="preview-stage" aria-busy="true">
                <div id="preview-content" class="preview-content"></div>
                <div id="preview-message" class="preview-message" role="status">
                  <span class="loading-indicator" aria-hidden="true"></span>
                  <span>正在打开作品…</span>
                </div>
              </div>

              <div class="preview-footer">
                <svg class="icon" aria-hidden="true"><use href="#icon-info" /></svg>
                <p id="work-hint">可拖动旋转视角，滚轮缩放。此作品需要联网加载 Three.js。</p>
              </div>
            </main>
          </div>

          <footer class="statusbar">
            <span id="status-model">Claude Sonnet 5.5</span>
            <span class="status-divider" aria-hidden="true"></span>
            <span id="status-file" class="status-file">3d-tihu.html</span>
            <span id="status-position" class="status-position">1 / 18</span>
          </footer>
        </div>
      </div>
      <p class="desktop-caption">一点想象，一些像素。</p>
    </div>
    <noscript><p class="noscript-message">请启用 JavaScript，以切换和预览作品。</p></noscript>
  </body>
</html>
